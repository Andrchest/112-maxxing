[project]
name = "sim112-workspace"
version = "0.1.0"
description = "Workspace root for the System-112/DDS training simulator (not published)."
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "workers/voice_agent", "benchmarks"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "ruff",
    "mypy",
    "types-PyYAML",
    "httpx",
]
# I3 E2a (HLD 70 §70.6.1, A-13): the reader the reference-pack import tool needs —
# `backend/tools/import_classifier.py` reads the organizer's classifier xlsx. Tools only: never
# imported by `backend/app` (`backend/tests/unit/reference/test_reference_pack.py` asserts it),
# not needed by the gate (the manifest sha check is stdlib) and installed on demand with
# `uv sync --all-packages --group dev --group tools --inexact`. The «СЛУЖБЫ 112» docx needs no
# reader: its content is the hand transcription, and its sha256 is plain `hashlib`.
# I5 E41 (HLD 71 §71.12, Q-E23-2): `py7zr` extracts the ФНС КЛАДР `base.7z` for
# `backend/tools/import_kladr_streets.py`. Tools only, same discipline as `openpyxl` above — the
# raw archive is never committed, so the extractor (and the test that regenerates from it) is
# skipped wherever this group is not installed.
tools = [
    "openpyxl>=3.1,<4",
    "py7zr>=0.21,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Python tooling only: `docs/` (design docs, code fences included, are never reformatted — see
# docs/SPEC.md and docs/hld/00-decisions.md) and `frontend/` (owned by the npm/eslint/prettier
# toolchain) are out of scope for ruff, and so is `requirements/sources/` (organizer and owner
# source files archived verbatim — never edited, so never reformatted).
extend-exclude = ["docs", "frontend", "requirements/sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# UP042: docs/hld/10-domain-model.md §10.2 fixes every domain enum as `class X(str, Enum)` whose member
# name is its wire value; that decision wins over the StrEnum rewrite.
# RUF001-003: Russian UI/caller strings are mandated (owner decision); Cyrillic is not "ambiguous unicode".
ignore = ["UP042", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
# defaults are fine; format is enabled by using `ruff format`.

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.application.*"]
strict = true

# Heavy ML packages (E12): only installed via the `asr-gigaam`/`asr-whisper`/`vad-silero` extras
# (backend/pyproject.toml), never a hard dependency, and imported lazily inside adapter
# warm_up()/constructors. mypy runs against the plain dev venv (no extras) in `make gate`, so it
# has no stubs for these — ignore missing imports for exactly these modules, nothing broader.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchaudio.*",
    "transformers.*",
    "onnxruntime.*",
    "faster_whisper.*",
    "hydra.*",
    "omegaconf.*",
    "sentencepiece.*",
]
ignore_missing_imports = true

# I4 E35 (HLD 71 §71.12, D35): `spylls` is a hard dependency (`backend/pyproject.toml`) but ships
# no `py.typed`/stubs. Imported lazily inside `SpellingDictionary._read`, never at module import
# time (same discipline as the extras above).
[[tool.mypy.overrides]]
module = ["spylls.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `benchmarks/tests` (E19-A) is gate-side by construction: it runs every SPEC §35 benchmark
# script's `main()` with `--provider fake` and asserts the HLD 60 §7.0 envelope's shape. It needs
# no GPU, no model file and no network, so it belongs in the ordinary gate run — the real runs are
# the `make bench-*` targets, which are never part of `gate` (D13).
testpaths = ["backend/tests", "workers/voice_agent/tests", "benchmarks/tests"]
markers = [
    "integration: requires live PostgreSQL/Redis test infra (make infra-up)",
    "requires_models: requires real ML model weights/extras to be installed",
    "requires_livekit: requires a live LiveKit server on SIM_LIVEKIT_URL (E11)",
]
