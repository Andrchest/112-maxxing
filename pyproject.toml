[project]
name = "sim112-workspace"
version = "0.1.0"
description = "Workspace root for the System-112/DDS training simulator (not published)."
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "workers/voice_agent", "benchmarks"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "ruff",
    "mypy",
    "types-PyYAML",
    "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Python tooling only: `docs/` (design docs, code fences included, are never reformatted — see
# docs/SPEC.md and docs/hld/00-decisions.md) and `frontend/` (owned by the npm/eslint/prettier
# toolchain) are out of scope for ruff.
extend-exclude = ["docs", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# UP042: docs/hld/10-domain-model.md §10.2 fixes every domain enum as `class X(str, Enum)` whose member
# name is its wire value; that decision wins over the StrEnum rewrite.
# RUF001-003: Russian UI/caller strings are mandated (owner decision); Cyrillic is not "ambiguous unicode".
ignore = ["UP042", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
# defaults are fine; format is enabled by using `ruff format`.

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.application.*"]
strict = true

# Heavy ML packages (E12): only installed via the `asr-gigaam`/`asr-whisper`/`vad-silero` extras
# (backend/pyproject.toml), never a hard dependency, and imported lazily inside adapter
# warm_up()/constructors. mypy runs against the plain dev venv (no extras) in `make gate`, so it
# has no stubs for these — ignore missing imports for exactly these modules, nothing broader.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchaudio.*",
    "transformers.*",
    "onnxruntime.*",
    "faster_whisper.*",
    "hydra.*",
    "omegaconf.*",
    "sentencepiece.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests", "workers/voice_agent/tests"]
markers = [
    "integration: requires live PostgreSQL/Redis test infra (make infra-up)",
    "requires_models: requires real ML model weights/extras to be installed",
    "requires_livekit: requires a live LiveKit server on SIM_LIVEKIT_URL (E11)",
]
