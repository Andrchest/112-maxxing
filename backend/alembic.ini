# Alembic configuration (HLD 20-db-schema.md, D5: one linear history, async SQLAlchemy 2).
#
# Run from the repository root: `uv run alembic -c backend/alembic.ini upgrade head`
# (the `migrate` / `db-check` Makefile targets do exactly that).
#
# There is deliberately no `sqlalchemy.url` here: the URL comes from `Settings.database_url`
# (environment variable `SIM_DATABASE_URL`) inside `env.py`, so no connection string is ever
# committed (D1, SPEC §41).

[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = %(here)s
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
