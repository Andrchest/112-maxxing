profile_name: DEV_3060TI
description: >
  Development profile for a DEDICATED RTX 3060 Ti 8 GB (nothing else resident on the card).
  LLM: Qwen3.5-2B Q4_K_M on GPU, one llama-server serving both the interpreter (slot 0) and the
  generator (slot 1) via --parallel 2 (OWNER DECISION 2026-09-21, task reports e13-b3/e13-b4).
  ASR: GigaAM v3_e2e_ctc on GPU. TTS: Qwen3-TTS on GPU (OWNER DECISION, E14), PiperTTS (CPU) as
  the configured fallback. For a card another process already occupies — this machine's actual
  state today, ~4.6 GB held by the owner — use DEV_3060TI_SHARED instead (additive, not in SPEC
  §26; see that file).

hardware:
  gpu_name_contains: "3060 Ti"
  gpu_total_vram_mb: 8192
  # OWNER DECISION 2026-09-21: this profile assumes a DEDICATED card (nothing else resident).
  # DEV_3060TI_SHARED is the profile for the ~4.6 GB shared-card case this machine actually
  # measures today (see that file's hardware.reserved_by_others_mb: 4700).
  reserved_by_others_mb: 512

vram_budget_mb: 7168
min_vram_margin_mb: 512
# MEASURED for real (task report E19-D3, 2026-09-22): benchmarks/benchmark_vram.py --profile
# DEV_3060TI --provider real --turns 20, the owner's GPU process (PID 1082982) stopped for this
# run, freeing the card. VAD -> ASR (GigaAM, 1530 MB) -> TTS (Qwen3-TTS 0.6B worker, 2373 MB) ->
# LLM (Qwen3.5-2B --parallel 2, 1559 MB) -> 20 sequential turns, all completed: status OK,
# project_peak_mb 5560 (peak_mb 5910 - baseline_used_mb 350), free_min_mb 2281. Margin:
# 7168 - 5560 = 1608 >= 512, passes outright. History: two earlier attempts on the SHARED card
# (owner's process still resident, ~3.2 GB free) came back PARTIAL — the TTS step OOM'd/timed out
# before this one ever reached the LLM step; superseded, not this profile's story any more.
# docs/benchmarks/results/vram-DEV_3060TI-20260922T092121636Z.json, docs/benchmarks/vram.md.
measured_peak_vram_mb: 5560
measured_at: 2026-09-22

llm:
  provider: llama_cpp
  # OWNER DECISION 2026-09-21: Qwen3.5-2B Q4_K_M for BOTH the interpreter and the generator, one
  # llama-server --parallel 2 (task report e13-b3, interpreter: p50 221 ms / p95 279 ms, 1490 MB
  # single-slot; task report e13-b4, generator: p50 178 ms / p95 349 ms, 1558 MB with both slots
  # loaded — the combined 2-slot figure this profile budgets against above). Ran GPU_FULL(999) in
  # both measurements, hence n_gpu_layers: -1 below.
  # SPEC §26's "local Qwen3-4B quantized" stays a SUPPORTED choice (commented alternative):
  #   model_name: Qwen3-4B
  #   model_path: /models/llm/Qwen3-4B-Q4_K_M.gguf
  #   n_gpu_layers: 32   # partial offload — MEASURED interpret-only p50 1174 ms / p95 3718 ms,
  #                      # task report e13-b3; its generator call OOM'd under --parallel 2 (task
  #                      # report e13-b4), so it is not this profile's default.
  model_name: Qwen3.5-2B
  model_path: /models/llm/Qwen3.5-2B-Q4_K_M.gguf
  quantization: Q4_K_M
  base_url: http://llama-server:8080/v1
  n_ctx: 4096
  n_gpu_layers: -1
  n_batch: 512
  n_ubatch: 256
  parallel_slots: 2
  flash_attention: "on"
  kv_cache_type: q8_0
  # 138 / 80 — E13-B3 / E13-B4 measured p99 completion-token counts + 25% headroom, across the
  # eval set's 4-model run (see backend/app/config/settings.py's llm_interpreter_max_tokens /
  # llm_generator_max_tokens comments for the exact arithmetic); reused here rather than the
  # illustrative 200 of docs/hld/60-inference-ops.md §2.1's summary table, which predates the
  # measurement and is not itself a measured number.
  max_response_tokens: 80
  interpreter_max_tokens: 138
  request_timeout_ms: 3000
  thinking_enabled: false

asr:
  provider: gigaam
  model_version: v3_e2e_ctc
  model_path: /models/asr/gigaam-v3-e2e-ctc
  device: cuda
  compute_type: float16
  sample_rate: 16000

tts:
  provider: qwen3_tts             # OWNER DECISION (E14): GPU default for every profile, DEV incl.
  # BASE dir, SIM_TTS_QWEN3_MODEL_DIR; the separate tts_qwen3 worker process (own venv) appends
  # the configured variant's own subdirectory (E14-D) — never opened by the backend/voice-agent.
  model_path: /models/tts/qwen3-tts
  voice_id: Serena                # vendor CustomVoice speaker (recon §1.1) — not a free voice id
  device: cuda
  output_sample_rate: 24000
  max_chunk_ms: 20
  fallback_provider: piper        # PiperTTS, CPU — the configured fallback (D9)
  fallback_model_path: /models/tts/piper/ru_RU-irina-medium.onnx
  fallback_voice_id: ru_RU-irina-medium
  fallback_output_sample_rate: 22050
  # ADDITIVE (E18-A, R2), maps to SIM_TTS_QWEN3_MODEL. The standalone tts_qwen3 worker reads it
  # from `infra/.env.profile` (`make profile-env`, E20) — under compose and `make run-tts-qwen3`
  # alike — and the voice agent through `Settings.tts_model_variant`.
  # MEASURED 2026-09-22, the whole DEV stack on a free card (benchmark_vram.py, 20 turns):
  #   0.6B -> project peak 5560 MB, LLM GPU_FULL, margin 1608 MB
  #          (docs/benchmarks/results/vram-DEV_3060TI-20260922T092121636Z.json)
  #   1.7B -> project peak 7448 MB > vram_budget_mb 7168; only 2013 MB left for the LLM, which
  #          fell back to GPU_PARTIAL (23 layers) = slower caller replies
  #          (docs/benchmarks/results/vram-DEV_3060TI-20260922T192503527Z.json, E20-I)
  # So DEV_3060TI ships 0.6B — the variant its measured_peak_vram_mb describes and the one
  # `make models` downloads. 1.7B (the owner's evaluated checkpoint; RTF 0.823 vs 0.848, i.e. a
  # quality choice, not a speed one) needs a card with ~2 GB more headroom or the LLM partly on
  # CPU; select it with `make models-tts-qwen3 QWEN3_TTS_VARIANT=1.7B` + this key.
  model_variant: "0.6B"
  # ADDITIVE (E20-I). Qwen3-TTS is WHOLE-UTTERANCE (qwen_tts 0.1.1 has no streaming API): its first
  # chunk arrives only when the whole unit is synthesised. MEASURED first-audio latency, 0.6B on
  # this card (docs/benchmarks/results/tts-DEV_3060TI-20260922T045733Z.json, n=90): p50 4130 ms,
  # p95 11078 ms, max 14771 ms. With the Settings default guard (1500 ms, sized for streaming
  # providers) every turn timed out and the caller was silent (E20-I proof). Guards sized from the
  # measurement: first chunk >= p95 rounded up, the unit >= max rounded up. The caller's first
  # audio is therefore ~4 s after the trainee stops at p50 — the known Qwen3-TTS latency item
  # recorded for the owner (docs/benchmarks/tts.md), not hidden by a tighter guard.
  first_chunk_timeout_ms: 12000
  timeout_ms: 15000
  # ADDITIVE (E20-G/G6): the scenario's `caller_profile.voice_id` is a SCENARIO-LOGICAL casting
  # decision (HLD 30 §"caller_profile"), not a provider voice name; only a model profile knows
  # what this provider calls its voices, so the logical -> native table lives here. Every logical
  # id `scenarios/examples` uses is listed (`grep -rn voice_id scenarios/`). An id NOT listed
  # resolves to `default_voice` with one WARN — it is never an error (E20-C's §46 walk item 3:
  # the old hard `ValueError` on an unmapped id left the caller silent on this very profile).
  # `Serena` is the female vendor CustomVoice speaker the owner's other project maps every female
  # logical voice onto (`~/911-trainee-simulator/tools/qwen3_tts_worker.py:67-70`:
  # `female`/`female_alt`/`female_calm`/`elderly_female` -> `Serena`), so the same casting
  # decision is carried over rather than re-invented.
  # I3 E6c (HLD 80 §80.4.1): the ДДС phone's personas (`reference/personas/v1.yaml`). The male
  # speakers were verified against the INSTALLED `qwen_tts` 0.1.1 (workers/tts_qwen3/.venv): the
  # package's `get_supported_speakers()` is the checkpoint's `talker_config.spk_id` — aiden, dylan,
  # eric, ono_anna, ryan, serena, sohee, uncle_fu, vivian — of which the worker allows the four
  # `VENDOR_SPEAKERS` (Serena, Ryan, Vivian, Aiden); Ryan and Aiden are the male ones there (the
  # owner's other project maps `male` -> Ryan, `teen_male` -> Aiden). Piper has no male voice on
  # disk: under the Piper fallback every id below resolves to ru_RU-irina-medium (REQ-4041 partial).
  voice_map:
    ru_female_adult_01: Serena    # scenarios/examples/apartment-fire/v1.yaml; personas 103, DEPARTMENT, OPERATOR_112
    ru_male_adult_01: Ryan        # personas BRIGADE_101, BRIGADE_102, CITY_DEFAULT
    ru_male_adult_02: Aiden       # personas BRIGADE_104, DDS_DISTRICT, DDS_PREFECTURE
  default_voice: Serena           # vendor CustomVoice speaker; every unmapped logical id

vad:
  provider: silero
  model_path: /models/vad/silero_vad.onnx
  device: cpu

voice_turn:
  speech_start_threshold: 0.55
  speech_end_threshold: 0.35
  speech_start_min_ms: 96
  endpoint_silence_ms: 300
  pre_roll_ms: 300
  barge_in_min_speech_ms: 120
  max_turn_ms: 30000
  min_turn_ms: 200
  vad_frame_ms: 32
  outbound_queue_ms: 200
  tts_chunk_ms: 20
  partial_asr_enabled: true
  partial_interval_ms: 500
  reconnect_grace_s: 30   # ADDITIVE (E18-A, R6): HLD 60 §6 row 5 / SPEC §39 item 5 default

warmup:
  enabled: true
  asr_sample_path: /models/warmup/warmup_ru.wav
  llm_prompt: "Скажи одно слово."
  tts_text: "Проверка."
  timeout_ms: 60000

latency_targets:
  p50_ms: 1500
  p95_ms: 2500

health:
  failure_threshold: 3
  rewarm_interval_s: 30

# I3 E6f (HLD 80 §80.8.3, ТЗ ¶161 REQ-2139). MEASURED 2026-09-24, benchmark_voip.py --path
# sip-livekit --concurrent 1 (the real SIP-leg + SFU path, one host clock, GPU-free):
# docs/benchmarks/results/voip-DEV_3060TI-20260924T162420139Z.json, docs/benchmarks/voip.md. This
# is the highest concurrency at which sip-livekit's own p95 <= 150 ms and RTP/burst loss < 1 % —
# --concurrent 5 already misses the delay target (p95 1319 ms) and --concurrent 10 additionally
# shows real burst-detection loss (47.7 %), both measured and recorded in voip.md, not hidden here
# because this field is singular (one N, one p50/p95 triple) per HLD 80 §80.8.3. The `sip-loopback`
# gateway-only reference meets target through the full swept range (up to 40, also in voip.md) —
# the ceiling below is this benchmark's own single-process harness sharing the gateway, N SIP UAs
# and 2N LiveKit room connections in one interpreter, not a SIP/RTP-gateway or SFU capacity number
# (voip.md's "Why sip-livekit degrades" section); REQ-2138's "20 simultaneous sessions" is
# therefore UNMEASURED as a real multi-process/AI-in-the-loop figure (docs/AUDIT.md).
voip:
  one_way_delay_ms_p50: 95.831
  one_way_delay_ms_p95: 108.561
  concurrent_calls_measured: 1
