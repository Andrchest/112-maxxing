profile_name: FINAL_3080TI_12GB
description: >
  Demo profile for an RTX 3080 Ti 12 GB. Qwen3-8B Q4_K_M only if the VRAM benchmark passes with
  the configured margin; otherwise config validation refuses the profile (measured_peak_vram_mb is
  null below, which — unlike DEV_* — is an outright ProfileRefused for a FINAL_* profile, HLD 60
  §2.5). No number in this file has been measured on a 3080 Ti. NOT_RUN 2026-09-22: no RTX 3080 Ti
  and no Qwen3-8B GGUF on the dev machine; on the target card run `make models-llm-qwen3-8b &&
  make bench-vram PROFILE=FINAL_3080TI_12GB` and paste its `project_peak_mb` here with
  `measured_at` (E19-F; the download target itself is defined at Makefile `models-llm-qwen3-8b`).

hardware:
  gpu_name_contains: "3080 Ti"
  gpu_total_vram_mb: 12288
  reserved_by_others_mb: 0

vram_budget_mb: 11000
min_vram_margin_mb: 1024
measured_peak_vram_mb: null      # must be measured; null is REFUSED for FINAL_* profiles (HLD 60 §2.5)
measured_at: null

llm:
  provider: llama_cpp
  model_name: Qwen3-8B
  model_path: /models/llm/Qwen3-8B-Q4_K_M.gguf
  quantization: Q4_K_M
  base_url: http://llama-server:8080/v1
  n_ctx: 4096
  n_gpu_layers: -1
  n_batch: 1024
  n_ubatch: 512
  parallel_slots: 2
  flash_attention: "on"
  kv_cache_type: f16
  # 138 / 80 — the same E13-B3/E13-B4 measured p99 + 25% headroom used by the DEV profiles
  # (backend/app/config/settings.py); not re-measured on Qwen3-8B specifically. NOT_RUN 2026-09-22:
  # no RTX 3080 Ti and no Qwen3-8B GGUF on the dev machine; on the target card run
  # `make models-llm-qwen3-8b && make bench-vram PROFILE=FINAL_3080TI_12GB` and paste its
  # `project_peak_mb` here with `measured_at` (E19-F) — reused rather than the illustrative,
  # never-measured 200 of docs/hld/60-inference-ops.md §2.1's table.
  max_response_tokens: 80
  interpreter_max_tokens: 138
  request_timeout_ms: 3000
  thinking_enabled: false

asr:
  provider: gigaam
  model_version: v3_e2e_ctc
  model_path: /models/asr/gigaam-v3-e2e-ctc
  device: cuda
  compute_type: float16
  sample_rate: 16000

tts:
  provider: qwen3_tts
  # BASE dir (SIM_TTS_QWEN3_MODEL_DIR); the separate tts_qwen3 worker process appends the
  # configured variant's own subdirectory (E14-D).
  model_path: /models/tts/qwen3-tts
  voice_id: Serena                # vendor CustomVoice speaker (recon §1.1) — not a free voice id
  device: cuda
  output_sample_rate: 24000
  max_chunk_ms: 20
  fallback_provider: piper
  fallback_model_path: /models/tts/piper/ru_RU-irina-medium.onnx
  fallback_voice_id: ru_RU-irina-medium
  fallback_output_sample_rate: 22050
  # UNVERIFIED on a 3080 Ti. NOT_RUN 2026-09-22: no RTX 3080 Ti and no Qwen3-8B GGUF on the dev
  # machine; on the target card run `make models-llm-qwen3-8b && make bench-vram
  # PROFILE=FINAL_3080TI_12GB` and paste its `project_peak_mb` here with `measured_at` (E19-F).
  model_variant: null

vad:
  provider: silero
  model_path: /models/vad/silero_vad.onnx
  device: cpu

voice_turn:
  speech_start_threshold: 0.55
  speech_end_threshold: 0.35
  speech_start_min_ms: 96
  endpoint_silence_ms: 300
  pre_roll_ms: 300
  barge_in_min_speech_ms: 120
  max_turn_ms: 30000
  min_turn_ms: 200
  vad_frame_ms: 32
  outbound_queue_ms: 200
  tts_chunk_ms: 20
  partial_asr_enabled: true
  partial_interval_ms: 500
  reconnect_grace_s: 30

warmup:
  enabled: true
  asr_sample_path: /models/warmup/warmup_ru.wav
  llm_prompt: "Скажи одно слово."
  tts_text: "Проверка."
  timeout_ms: 60000

latency_targets:
  p50_ms: 1200
  p95_ms: 2000

health:
  failure_threshold: 3
  rewarm_interval_s: 30
