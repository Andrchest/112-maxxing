[project]
name = "sim-backend"
version = "0.1.0"
description = "System-112/DDS training simulator — backend (FastAPI app, package `app`)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "redis>=5",
    "pyyaml",
    "pyjwt",
    "argon2-cffi",
    "httpx",
    # The voice path's audio maths (E11): the `Resampler` and `EnergyVAD` are numpy, not a
    # hand-rolled loop over `array`. Not an optional extra — `app.application.voice` is imported
    # by the backend itself and numpy is pure-CPU, ~15 MB, and already a `sim-voice-agent` dep.
    "numpy",
]

# Heavy ML dependencies are optional extras (D1); adapters import them lazily.
# Left empty-but-named here — filled in E12 (ASR/VAD) and E14 (TTS).
[project.optional-dependencies]
asr-gigaam = []
asr-whisper = []
vad-silero = []
tts-piper = []
tts-qwen3 = []
tts-chatterbox = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
