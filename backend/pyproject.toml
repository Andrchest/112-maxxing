[project]
name = "sim-backend"
version = "0.1.0"
description = "System-112/DDS training simulator — backend (FastAPI app, package `app`)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "redis>=5",
    "pyyaml",
    "pyjwt",
    "argon2-cffi",
    "httpx",
    # The voice path's audio maths (E11): the `Resampler` and `EnergyVAD` are numpy, not a
    # hand-rolled loop over `array`. Not an optional extra — `app.application.voice` is imported
    # by the backend itself and numpy is pure-CPU, ~15 MB, and already a `sim-voice-agent` dep.
    "numpy",
]

# Heavy ML dependencies are optional extras (D1); adapters import them lazily (E12: warm_up()/
# constructor only, never at module import — `import app.inference.asr`/`app.inference.vad` must
# work in the plain dev venv without any of these installed).
[project.optional-dependencies]
# GigaAMProvider (backend/app/inference/asr/gigaam_provider.py): loads the local HF-format
# checkpoint (`AutoModel.from_pretrained(..., trust_remote_code=True)`), which pulls in torch,
# torchaudio (imported by modeling_gigaam.py even though we bypass its ffmpeg-based `transcribe`),
# transformers, hydra-core/omegaconf (the model config is a Hydra/OmegaConf tree) and
# sentencepiece (the v3_e2e_ctc tokenizer; v3_ctc is char-vocab and does not need it, but both
# checkpoints share the same modeling_gigaam.py import list).
asr-gigaam = [
    # >=2.6 is a hard floor, not a preference: transformers' `check_torch_load_is_safe` (CVE-2025-32434)
    # refuses to `torch.load` this checkpoint's legacy-pickle `pytorch_model.bin` on any older torch,
    # even with `weights_only=True` — measured against this checkpoint on 2026-09-21.
    "torch>=2.6,<2.9",
    "torchaudio>=2.6,<2.9",
    "transformers>=4.44,<5",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    "sentencepiece>=0.2,<0.3",
]
# FasterWhisperProvider (backend/app/inference/asr/faster_whisper_provider.py): optional fallback.
asr-whisper = ["faster-whisper>=1.0,<2"]
# SileroVAD (backend/app/inference/vad/silero_vad.py): onnxruntime CPU execution provider only.
vad-silero = ["onnxruntime>=1.19,<2"]
# PiperTTS (backend/app/inference/tts/piper_tts.py): pure CPU, in-process (E14-B). `piper-tts`'s
# own onnxruntime floor (>=1.10) is below the `vad-silero` extra's `>=1.19,<2` pin, so both extras
# resolve to one onnxruntime in the same venv without conflict — not verified with a real `uv
# sync` here (this task's machine rules forbid one in the repo root); see this task's report.
tts-piper = ["piper-tts>=1.2,<2"]
# Qwen3TTS (backend/app/inference/tts/qwen3_tts.py) is an httpx client of the standalone
# `workers/tts_qwen3/` worker process (own venv, `qwen-tts==0.1.1` pins torch==2.14.0, outside
# `asr-gigaam`'s torch<2.9 ceiling) — this extra stays empty on purpose: the backend venv never
# installs qwen-tts/torch==2.14.0 itself, only `httpx`, already a hard dependency above.
tts-qwen3 = []
tts-chatterbox = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
