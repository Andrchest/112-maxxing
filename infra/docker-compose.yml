# The local development stack (SPEC §36, §41, D1, HLD 60 §9).
#
# The SPEC §36 seven, named exactly: `postgres`, `redis`, `livekit`, `backend`, `frontend`,
# `llama-server`, `voice-agent`. A plain `docker compose -f infra/docker-compose.yml up` starts
# exactly those seven and nothing else — `tts-qwen3` is an ADDITIVE eighth service (not in SPEC §36;
# HLD 60 §9/§10.4 and E14-B's OWNER DECISION moved Qwen3-TTS into its own worker process/venv,
# reached over loopback HTTP, never imported by `backend`/`voice-agent`), gated behind
# `profiles: ["qwen3-tts"]` so it only starts with `docker compose --profile qwen3-tts up`.
# `sip-gateway` (I3 E6a, HLD 80 §80.2) is a second additive service under `profiles: ["sip"]`
# (`docker compose --profile sip up`): SIP 5060 udp+tcp and RTP 20000-20199/udp on the host.
# `edge` (I4 E27, D32) is the Caddy TLS endpoint on 443, under `profiles: ["tls"]`.
#
# This file is for `make dev-infra-up` and the new `make up` (the seven, or all eight with
# `TTS_COMPOSE_PROFILE=qwen3-tts make up` — see the Makefile). CORRECTED (E20-D2, 2026-09-22):
# `dev-infra-up` passes no service filter, so it starts the same seven containers `make up` does,
# not "three infra services only" as this comment used to claim — README.md's Host-run section
# documents the explicit `docker compose ... up postgres redis livekit` filter for an infra-only
# start. It is **not** the test stack: `infra/docker-compose.test.yml` owns that, uses tmpfs
# storage and different ports,
# and the two are meant to be able to run side by side. No port here is 8000, 8001, 8011, 8012 or
# 8016 — those belong to another project on the developer machine.
#
# Every secret comes from the environment (`.env`, see `.env.example`); SPEC §41 forbids a real
# credential in source, and the defaults below are the same fake dev placeholders `.env.example`
# documents. `make compose-check` renders this file against `infra/compose.check.env`'s throwaway
# (>= 32-byte) placeholders so the gate can validate the compose YAML with no real `.env` present.

name: sim112dev

services:
  postgres:
    image: postgres:16
    # docker-init as PID 1: a healthcheck probe killed on timeout leaves an orphaned pg_isready that a
    # postmaster-as-PID-1 would reap and misread as a crashed backend (full crash recovery). Same fix
    # and full explanation in docker-compose.test.yml.
    init: true
    environment:
      POSTGRES_USER: ${SIM_POSTGRES_USER:-sim}
      POSTGRES_PASSWORD: ${SIM_POSTGRES_PASSWORD:-sim}
      POSTGRES_DB: ${SIM_POSTGRES_DB:-sim}
    ports:
      # I4 E26 (¶295 REQ-2243, D33): loopback only. A classroom box has no reason to expose the
      # database off-host, and the old bare "15432:5432" bound every interface.
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIM_POSTGRES_USER:-sim} -d ${SIM_POSTGRES_DB:-sim}"]
      interval: 2s
      timeout: 2s
      retries: 30
    # I4 E26 (¶288 REQ-2237, D33): the classroom box restarts itself; this container was missing
    # a restart policy while every app-process service already had one.
    restart: unless-stopped

  redis:
    image: redis:7
    # I4 E26 (¶295 REQ-2243, D33): redis had no `requirepass` at all — any host on this network
    # could read/write session state. SIM_REDIS_PASSWORD is the same value backend/voice-agent/
    # sip-gateway embed in their SIM_REDIS_URL below; a dev placeholder ships so `make up` needs no
    # `.env` edit, same posture as SIM_POSTGRES_PASSWORD's `sim` default.
    command: ["redis-server", "--requirepass", "${SIM_REDIS_PASSWORD:-dev-redis-password-change-me}"]
    ports:
      # I4 E26 (¶295 REQ-2243, D33): loopback only, same reasoning as postgres above.
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SIM_REDIS_PASSWORD:-dev-redis-password-change-me}", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    # I4 E26 (¶288 REQ-2237, D33): see postgres above.
    restart: unless-stopped

  livekit:
    # Pinned, never `:latest`: an SFU that changes under a running demo is a demo that fails for
    # reasons nobody can reproduce (HLD 60 §6).
    image: livekit/livekit-server:v1.13.7
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      # `livekit-server` takes its key/secret pairs from this one variable, as `key: secret`.
      # The values come from the same `.env` the backend reads, so the token the backend mints
      # and the token this server verifies are signed with one secret (D9).
      LIVEKIT_KEYS: "${SIM_LIVEKIT_API_KEY:-devkey}: ${SIM_LIVEKIT_API_SECRET:-devsecret1234567890}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # 7880 signalling (HTTP/WebSocket), 7881 TCP media fallback, 7882/udp media.
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    healthcheck:
      # The SFU serves `/` on its signalling port; answering at all is the readiness fact the
      # backend's own `livekit` probe reads (`app.infrastructure.health.livekit_probe`).
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7880/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    # I4 E26 (¶288 REQ-2237, D33): see postgres above.
    restart: unless-stopped

  llama-server:
    # Pinned ggml-org/llama.cpp CUDA server tag — never `:latest` (HLD 60 §8/§9: a flag change
    # upstream would silently alter the launch line). `server-cuda-b11065` was confirmed to exist
    # via `docker manifest inspect` (read-only, no pull) on 2026-09-22; the exact FLAG SPELLING for
    # this tag remains UNVERIFIED until it is actually run (E19) — see docs/hld/60-inference-ops.md
    # §8/§10 item 3. Override with LLAMA_CPP_IMAGE if a newer/verified tag is chosen later.
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b11065}
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_VISIBLE_DEVICES:-0}"]
              capabilities: ["gpu"]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      # SIM_LLAMA_SERVER_BIN is the ABSOLUTE path of the server binary inside this pinned image.
      # VERIFIED 2026-09-22 (E20-G): `docker run --rm --entrypoint ls
      # ghcr.io/ggml-org/llama.cpp:server-cuda-b11065 -l /app/llama-server` ->
      # `-rwxr-xr-x 1 root root 17880 Sep 21 05:51 /app/llama-server` (exit 0). The bare name
      # `llama-server` is NOT on this image's PATH: E20-C's `make up` attempt died with
      # `/entrypoint.sh: line 65: exec: llama-server: not found`. Override if a different image tag
      # puts the binary elsewhere.
      SIM_LLAMA_SERVER_BIN: ${SIM_LLAMA_SERVER_BIN:-/app/llama-server}
    # `infra/.env.profile` is written by `make profile-env` (`app.config.profile_env --emit-env`,
    # E18-E) from the active profile's `llm.*` block — the SIM_LLAMA_* flags this entrypoint reads.
    # It is gitignored; `make up`/`make run-llama-server` regenerate it before starting.
    # `required: false` so `make compose-check` (no `.env`/`.env.profile` present) still renders.
    env_file:
      - path: .env.profile
        required: false
    volumes:
      # MODELS_DIR is resolved by compose against THIS FILE's directory (`infra/`), not against the
      # repo root and not against the shell's cwd — so the repo's `models/` is `../models` here.
      # Absolute paths work too. (E20-G: `.env.example` used to say `./models`, which silently
      # mounted an empty auto-created `infra/models`.)
      - ${MODELS_DIR:-../models}:/models:ro
      - ./scripts/llama-server-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    # No `ports:` mapping (SPEC §41, HLD 60 §9): reachable only as `http://llama-server:8080`
    # inside the compose network, matching `LlamaCppClient`'s loopback/compose-internal validation.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    # `required: false` so `make compose-check` (no `.env` present) still renders (R10 of the E18
    # brief); a real run needs a real `.env` (`cp .env.example .env`) regardless.
    # I5 E37 (Q-E16-1): `.env.settings` is `make settings-import`'s own output — gitignored, absent
    # until an ADMIN's `exportSettingsXml` + `make settings-import` writes it, same `required:
    # false` treatment as `.env.profile` below. Listed after `../.env` so an imported, non-secret
    # setting overrides that file's own value; `environment:` below still wins over both, exactly
    # as it already does over `../.env` alone.
    env_file:
      - path: ../.env
        required: false
      - path: .env.settings
        required: false
    environment:
      # Compose-internal service hostnames override `.env`'s host-oriented defaults (which target
      # the published dev ports 15432/16379/7880 for a bare `make run-api` on the host).
      SIM_DATABASE_URL: postgresql+asyncpg://${SIM_POSTGRES_USER:-sim}:${SIM_POSTGRES_PASSWORD:-sim}@postgres:5432/${SIM_POSTGRES_DB:-sim}
      # Container mount point for the models volume; overrides a host `.env` value such as
      # `SIM_MODELS_ROOT=./models` (E20 R15 — `environment:` wins over `env_file`).
      SIM_MODELS_ROOT: /models
      # I4 E26 (D33): matches the redis service's `--requirepass` above.
      SIM_REDIS_URL: redis://:${SIM_REDIS_PASSWORD:-dev-redis-password-change-me}@redis:6379/0
      SIM_LIVEKIT_URL: ws://livekit:7880
      SIM_LIVEKIT_PUBLIC_URL: ${SIM_LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      SIM_API_HOST: 0.0.0.0
      SIM_API_PORT: "8100"
      SIM_MODEL_PROFILE: ${SIM_MODEL_PROFILE:-DEV_3060TI}
      SIM_DATA_DIR: /data
      SIM_LLM_BASE_URL: http://llama-server:8080/v1
      # I3 E2a: the reference pack baked into the image by backend/Dockerfile (HLD 70 §70.6.1).
      SIM_REFERENCE_DIR: /workspace/reference
      # I4 E27 (§71.4): behind the `edge` proxy every request arrives from the edge container, so
      # uvicorn must trust its X-Forwarded-For/-Proto or the audit log (E25) records the edge's
      # address for every user. Docker's default bridge pool is 172.16.0.0/12; Caddy itself drops
      # a client-supplied X-Forwarded-For and writes the real peer address.
      FORWARDED_ALLOW_IPS: ${SIM_FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      # I4 E29 (§71.6, D33): `getBackupStatus`/`listAdminAlerts`/`purgeRecordings`'s guard read
      # the same `./backups/last.json` the `backup` service below writes, through a read-only bind
      # of the same host directory (the backup service does not mount a *named* volume for it).
      SIM_BACKUP_STATUS_PATH: /backups/last.json
    volumes:
      - recordings-data:/data
      - ../backups:/backups:ro
    ports:
      - "${SIM_API_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8100/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8100
      # I4 E27 (§71.4): the edge forwards the browser's own Host header; Vite accepts localhost and
      # any IP by default, and every other name (the server's hostname) must be listed here.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    ports:
      # 5173 is the repo's existing Vite dev port (already referenced by `.env.example`'s
      # SIM_CORS_ALLOW_ORIGINS) — not 8000/8001, which belong to another project on this machine.
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      # The `node:22-slim` base has NEITHER `wget` NOR `curl` (verified 2026-09-22, E20-G:
      # `docker run --rm --entrypoint sh sim112dev-frontend -c 'which wget curl node'` prints only
      # `/usr/local/bin/node`; the old `wget` probe exited 127 inside the container, so the service
      # was permanently `unhealthy` and `make up --wait` could never exit 0). Node 22 has a global
      # `fetch`, so the probe uses the one runtime the image is guaranteed to have. Kept in step
      # with `frontend/Dockerfile`'s own HEALTHCHECK.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  voice-agent:
    build:
      context: ..
      dockerfile: workers/voice_agent/Dockerfile
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_VISIBLE_DEVICES:-0}"]
              capabilities: ["gpu"]
    env_file:
      - path: ../.env
        required: false
    environment:
      SIM_DATABASE_URL: postgresql+asyncpg://${SIM_POSTGRES_USER:-sim}:${SIM_POSTGRES_PASSWORD:-sim}@postgres:5432/${SIM_POSTGRES_DB:-sim}
      # I4 E26 (D33): matches the redis service's `--requirepass` above.
      SIM_REDIS_URL: redis://:${SIM_REDIS_PASSWORD:-dev-redis-password-change-me}@redis:6379/0
      SIM_LIVEKIT_URL: ws://livekit:7880
      # Container mount point for the models volume; overrides a host `.env` value such as
      # `SIM_MODELS_ROOT=./models` (E20 R15 — `environment:` wins over `env_file`).
      SIM_MODELS_ROOT: /models
      SIM_MODEL_PROFILE: ${SIM_MODEL_PROFILE:-DEV_3060TI}
      SIM_DATA_DIR: /data
      SIM_LLM_BASE_URL: http://llama-server:8080/v1
      SIM_TTS_QWEN3_BASE_URL: http://tts-qwen3:8112
      # E20-G: the ASR warm-up sample is read by RAW path (no `SIM_MODELS_ROOT` resolution), so
      # the host-relative value in `.env` (`models/warmup/warmup_ru.wav`) does not exist inside
      # this container and the agent would silently warm on a 440 Hz tone — which is what made
      # preflight check 5 red on a healthy stack. Pin the mounted path here.
      SIM_ASR_WARMUP_SAMPLE_PATH: /models/warmup/warmup_ru.wav
      # loopback only, INSIDE this container (R7 of the E18 brief) — never published to the host.
      SIM_VOICE_AGENT_HTTP_PORT: ${SIM_VOICE_AGENT_HTTP_PORT:-8113}
    volumes:
      - ${MODELS_DIR:-../models}:/models:ro
      - recordings-data:/data
      # Read-only, for `make preflight` only (E20): under compose the preflight runs INSIDE this
      # container — the one vantage point that reaches every dependency (its own loopback 8113,
      # `llama-server:8080`, `/models`, the GPU) — and check #10 validates `scenarios/examples`
      # relative to the WORKDIR /workspace. See infra/scripts/preflight.sh.
      - ../scenarios:/workspace/scenarios:ro
      # I3 E2a: preflight check #10's scenario validation checks service ids and the pack name
      # against the reference pack (rules R37/R38, HLD 70 §70.6.1), found at the repository
      # layout's `/workspace/reference`.
      - ../reference:/workspace/reference:ro
    # Publishes NO port (HLD 60 §9). Does not hard-depend on `tts-qwen3`: that service is the
    # profiled eighth and a plain `up` (the SPEC's seven) never starts it — `Qwen3TTS`'s httpx
    # client fails its own calls if unreachable, exactly like any other TTS-provider failure
    # (SPEC §39 #2, TTS failure -> configured fallback).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
      llama-server:
        condition: service_healthy
    # HLD 60 §9's documented healthcheck. `voice_agent.cli`'s `health` subcommand is built
    # (`workers/voice_agent/voice_agent/cli.py`): it exits 0 only when this agent is up and warm.
    healthcheck:
      test: ["CMD-SHELL", "python -m voice_agent.cli health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  sip-gateway:
    # I3 E6a (docs/hld/80-telephony.md §80.2, D22): our own software SIP server — registrar with
    # Digest, UAS for INVITE/ACK/BYE/CANCEL/OPTIONS, RTP G.711 — that bridges each call into the
    # call's LiveKit room as one more participant. ADDITIVE and profiled, like `tts-qwen3`: only
    # `docker compose --profile sip up` starts it; a plain `up` stays the SPEC §36 seven. Built from
    # the voice-agent Dockerfile with ONLY the `transport-livekit` extra (no GPU stack, no
    # `runtime: nvidia`): the gateway loads no model. It refuses to start without
    # `SIM_SIP_PASSWORD` in `.env` (never committed, SPEC §41).
    # I3 E6e (§80.2.3, D27): wired to the backend — every number but the echo 999 goes to
    # `/api/v1/telephony/*` with `SIM_SIP_GATEWAY_SECRET` (from `.env`; it refuses to start with a
    # backend URL and no secret), INVITEs are Digest-challenged (`SIM_SIP_INVITE_AUTH`), and every
    # registration is mirrored to `sip:binding:{username}` in Redis. Set
    # `SIM_TELEPHONY_ENDPOINTS=browser,sip` on the backend for a registered softphone to win.
    profiles: ["sip"]
    build:
      context: ..
      dockerfile: workers/voice_agent/Dockerfile
      args:
        VOICE_AGENT_EXTRAS: transport-livekit
    command: ["python", "-m", "voice_agent.sip_gateway"]
    env_file:
      - path: ../.env
        required: false
    environment:
      # I4 E26 (D33): matches the redis service's `--requirepass` above.
      SIM_REDIS_URL: redis://:${SIM_REDIS_PASSWORD:-dev-redis-password-change-me}@redis:6379/0
      SIM_LIVEKIT_URL: ws://livekit:7880
      SIM_SIP_BIND_HOST: 0.0.0.0
      SIM_SIP_PORT: "5060"
      SIM_SIP_RTP_PORT_RANGE: "20000-20199"
      # Loopback INSIDE this container (the healthcheck below); never published to the host.
      SIM_SIP_GATEWAY_HTTP_PORT: "8114"
      SIM_SIP_BACKEND_URL: http://backend:8100
      SIM_SIP_INVITE_AUTH: ${SIM_SIP_INVITE_AUTH:-challenge}
    ports:
      # SIP signalling (udp+tcp) and the RTP range, published so softphones on other
      # workstations reach them; SDP advertises SIM_SIP_MEDIA_IP (the host's LAN address).
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "20000-20199:20000-20199/udp"
    depends_on:
      livekit:
        condition: service_started
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8114/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  tts-qwen3:
    # ADDITIVE eighth service (E14-B, HLD 60 §9/§10.4) — Qwen3-TTS lives in its own worker
    # process/venv (`workers/tts_qwen3/`), never imported by `backend`/`voice-agent`
    # (`backend/tools/check_imports.py`). Only started with `docker compose --profile qwen3-tts up`
    # (or `TTS_COMPOSE_PROFILE=qwen3-tts make up`); a plain `up` is the SPEC §36 seven.
    profiles: ["qwen3-tts"]
    build:
      context: ../workers/tts_qwen3
      dockerfile: Dockerfile
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${NVIDIA_VISIBLE_DEVICES:-0}"]
              capabilities: ["gpu"]
    # The model VARIANT comes from the active profile (E20): `make profile-env` (run by `make up`)
    # writes `SIM_TTS_QWEN3_MODEL=<tts.model_variant>` into `.env.profile`; DEV_3060TI ships 0.6B,
    # the variant its measured VRAM peak describes. Absent a variant the worker keeps its default.
    env_file:
      - path: .env.profile
        required: false
    environment:
      SIM_TTS_QWEN3_MODEL_DIR: /models/qwen3-tts
      SIM_TTS_QWEN3_PORT: "8112"
      # Container-internal bind. The worker defaults to loopback (correct for a host run); inside
      # this container it must listen on every interface or `voice-agent` cannot reach it at
      # `http://tts-qwen3:8112` (HLD 60 §9). This is NOT an exposure: the service publishes no
      # host port, so 8112 is reachable only from the compose network.
      SIM_TTS_QWEN3_HOST: 0.0.0.0
      # E20-G found this image could not SYNTHESISE (no C compiler for qwen_tts's Triton JIT, no
      # `sox`; /warm_up + /synthesize answered 503). FIXED E20-I: workers/tts_qwen3/Dockerfile
      # installs build-essential + sox in a late layer; /warm_up 200 in 25.9 s, a Russian line
      # synthesised in 4.3 s on the RTX 3060 Ti (docs/DOD_WALK.md §7).
    volumes:
      - ${MODELS_DIR:-../models}:/models:ro
      - recordings-data:/data
    # `workers/tts_qwen3/tts_qwen3/__main__.py` binds `SIM_TTS_QWEN3_HOST` (loopback by default),
    # which the environment above sets to `0.0.0.0` so `voice-agent` reaches it at
    # `http://tts-qwen3:8112` as HLD 60 §9 promises. No host port is published (HLD 60 §9).
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
      llama-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8112/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  backup:
    # I4 E26 (¶143 REQ-2126, ¶286 REQ-2235, ¶193 REQ-2164, ¶390 REQ-2321, D33; scheme
    # puml/i4-backup-restore.puml). `postgres:16` is already local (the `postgres` service above
    # pulls it), so this adds no new image. Unprofiled: a plain `make up` runs it, same as the
    # SPEC §36 seven — it is not one of them, but nothing gates it behind a profile either.
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${SIM_POSTGRES_USER:-sim}
      PGPASSWORD: ${SIM_POSTGRES_PASSWORD:-sim}
      PGDATABASE: ${SIM_POSTGRES_DB:-sim}
      SIM_BACKUP_KEEP: ${SIM_BACKUP_KEEP:-14}
      SIM_BACKUP_INTERVAL_SECONDS: ${SIM_BACKUP_INTERVAL_SECONDS:-86400}
      SIM_BACKUP_DIR: /backups
      SIM_RECORDINGS_DIR: /recordings
    volumes:
      - ./scripts/backup-once.sh:/scripts/backup-once.sh:ro
      - ./scripts/backup-loop.sh:/scripts/backup-loop.sh:ro
      - ./scripts/backup_status.py:/scripts/backup_status.py:ro
      # `recordings-data` read-only: this service only ever reads it to archive it (D33).
      - recordings-data:/recordings:ro
      # A host bind, not a named volume: `make restore FILE=…`/`make backup-verify` and a human
      # operator both need to reach these files directly from the repo checkout (D33, RUNBOOK).
      - ../backups:/backups
    entrypoint: ["/bin/bash", "/scripts/backup-loop.sh"]
    # No model, no GPU, no LiveKit dependency: a heartbeat file is the only liveness signal there
    # is between two daily runs, so the healthcheck accepts anything younger than 26h — the same
    # staleness threshold S5/E29's `listAdminAlerts` BACKUP_STALE reads from `last.json` (§71.3
    # puml note); `backup-loop.sh` touches it at start-up and after every attempt.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/backup-heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/backup-heartbeat) )) -lt 93600 ]"]
      interval: 1h
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  edge:
    # I4 E27 (docs/hld/71-i4-wave4.md §71.4, D32; scheme puml/i4-tls-edge-topology.puml): the one
    # TLS endpoint (Caddy) on 443 in front of the frontend, `/api` + `/api/v1/ws`, and LiveKit's
    # `/rtc` signalling — browsers grant the microphone only in a secure context, so a classroom PC
    # must open https://<server>, never http://<server-LAN-IP>. Routes live in `edge/Caddyfile`.
    # Profiled (`--profile tls`, or `COMPOSE_PROFILES=tls` in `.env`): it cannot start before
    # `infra/scripts/make-certs.sh` has issued `infra/certs/server.{crt,key}` for this server's LAN
    # IP/hostname, and a plain `make up` must keep working on a box where that has not happened yet.
    # With the edge up, set SIM_LIVEKIT_PUBLIC_URL=wss://<host> (`.env.example`, I4 E27 section).
    # SIP stays plain (Q-E15-2): `sip-gateway` is not behind this edge.
    profiles: ["tls"]
    # Pinned by digest (caddy 2.11.4, pulled 2026-09-25), never a floating tag, same rule as
    # livekit above.
    image: caddy:2.11.4@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    environment:
      # Compose service names by default; point them at host-run processes for a host run.
      SIM_EDGE_FRONTEND_UPSTREAM: ${SIM_EDGE_FRONTEND_UPSTREAM:-frontend:5173}
      SIM_EDGE_BACKEND_UPSTREAM: ${SIM_EDGE_BACKEND_UPSTREAM:-backend:8100}
      SIM_EDGE_LIVEKIT_UPSTREAM: ${SIM_EDGE_LIVEKIT_UPSTREAM:-livekit:7880}
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      # The server certificate and key only — the CA key (`infra/certs/ca.key`) never enters a
      # container. `infra/certs/` is git-ignored (SPEC §41). Long syntax with `create_host_path:
      # false`: before make-certs.sh has run, `up` fails naming the missing file, instead of Docker
      # creating an empty directory at that path (which would then break make-certs.sh).
      - type: bind
        source: ./certs/server.crt
        target: /certs/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./certs/server.key
        target: /certs/server.key
        read_only: true
        bind:
          create_host_path: false
    ports:
      # SIM_EDGE_HTTPS_BIND narrows the listen address when another process already owns 443 on
      # one of this host's addresses (a VPN's own 443, for instance) — binding 0.0.0.0 then fails.
      - "${SIM_EDGE_HTTPS_BIND:-0.0.0.0}:${SIM_EDGE_HTTPS_PORT:-443}:443"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      livekit:
        condition: service_started
    healthcheck:
      # Through the edge to the backend's liveness route: TLS up, routing up. Liveness, not trust:
      # the container holds no CA file (only server.crt/.key), hence --no-check-certificate.
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  # Recordings (R10 of the E18 brief: "named volumes for postgres and recordings"), shared by
  # `backend` (report UI reads WAVs) and `voice-agent`/`tts-qwen3` (write them). A named volume,
  # not a host bind mount, for the containerized stack — purge/retention runs inside the container
  # that holds it (`docker compose exec backend python -m app.cli purge_recordings`).
  recordings-data:
