[project]
name = "sim-voice-agent"
version = "0.1.0"
description = "System-112/DDS training simulator — voice-agent worker process (package `voice_agent`)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sim-backend",
    "numpy",
]

[tool.uv.sources]
sim-backend = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]
