# Card schema v2 — the organizer's 112 card (HLD 70 §70.5, D17; I3 E3a). Authored by hand.
#
# Sources (read-only, never copied into the repo):
#   «КАРТОЧКА 112.docx»            requirements/sources/01-qna-session-telegram/files/ — the «Что
#                                   случилось» list (text + images 1–13) and the 101 walkthrough
#                                   (images 14–39); cited below as "card image N".
#   «СКРИНШОТ КАРТОЧКИ 112ГСИ.docx» same directory — the whole card (image1), 101/Дом (image2–4),
#                                   the 104 block (image6), the Взрыв block (image8); cited as "gsi
#                                   image N".
#   requirements/normalized/SRC-001-domain-docs.md REQ-3001…3008, REQ-3014 (and REQ-3015/3016 for
#   the phone/foreign-number/foreign-language controls the screenshots show as icons).
#   «Инструкция_по_заведению_карточки_2507ГСИ.docx» same directory — the card instruction (I7 E55:
#                                   caller statuses, «Канал связи», «Количество» of the injured,
#                                   «Отказ от реагирования», the 1999-character description); cited
#                                   as "instr ¶N" (the N-th <w:p> of word/document.xml) / "instr
#                                   fig. N" (its «Рисунок N»).
#
# Shape: `parse_card_schema` (backend/app/domain/layers/card_schema.py). Omitted keys take their
# defaults: enum_name null, scoring_relevant / required_for_handoff / required_in_block /
# routing_relevant false, options / visible_when null; `order` is the field's position inside its
# group, in file order.
#
# Card ↔ classifier binding (D18 applied, B1 §4): a questionnaire chip's `code` is the признак
# text exactly as reference/classifier/v046_24.json carries it; a yes/no that is a routing
# sub-column condition carries the flag key of v046_24.columns.json `flags` (its «Нет» carries
# `<flag>:no` and `routing: none`); a «Что случилось» entry carries the classifier `group_no` it
# opens; address.okrug / address.district carry the catalog's `okrug` / `district` strings. A chip
# that stands for several признаки lists them in `classifier_features`; an option bound to nothing
# in the classifier says `routing: none`. A BOOLEAN toggle's one option is the code it stands for
# when on. Codes of options outside the binding (non-routing fields) are UPPER_SNAKE or `yes`/`no`.
#
# Paths (HLD 70 §70.5.3): a field that means the same as a v1 field reuses the v1 path.
schema_id: v2
source: КАРТОЧКА 112.docx + СКРИНШОТ КАРТОЧКИ 112ГСИ.docx (hand-authored, I3 E3a)
groups:
- {id: header, label_ru: Телефоны заявителя}
- {id: applicant, label_ru: Заявитель}
- {id: address, label_ru: Адрес}
- {id: description, label_ru: Описание со слов заявителя}
- {id: flags, label_ru: Признаки вызова}
- {id: incident, label_ru: Что случилось}
- {id: q_fire, label_ru: Происшествие 101}
- {id: q_gas, label_ru: Происшествие 104}
- {id: q_explosion, label_ru: 'П: Взрыв'}
- {id: q_ambulance, label_ru: Происшествие 103}
- {id: services, label_ru: Службы}
fields:
  # source: gsi image1 (header strip «АОН», mask «+7 (  )  -  -»); REQ-3015: filled automatically on a real call
- field_path: caller.phone_aon
  value_type: STRING
  label_ru: АОН
  group: header
  control: PHONE
  required_in_block: true
  # source: gsi image1 «предоставленный»; REQ-3015 «Предоставленный номер – номер, указанный заявителем как его контактный» = v1 «Телефон заявителя», so the v1 path is reused (§70.5.3 rule) instead of a new caller.phone_provided
- field_path: caller.phone
  value_type: STRING
  label_ru: предоставленный
  scoring_relevant: true
  required_for_handoff: true
  group: header
  control: PHONE
  required_in_block: true
  # source: gsi image1 «телефон на место»
- field_path: caller.phone_on_site
  value_type: STRING
  label_ru: телефон на место
  group: header
  control: PHONE
  required_in_block: true
  # source: gsi image1 (globe icon beside each phone); label from REQ-3015 «зарубежный номер»
- field_path: caller.foreign
  value_type: BOOLEAN
  label_ru: Зарубежный номер
  group: header
  control: CHECKBOX
  # source: gsi image1
- field_path: caller.full_name
  value_type: STRING
  label_ru: Фамилия и имя заявителя
  scoring_relevant: true
  group: applicant
  control: TEXT
  # source: gsi image1 (dropdown «выберите статус»); the six statuses verbatim from instr ¶271–277
  # («Панель выбора содержит следующие статусы: очевидец; пострадавший; родственник; знакомый;
  # ребенок; участник.», instr fig. 33) — I7 E55
- field_path: caller.status
  value_type: ENUM
  label_ru: Статус заявителя
  group: applicant
  control: SELECT
  options:
  - {code: EYEWITNESS, label_ru: очевидец}
  - {code: VICTIM, label_ru: пострадавший}
  - {code: RELATIVE, label_ru: родственник}
  - {code: ACQUAINTANCE, label_ru: знакомый}
  - {code: CHILD, label_ru: ребенок}
  - {code: PARTICIPANT, label_ru: участник}
  # source: instr ¶118 «Канал связи, по которому поступил звонок» (fig. 7, placeholder «канал
  # связи» in fig. 36; «МТС» beside «выберите статус» in fig. 16 — the second dropdown of gsi image1).
  # Options: every channel the instruction names, verbatim — fig. 8 (the list searched by «М»:
  # «ЕССМ», «Линия ДСП (связь с руководством смены)», «МГТС-112», «Мегафон», «Мобильное
  # приложение», «МТС», «МЧС») and ¶118 («Теле2, МТС, Мегафон, Билайн»); alphabetical, as fig. 8 is.
  # fig. 8 is a filtered, cut-off view — the full list is in no source; «Другое» last stands for the
  # rest (owner decision 2026-09-29 No. 12, docs/owner-decisions.md).
- field_path: applicant.channel
  value_type: ENUM
  label_ru: Канал связи
  group: applicant
  control: SELECT
  options:
  - {code: BEELINE, label_ru: Билайн}
  - {code: ESSM, label_ru: ЕССМ}
  - {code: DSP_LINE, label_ru: Линия ДСП (связь с руководством смены)}
  - {code: MGTS_112, label_ru: МГТС-112}
  - {code: MEGAFON, label_ru: Мегафон}
  - {code: MOBILE_APP, label_ru: Мобильное приложение}
  - {code: MTS, label_ru: МТС}
  - {code: MCHS, label_ru: МЧС}
  - {code: TELE2, label_ru: Теле2}
  - {code: OTHER, label_ru: Другое}
  # source: gsi image1 (translate icon beside the applicant row); REQ-3016
- field_path: caller.foreign_language
  value_type: BOOLEAN
  label_ru: Вызов на иностранном языке
  group: applicant
  control: CHECKBOX
  # source: gsi image1 «Адрес:» (single address line, «Москва»); REQ-3019
  # TODO: the address search/autofill (Яндекс/ФИАС) and the map window «С112 - карта» (gsi image5) are not card fields
- field_path: address.line
  value_type: STRING
  label_ru: Адрес
  group: address
  control: TEXT
  required_in_block: true
  # source: gsi image1 «Страна:»
- field_path: address.country
  value_type: STRING
  label_ru: Страна
  group: address
  control: TEXT
  required_in_block: true
  # source: gsi image1 «Субъект:» (Москва)
- field_path: address.region
  value_type: STRING
  label_ru: Субъект
  group: address
  control: TEXT
  required_in_block: true
  # source: gsi image1 «Населенный пункт:»
- field_path: address.locality
  value_type: STRING
  label_ru: Населенный пункт
  scoring_relevant: true
  required_for_handoff: true
  group: address
  control: TEXT
  required_in_block: true
  # source: gsi image1 «Объект:»
- field_path: address.object
  value_type: STRING
  label_ru: Объект
  group: address
  control: TEXT
  required_in_block: true
  # source: gsi image1 «Округ:» (dropdown); options = the catalog's 11 PREFECTURE okrug strings (B1 G3)
