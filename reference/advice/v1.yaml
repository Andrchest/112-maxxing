# «Рекомендации по улучшению навыков» — G10 (ТЗ ¶267, ¶237, финальные критерии ¶460/¶469, I7 E54).
#
# Один короткий практический текст на русском (не более 300 символов) на каждую ScoringCategory
# (`backend/app/domain/enums.py`). `app.application.reports.recommendations` берёт этот текст,
# когда провалившееся в этой категории правило не задаёт собственный `advice` (schema-2
# `scoring.rules[].advice`, ≤300 символов, правило R45). Детерминированно, без ML: текст не
# зависит от сессии и не влияет на баллы или контрольную сумму (D11).
categories:
  INFORMATION_GATHERING: >-
    Уточняйте у заявителя все ключевые факты происшествия ещё во время разговора — адрес, что
    случилось, есть ли пострадавшие. Не переходите к заполнению карточки, пока не собраны
    все нужные сведения.
  CARD_QUALITY: >-
    Заполняйте карточку полно и точно: указывайте адрес, описание и статус так, как их сообщил
    заявитель, без противоречий и пропусков обязательных полей.
  SERVICE_ROUTING: >-
    Направляйте происшествие в ту службу, которая действительно за него отвечает — сверяйтесь
    с классификатором и памяткой, прежде чем выбрать службу.
  TIMELINESS: >-
    Соблюдайте нормативы по времени: принимайте вызов, заполняйте карточку и передавайте её
    службам без задержек — таймер в интерфейсе показывает, сколько времени остаётся.
  WORKFLOW: >-
    Проходите все обязательные шаги приёма и обработки вызова по порядку — приём, заполнение,
    передача, — не пропуская ни одного из них.
  RESOURCE_MANAGEMENT: >-
    Направляйте на происшествие ресурсы, соответствующие его характеру и масштабу, и вовремя
    добавляйте дополнительные силы, если обстановка это требует.
  COMMUNICATION: >-
    Говорите с заявителем спокойно и по существу, задавайте уточняющие вопросы по делу и
    избегайте лишних фраз, которые затягивают разговор.
