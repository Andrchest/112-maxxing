# reference/materials/organizer.yaml — the organizer methodical materials `seed-materials` uploads
# (I5 E41 CHANGE B, HLD 71 §71.11/§71.18.1, Q-E13-2).
#
# Each entry names a file under `requirements/sources/` (read-only — never copied here; the
# organizer archive stays the single source of truth) that
# `app.tools.seed_materials` (`make seed-materials`) reads and uploads through the E34
# `UploadMaterial` use case, sha256-deduped, as the seeded `admin` account (`app.tools.seed_users`).
# `sha256` pins the source file at the moment it was listed here: `seed_materials` refuses to
# upload a file whose bytes have drifted from this pin (an organizer source is never silently
# re-read as something else).
#
# Screened out of this list (I5 E41 CHANGE B, manager decision, final) — every other file under
# `requirements/sources/05-organizer-materials`:
# - «Билеты- задачи по C 112 . АГС_ГСИ (1).pdf» — the tickets PDF; it contains scenario answers.
# - «ЛЦТ2026 Шаблон презентации (1).pptx» — the presentation template, not a reference/instruction
#   document.
# - «9. Деп Обороны и ЧС (1).pdf» — its first page is the project's own ТЗ cover sheet
#   ("Учебное программное обеспечение для подготовки оператора ДДС города Москвы с использованием
#   искусственного интеллекта... Техническое задание"), not a reference/instruction document for
#   112/ДДС operational work — left out per this epic's own screening rule (checked page 1 only,
#   as the brief asks).
