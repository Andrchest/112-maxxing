        - { fact_id: address.house, explicit: true }
        - { fact_id: people.victim_01.inside, explicit: true }
      operator_assertions: []
      confirmation_targets: []
    notes: >
      Two questions folded into one utterance (brief item 6: "two-questions-in-one"); the address
      half has the same street-vs-house-vs-full-bundle ambiguity as `question_address_direct`.

  - id: two_questions_name_and_phone
    utterance: "Представьтесь, пожалуйста, и дайте номер телефона."
    expected:
      speech_act: QUESTION
      requested_facts:
        - { fact_id: caller.full_name, explicit: true }
        - { fact_id: caller.phone, explicit: true }
      operator_assertions: []
      confirmation_targets: []

  - id: leading_question_wrong_assumption
    utterance: "Пожар на Ленина 27, верно?"
    expected:
      speech_act: CONFIRMATION
      requested_facts: []
      operator_assertions:
        - { fact_id: address.street, asserted_value: "Ленина" }
        - { fact_id: address.house, asserted_value: "27" }
      confirmation_targets: [address.street, address.house]
    uncertain: true
    notes: >
      Brief item 6's own example ("a leading question with a wrong assumption"). The demo
      scenario's real street is "улица Николаева", not "Ленина" — the interpreter must not
      correct or know this (SPEC §21); the label only records what the operator asserted. Whether
      a correct parse should also include address.house here (vs. street alone) is the uncertain
      part.

  - id: confirmation_house_number
    utterance: "То есть дом номер двадцать семь, я правильно понял?"
    expected:
      speech_act: CONFIRMATION
      requested_facts: []
      operator_assertions:
        - { fact_id: address.house, asserted_value: "двадцать семь" }
      confirmation_targets: [address.house]

