  - id: instruction_close_door
    utterance: "Закройте дверь в комнату, где горит, и уходите из квартиры."
    expected:
      speech_act: INSTRUCTION
      requested_facts: []
      operator_assertions: []
      confirmation_targets: []

  - id: instruction_hold_for_transfer
    utterance: "Не кладите трубку, я подключаю пожарную охрану к разговору."
    expected:
      speech_act: INSTRUCTION
      requested_facts: []
      operator_assertions: []
      confirmation_targets: []

  - id: imperative_request_street
    utterance: "Назовите улицу."
    expected:
      speech_act: QUESTION
      requested_facts:
        - { fact_id: address.street, explicit: true }
      operator_assertions: []
      confirmation_targets: []
    notes: >
      H5 (E20-H): a bare imperative fact request — no question mark, no interrogative word — must
      still label as a request for `address.street`, not `INSTRUCTION` with an empty
      `requested_facts` (E20-C's §46 walk item 5 reproduced exactly this utterance interpreted as
      `INSTRUCTION`, so a known `ON_ASK` fact was never released). Sibling of `question_street_only`
      ("На какой улице это произошло?"), phrased as a command instead of a question.

  - id: imperative_request_house_number
    utterance: "Скажите номер дома."
    expected:
      speech_act: QUESTION
      requested_facts:
        - { fact_id: address.house, explicit: true }
      operator_assertions: []
      confirmation_targets: []
    notes: >
      H5 (E20-H): the imperative sibling of `question_house_number` ("Назовите номер дома."),
      with the synonymous imperative verb "скажите" instead of "назовите" — both must resolve to
      `requested_facts: [address.house]`.

  - id: imperative_request_phone
    utterance: "Назовите ваш телефон."
    expected:
      speech_act: QUESTION
      requested_facts:
        - { fact_id: caller.phone, explicit: true }
      operator_assertions: []
      confirmation_targets: []
    notes: >
      H5 (E20-H): the imperative sibling of the existing phone-number question case — an
      imperative fact request for `caller.phone` must not be read as `INSTRUCTION`.

  - id: question_address_direct
    utterance: "Какой у вас адрес?"
    expected:
      speech_act: QUESTION
      requested_facts:
        - { fact_id: address.street, explicit: true }
        - { fact_id: address.house, explicit: true }
      operator_assertions: []
      confirmation_targets: []
    uncertain: true
    notes: >
      "Какой у вас адрес?" is a general address question — it is not obvious how many of the
      granular address.* facts (street/house/entrance/floor/apartment/locality) a correct
      interpretation should list. Labelled to the two most central ones (street, house); a model
      that also lists locality or apartment is arguably also correct.

  - id: question_street_only
    utterance: "На какой улице это произошло?"
    expected:
      speech_act: QUESTION
      requested_facts:
        - { fact_id: address.street, explicit: true }
      operator_assertions: []
      confirmation_targets: []

  - id: question_house_number
    utterance: "Назовите номер дома."
    expected:
