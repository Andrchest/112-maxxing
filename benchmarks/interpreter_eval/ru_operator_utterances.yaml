    utterance: "Повторите, пожалуйста, я вас не расслышала."
    expected:
      speech_act: REPEAT_REQUEST
      requested_facts: []
      operator_assertions: []
      confirmation_targets: []

  - id: reassurance_help_on_the_way
    utterance: "Не волнуйтесь, помощь уже выехала к вам."
    expected:
