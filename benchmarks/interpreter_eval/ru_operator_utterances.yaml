  - id: question_victim_age
    utterance: "Сколько ей лет, пострадавшей?"
    expected:
      speech_act: QUESTION
      requested_facts:
        - { fact_id: people.victim_01.age, explicit: true }
      operator_assertions: []
      confirmation_targets: []

  - id: question_name
    utterance: "Как вас зовут, представьтесь, пожалуйста."
    expected:
      speech_act: QUESTION
      requested_facts:
        - { fact_id: caller.full_name, explicit: true }
      operator_assertions: []
      confirmation_targets: []

  - id: question_phone
    utterance: "Назовите ваш номер телефона для связи."
    expected:
      speech_act: QUESTION
      requested_facts:
        - { fact_id: caller.phone, explicit: true }
      operator_assertions: []
      confirmation_targets: []

  - id: question_what_happened_general
    utterance: "Что у вас случилось?"
    expected:
      speech_act: QUESTION
      requested_facts:
        - { fact_id: incident.type, explicit: false }
      operator_assertions: []
      confirmation_targets: []
    uncertain: true
    notes: >
      A fully open "что случилось?" implies incident.type (and arguably incident.smoke_visible
      too) rather than naming any fact directly, hence explicit: false — but whether a correct
      interpretation should request one fact or several here is a judgement call, not a rule the
      HLD states.

  - id: question_smoke
    utterance: "У вас есть дым, задымление в квартире?"
    expected:
      speech_act: QUESTION
      requested_facts:
        - { fact_id: incident.smoke_visible, explicit: true }
      operator_assertions: []
