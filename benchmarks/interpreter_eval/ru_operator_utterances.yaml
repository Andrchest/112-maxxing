# Interpreter eval set (this task's brief, CHANGE item 6). Russian operator utterances over the
# demo scenario's fact catalog (scenarios/examples/apartment-fire/v1.yaml), each labelled by hand
# against that catalog — never against the demo scenario's caller/world *values* (the interpreter
# must never see those; `run_eval.py` only ever hands it the value-free FactCatalog, same as
# production). `expected.requested_facts`/`operator_assertions`/`confirmation_targets` use the
# scenario's real fact ids so `run_eval.py` can validate them against the catalog it also loads.
#
# The 5 items the labeller (this task's worker) was LEAST sure of are marked `uncertain: true` with
# a `notes` line explaining the ambiguity — see this task's report for the same list, for the
# manager to rule on.
scenario: scenarios/examples/apartment-fire/v1.yaml
items:
  - id: greeting_open
    utterance: "Служба сто двенадцать, слушаю вас."
    expected:
      speech_act: GREETING
      requested_facts: []
      operator_assertions: []
      confirmation_targets: []

  - id: closing_end_call
    utterance: "Разговор окончен, до свидания."
    expected:
      speech_act: CLOSING
      requested_facts: []
      operator_assertions: []
      confirmation_targets: []

  - id: closing_hold_and_wait
    utterance: "Всё, до свидания, ждите приезда бригады."
    expected:
      speech_act: CLOSING
      requested_facts: []
      operator_assertions: []
      confirmation_targets: []

  - id: instruction_stay_on_line
    utterance: "Оставайтесь на линии, не кладите трубку."
    expected:
      speech_act: INSTRUCTION
      requested_facts: []
      operator_assertions: []
      confirmation_targets: []

  - id: instruction_leave_building
    utterance: "Немедленно покиньте квартиру и ждите на улице."
    expected:
      speech_act: INSTRUCTION
      requested_facts: []
