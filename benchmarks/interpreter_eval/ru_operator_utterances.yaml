    expected:
      speech_act: REASSURANCE
      requested_facts: []
      operator_assertions: []
      confirmation_targets: []

  - id: answer_eta
    utterance: "Да, пожарные уже в пути, минут через пять будут."
    expected:
      speech_act: ANSWER
      requested_facts: []
      operator_assertions: []
      confirmation_targets: []
    uncertain: true
    notes: >
      The operator is answering an implied caller question about arrival time, not asking or
      instructing — labelled ANSWER, but it reads close to STATEMENT/REASSURANCE too and the HLD
      gives no worked example to anchor the boundary.

  - id: statement_recording_notice
    utterance: "Оператор фиксирует ваше сообщение, ожидайте бригаду."
    expected:
      speech_act: STATEMENT
      requested_facts: []
      operator_assertions: []
      confirmation_targets: []
    uncertain: true
    notes: >
      Reads as a neutral informational statement rather than a question or instruction, but it is
      also plausibly INSTRUCTION ("ожидайте" is itself an imperative) — labelled STATEMENT because
      the primary content is "the call is being recorded", not a command.

  - id: unintelligible_noise
