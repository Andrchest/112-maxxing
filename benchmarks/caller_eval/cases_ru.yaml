# Caller-generator eval set (E13-B4 item 2). Hand-labelled: this eval isolates the GENERATOR, so
# each case's `interpreted` block plays the role a real DialogueInterpreter output would — it is
# fed straight to the real `evaluate_fact_access` and `FallbackTemplates.select`, never produced by
# a model. `fact_id`s are checked against the demo scenario's fact catalog at load time
# (`run_eval.py` / the gate-side test both do this the same way the interpreter eval's
# `_validate_items_against_catalog` does).
#
# 10 SPEC §43 categories, >= 4 cases each (45 total): facts_known, facts_unknown,
# incorrect_assumptions, leading_questions, numerics, addresses, names, hazards, victims, causes.
scenario: scenarios/examples/apartment-fire/v1.yaml

