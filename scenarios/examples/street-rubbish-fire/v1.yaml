# Schema-2 example "Горит мусор на улице" — the generated-card mode of card schema v2 (I3 E3a;
# HLD 70 §70.5.4, §70.11). Pack `v046_24-r1`: card schema v2, classifier v046_24, services v1.
#
# No caller and no 112 stage: under `card_source: GENERATED_CARD` the card arrives generated (the
# prefab below, written in v2 paths) and the chain starts at the ДДС, which sees it in the v2
# layout. The selection is the organizer's own worked example — «КАРТОЧКА 112.docx» image 19:
# 101 · Улица · Открытое пламя / Дым · Нет доступа · Мусор, services bar Служба 101, ЦОДД, ОАТИ.
# Identifiers, keys and enum members are English; every trainee-facing string (`*_ru`) is Russian.
id: 5b0d3c1e-7a2f-4d6b-9e8a-1c4f2a7d9e31
schema_version: 2
scenario_id: 8e1f4a62-3b7c-4c9d-a2e5-6f0b1d3c5a72
version: 1
title: "Горит мусор на улице, Москва, СЗАО, Щукино"
description: "A generated 112 card (v2 layout) reaches the DDS: rubbish burning in the street, no access."
difficulty: 2
deterministic_seed: "street-rubbish-fire-v1"
role_chain: [DDS]
reference_pack: v046_24-r1

# The ДДС works in the memo's per-service statuses by default (I3 E5b, HLD 70 §70.11); the resource
# picker stays selectable. Card check defaults OFF (customer answer 23.09) and may be switched ON.
variants:
  supported:
    card_source: [GENERATED_CARD]
    dds_mode: [MEMO_STATUSES, RESOURCE_PICKER]
    dds_card_check: ["OFF", "ON"]
    dds_brigade_call: ["OFF"]
  default:
    card_source: GENERATED_CARD
    dds_mode: MEMO_STATUSES
    dds_card_check: "OFF"
    dds_brigade_call: "OFF"

world_truth:
  scene_summary_ru: >
    На улице Щукинская, у дома 2, горит мусор на контейнерной площадке; подъезд к площадке
    перекрыт припаркованными машинами. Людям ничего не угрожает.
  facts:
    address.street:        { world_value: "улица Щукинская", value_type: STRING, label_ru: "Улица" }
    address.house:         { world_value: "2", value_type: STRING, label_ru: "Дом/Вл" }
    incident.burning:      { world_value: "мусор", value_type: STRING, label_ru: "Что горит" }
    incident.no_access:    { world_value: true, value_type: BOOLEAN, label_ru: "Нет доступа" }

caller_knowledge:
  facts:
    address.street:        { caller_value: "улица Щукинская", knowledge: KNOWN }
    address.house:         { caller_value: "2", knowledge: KNOWN }
    incident.burning:      { caller_value: "мусор", knowledge: KNOWN }
    incident.no_access:    { caller_value: true, knowledge: KNOWN }

disclosure_rules:
  facts:
    address.street:        { policy: ON_ASK, categories: [address], aliases_ru: ["улица", "адрес"] }
    address.house:         { policy: ON_ASK, categories: [address], aliases_ru: ["дом", "номер дома"] }
    incident.burning:      { policy: SPONTANEOUS, categories: [incident], aliases_ru: ["что горит"] }
    incident.no_access:    { policy: ON_ASK, categories: [incident], aliases_ru: ["подъезд", "доступ"] }

caller_profile:
  identity_ru: "Прохожая у контейнерной площадки"
  relationship: PASSERBY
  language: "ru-RU"
  voice_id: "ru_female_adult_01"
  age_group: ADULT
  baseline_emotion: WORRIED
  cooperativeness: 0.9
  verbosity: 0.4
  confusion: 0.1
  interruption_tendency: 0.1
  speaking_rate: 1.0
  baseline_stress_level: 0.3
  persona_whitelist_ru: []
  emotion_rules: []

available_resources:
  - { resource_id: ac1, service_type: FIRE_RESCUE, resource_type: FIRE_ENGINE, callsign: "АЦ-1", name_ru: "Автоцистерна ПСЧ-1", home_station_ru: "ПСЧ-1", crew_size: 6, capabilities: [FIRE_SUPPRESSION, WATER_SUPPLY], availability: { available_from_ms: 0, available_until_ms: null, initial_status: AVAILABLE }, eta: { turnout_delay_seconds: 30, travel_time_seconds: 150, setup_seconds: 30, on_scene_work_seconds: 240, return_time_seconds: 180 } }
  - { resource_id: ac2, service_type: FIRE_RESCUE, resource_type: FIRE_ENGINE, callsign: "АЦ-2", name_ru: "Автоцистерна ПСЧ-3", home_station_ru: "ПСЧ-3", crew_size: 6, capabilities: [FIRE_SUPPRESSION, WATER_SUPPLY], availability: { available_from_ms: 0, available_until_ms: null, initial_status: AVAILABLE }, eta: { turnout_delay_seconds: 40, travel_time_seconds: 210, setup_seconds: 30, on_scene_work_seconds: 240, return_time_seconds: 210 } }

expected_response:
  required_services: [FIRE_RESCUE]
  optional_services: [TSODD, OATI]
  required_resource_capabilities: [FIRE_SUPPRESSION]
  min_units_by_service: { FIRE_RESCUE: 1 }
  resolution_condition:
    all:
      - { resource: { selector: { capability: FIRE_SUPPRESSION }, op: ANY_IS, status: WORKING } }
  prefab_handoff:
    # «КАРТОЧКА 112.docx» image 19's services bar: Служба 101, ЦОДД, ОАТИ.
    recipient_services: [FIRE_RESCUE, TSODD, OATI]
    card_values:   # v2 paths (reference/card-schema/v2.yaml)
      caller.phone_aon: "+79161234567"
      caller.phone: "+79161234567"
      caller.full_name: "Петрова Анна"
      caller.status: EYEWITNESS
      address.line: "Москва, улица Щукинская, 2"
      address.region: "Москва"
      address.okrug: "СЗАО"
      address.district: "Щукино"
      address.street: "улица Щукинская"
      address.house: "2"
      description.text: "Горит мусор на контейнерной площадке, подъехать нельзя — площадку заставили машины."
      incident.types: ["1"]
      q.fire.where: ["на улице"]
      q.fire.sign_street: ["открытое пламя / дым"]
      q.fire.access: ["no_access"]
      q.fire.street_object: ["мусор"]
      q.fire.threat_to_people: ["threat_to_people:no"]
  # Services no ДДС participant is bound to answer by the default schedule (HLD 70 §70.4.5, R36).
  responders: DEFAULT

world_events: []

scoring_rules:
  - rule_id: dds_acknowledged
    name_ru: "Карточка принята ДДС"
    description_ru: "ДДС принял сгенерированную карточку ровно один раз."
    category: WORKFLOW
    max_points: 4
    critical: true
    evaluator_type: WORKFLOW_ACTION
    applies_to_roles: [DDS]
    min_evidence: 1
    config: { event_type: DDS_ACKNOWLEDGED, payload_match: null, min_count: 1,
              max_count: 1, required_stage_state: null, must_occur_after: null,
              points: 4, penalty_if_missing: -4, penalty_per_excess: 0 }

  - rule_id: dds_acknowledged_in_time
    name_ru: "Карточка принята в течение 30 секунд"
    description_ru: "От поступления карточки в ДДС до её принятия — не более 30 секунд."
    category: TIMELINESS
    max_points: 4
    critical: false
    evaluator_type: DEADLINE
    applies_to_roles: [DDS]
    min_evidence: 1
    config: { from_event_type: HANDOFF_RECEIVED, to_event_type: DDS_ACKNOWLEDGED,
              to_payload_match: null, max_offset_ms: 30000, points: 4,
              penalty_if_late: -2, scale: STEP, linear_zero_ms: null }

  - rule_id: resources_fire_engine
    name_ru: "Направлена пожарная автоцистерна"
    description_ru: "Минимум одна единица с тушением направлена на место."
    category: RESOURCE_MANAGEMENT
    max_points: 8
    critical: true
    evaluator_type: RESOURCE_SELECTION
    applies_to_roles: [DDS]
    applies_to_variants: { dds_mode: [RESOURCE_PICKER] }
    min_evidence: 1
    config: { required_capabilities: [FIRE_SUPPRESSION],
              min_units_by_service: { FIRE_RESCUE: 1 },
              forbidden_resource_ids: [], must_be_dispatched: true,
              points: 8, penalty_per_missing: -4, penalty_per_forbidden: 0 }
