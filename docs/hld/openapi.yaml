        Fires `back_to_interview` (`HANDOFF_PREPARATION → INTERVIEW`, guard
        `guard_call_still_connected`).
      x-action: back_to_interview
      x-emits: [STAGE_STATE_CHANGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
