      summary: The incoming work item — built only from the HandoffSnapshot.
      description: |
        Permission `VIEW_HANDOFF`. The response schema `DdsWorkItem` contains **no field
        sourced from WorldTruth** and no field sourced from the live `OperatorCard`: it is
        assembled from `handoff_snapshots` and `dds_assignments` alone. The application service
        behind it is constructed without a world-truth repository, so the data is unreachable
        rather than merely unrequested (D3, SPEC §10, §42 test 3). If the 112 operator omitted
        a critical fact, the field is absent here and stays absent.
      x-action: '-'
      x-emits: []
