# HLD — Backend REST contract (D8, SPEC §34)
#
# Elaborates docs/hld/00-decisions.md D8 against docs/SPEC.md. Every schema name, field name,
# enum member and field path is copied literally from docs/hld/10-domain-model.md; nothing here
# renames or redefines a domain identifier. Frontend TypeScript types are generated from this
# file by `openapi-typescript` (D12) and the gate fails when they are stale.
#
# Conventions:
#   - every command returns the new materialized view for the acting role (D8);
#   - every operation carries `x-action` (the RoleModule ActionDescriptor.action_id it maps to,
#     or `-` when it is not a RoleModule action) and `x-emits` (the SessionEvent types it
#     appends, in append order);
#   - schemas that may contain WorldTruth or FactAccessGate internals carry
#     `x-visibility: INSTRUCTOR` and are returned only by /api/v1/instructor/** and the report;
#   - errors are RFC 7807 `application/problem+json` with a machine-readable `code`.
openapi: 3.1.0
info:
  title: System-112 / DDS training simulator — backend API
  version: 1.0.0
  summary: Commands and resources for the local emergency-response training simulator.
  description: |
    REST command/resource API under `/api/v1` (D8). Realtime session updates travel over the
    WebSocket channel specified in `docs/hld/40-realtime-protocol.md`; raw microphone audio
    travels over LiveKit and never over this API (SPEC §34).

    Authorisation of every command is two-gated (D8): the caller's participant record must be
    assigned to the session's active `RoleStage`, **and** the stage's `RoleModule` must permit
    the action in the current stage state. A failure of the first gate is `403 FORBIDDEN_FOR_ROLE`;
    of the second, `409 ACTION_NOT_AVAILABLE`. An illegal state-machine trigger is
    `409 INVALID_TRANSITION`.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: Local docker-compose backend (SPEC §36).
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Local username/password authentication, HS256 JWT (D8).
  - name: scenarios
    description: Scenario and ScenarioVersion reference data, import and validation (SPEC §4, D4).
  - name: sessions
    description: Session lifecycle, role-filtered snapshot, event page and LiveKit token.
  - name: operator
    description: Operator 112 stage commands (`Operator112Module`, SPEC §7, §9, §10).
  - name: dds
    description: DDS stage commands (`DDSModule`, SPEC §7, §11).
  - name: instructor
    description: Instructor console. The only place WorldTruth and gate internals are exposed.
  - name: reports
    description: Deterministic post-session report, re-scoring, audio and telemetry (SPEC §28, §29).
  - name: health
    description: Liveness and per-service readiness (SPEC §37, D8).
  - name: admin
    description: Retention purge and inference health administration (SPEC §41, D9).
  - name: reference
    description: (additive, I3 E2a) The reference pack — manifest, service catalog, classifier (70 §70.6, D18).
  - name: lessons
    description: (additive, I3 E4a) Lessons (занятия) — a stream of cards as N ordinary sessions (70 §70.3, D15).
  - name: incidents
    description: (additive, I3 E4a) The caller's cross-session incident list (70 §70.3.6).

paths:

  # ---------------------------------------------------------------- auth ----
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: loginUser
      summary: Exchange username and password for a JWT.
      description: Local accounts only; no external identity provider (SPEC §41).
      security: []
      x-action: '-'
      x-emits: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The authenticated user account.
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/users:
    get:
      tags: [auth]
      operationId: listUsers
      summary: List user accounts (additive, E7) — INSTRUCTOR / ADMIN only.
      x-action: '-'
      x-emits: []
      parameters:
        - name: role
          in: query
          required: false
          schema: { $ref: '#/components/schemas/UserRole' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: User accounts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UserAccount' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------- scenarios ----
  /api/v1/scenarios:
    get:
      tags: [scenarios]
      operationId: listScenarios
      summary: List scenarios (identity only — slug and title).
      x-action: '-'
      x-emits: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Scenarios.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScenarioSummary' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/scenarios/{scenario_id}/versions:
    get:
      tags: [scenarios]
      operationId: listScenarioVersions
      summary: List the versions of one scenario.
      description: |
        `locked_at` is non-null once the first session used the version; a locked version's
        `content` can never change (D4, SPEC §42 test 6).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/ScenarioIdParam'
      responses:
        '200':
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScenarioVersionListItem' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/scenarios/versions/{scenario_version_id}/summary:
    get:
      tags: [scenarios]
      operationId: getScenarioVersionSummary
      summary: Trainee-safe summary of a scenario version.
      description: |
        Deliberately free of `world_truth`, `caller_knowledge`, `disclosure_rules`,
        `expected_response`, `world_events` and `scoring_rules`: a trainee who can read this
        endpoint must learn nothing a briefing would not tell them (SPEC §2, D3).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/ScenarioVersionIdParam'
      responses:
        '200':
          description: Trainee-safe summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioVersionTraineeSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/scenarios/import:
    post:
      tags: [scenarios]
      operationId: importScenarioVersion
      summary: Import a scenario version file (INSTRUCTOR / ADMIN).
      description: |
        The body is the complete YAML or JSON document of one `ScenarioVersion`
        (`docs/hld/30-scenario-format.md`). The server runs `validate_scenario_version`
        (the complete §30.8 list) before writing. Re-importing changed content under an
        existing version number is rejected: `409 SCENARIO_VERSION_LOCKED` when the version
        is locked, `409 SCENARIO_VERSION_EXISTS` otherwise — bump the version (D4).
      x-action: '-'
      x-emits: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioImportRequest' }
      responses:
        '201':
          description: The version was validated and stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioVersionListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            `SCENARIO_INVALID` — the document failed load-time validation. The problem carries
            the complete `validation_report`; nothing was written.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ScenarioProblem' }

  /api/v1/scenarios/validate:
    post:
      tags: [scenarios]
      operationId: validateScenarioFile
      summary: Validate a scenario file without importing it (INSTRUCTOR / ADMIN).
      description: |
        Dry run of `validate_scenario_version`. Always `200`: an invalid document is reported
        in the body as `valid: false` plus issues, because this endpoint's purpose is authoring
        feedback, not command execution.
      x-action: '-'
      x-emits: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioImportRequest' }
      responses:
        '200':
          description: The validation report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioValidationReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/scenarios/versions/{scenario_version_id}/validation-report:
    get:
      tags: [scenarios]
      operationId: getScenarioValidationReport
      summary: The stored validation report of an imported version.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/ScenarioVersionIdParam'
      responses:
        '200':
          description: The report recorded at import time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioValidationReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------ sessions ----
  /api/v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Create a simulation session (INSTRUCTOR / ADMIN).
      description: |
        Creates one `SimulationSession`, one `Incident` and one `RoleStage` per `role_chain`
        entry, instantiates `WorldTruth` and `CallerBelief` from the version, then fires the
        session machine trigger `validate` (`CREATED → READY`). A `role_chain` of `[DDS]` under
        `SINGLE_ROLE` or `ASSESSMENT` without `expected_response.prefab_handoff` is refused with
        `409 PREFAB_HANDOFF_REQUIRED` (D6, §10.10).

        (additive, I3 E1) `variants` (every field optional) is resolved per switch as
        request → scenario default → product default (70 §70.2.2). A value outside
        `IMPLEMENTED_VARIANT_VALUES` is `409 VARIANT_NOT_AVAILABLE` (checked first); a value outside
        the scenario's `supported` set is `409 VARIANT_NOT_SUPPORTED`. The resolved variants are
        recorded in `SESSION_CREATED.variants` and returned in `SessionDetail.variants`. Under
        `card_source: GENERATED_CARD` the effective role chain is the suffix starting at DDS.
      x-action: '-'
      x-emits: [SESSION_CREATED, ROLE_STAGE_STARTED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreateRequest' }
      responses:
        '201':
          description: The created session in state `READY` (or `CREATED` if validation deferred).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List sessions — mine, or all for an instructor.
      description: |
        `scope=MINE` returns the sessions the caller participates in or created.
        `scope=ALL` is permitted for `INSTRUCTOR` and `ADMIN` only; a `TRAINEE` asking for
        `ALL` gets `403 FORBIDDEN_FOR_ROLE`.
      x-action: '-'
      x-emits: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [MINE, ALL]
            default: MINE
        - name: state
          in: query
          required: false
          description: Filter by session state.
          schema: { $ref: '#/components/schemas/SessionState' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Sessions, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SessionListItem' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/sessions/{session_id}:
    get:
      tags: [sessions]
      operationId: getSession
      summary: One session's materialized header.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/start:
    post:
      tags: [sessions]
      operationId: startSession
      summary: Start the session (INSTRUCTOR).
      description: |
        Fires the session trigger `start` (`READY → ACTIVE`, guard `guard_inference_ready`).
        Refused with `503 INFERENCE_NOT_READY` while a required inference service is not
        `READY` and `REQUIRE_INFERENCE_READY=true` (D8, SPEC §37). On success the
        `SimulationRunner` adopts the session and the first `RoleStage` begins; for an
        `OPERATOR_112` first stage the runner fires `ring` shortly afterwards, which is what
        publishes `voice:join` on Redis (D9).
      x-action: start
      x-emits: [SESSION_STARTED, ROLE_STAGE_STARTED, STAGE_STATE_CHANGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The session in state `ACTIVE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/sessions/{session_id}/abort:
    post:
      tags: [sessions]
      operationId: abortSession
      summary: Abort the session (INSTRUCTOR / ADMIN).
      description: |
        Fires `abort` on the session machine and `abort_stage` on the active `RoleStage`.
        Simulation data is preserved: the event log is closed, never deleted (SPEC §39,
        §42 test 14).
      x-action: abort
      x-emits: [SESSION_ABORTED, STAGE_STATE_CHANGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AbortSessionRequest' }
      responses:
        '200':
          description: The session in state `ABORTED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/snapshot:
    get:
      tags: [sessions]
      operationId: getSessionSnapshot
      summary: Role-filtered restore snapshot (browser refresh).
      description: |
        The single REST call the frontend makes after a refresh (SPEC §39, §42 test 13). It
        returns the active stage, its stage state, `available_actions` from the stage's
        `RoleModule`, the role's card or work item, the call state and `last_seq_no`; the
        client then opens the WebSocket and sends `{"type":"resume","after_seq_no":last_seq_no}`
        (D8, `docs/hld/40-realtime-protocol.md` §3).

        Every field is produced through the acting role's `DataVisibilityPolicy`: a `DDS`
        caller never receives `card`, `transcript` or anything sourced from `WorldTruth`.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The snapshot for the caller's role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/events:
    get:
      tags: [sessions]
      operationId: listSessionEvents
      summary: A page of role-filtered session events.
      description: |
        The REST twin of the WebSocket replay: the same envelopes, the same per-role filtering
        by `DataVisibilityPolicy.may_receive` and the same payload redaction table
        (`docs/hld/40-realtime-protocol.md` §4). Events are ordered by ascending `seq_no`;
        `after_seq_no` is exclusive. `has_more` is true when more events exist beyond the page.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - name: after_seq_no
          in: query
          required: false
          description: Exclusive lower bound. Omit or pass 0 to start from the beginning.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: event_type
          in: query
          required: false
          description: Optional filter; still intersected with the role's visible set.
          schema:
            type: array
            items: { $ref: '#/components/schemas/EventType' }
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/voice-token:
    post:
      tags: [sessions]
      operationId: createVoiceToken
      summary: Mint a LiveKit access token for the calling participant.
      description: |
        The backend is the only minter of LiveKit tokens (D9): the frontend never holds the
        LiveKit API secret. The token grants join on exactly the room of this session's active
        call and nothing else. Issued only while the session is `ACTIVE` and the caller is the
        participant assigned to an `OPERATOR_112` stage.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: A room-scoped LiveKit token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/audio/{audio_segment_id}:
    get:
      tags: [reports]
      operationId: getAudioSegment
      summary: Download one audio segment, with HTTP Range.
      description: |
        Serves the WAV bytes of one `audio_segments` row using its `byte_offset` / `byte_length`
        so a Range request needs no scan (`docs/hld/50-voice-pipeline.md` §9.1). Supports
        `Range: bytes=…`, answering `206 Partial Content` with `Content-Range`, and advertises
        `Accept-Ranges: bytes`. A purged segment (`file_path IS NULL`, `purged_at` set) answers
        `410 AUDIO_PURGED` and the report UI renders the transcript without playback (D9).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - name: audio_segment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          description: Standard byte range, e.g. `bytes=0-65535`.
          schema: { type: string }
      responses:
        '200':
          description: The complete segment.
          headers:
            Accept-Ranges:
              schema: { type: string }
            Content-Length:
              schema: { type: integer }
          content:
            audio/wav:
              schema: { type: string, format: binary }
        '206':
          description: The requested byte range.
          headers:
            Accept-Ranges:
              schema: { type: string }
            Content-Range:
              schema: { type: string }
          content:
            audio/wav:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: '`AUDIO_PURGED` — the recording was deleted by the retention policy.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '416':
          description: '`RANGE_NOT_SATISFIABLE`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # --------------------------------------------- operator stage commands ----
  /api/v1/sessions/{session_id}/operator/call/answer:
    post:
      tags: [operator]
      operationId: answerCall
      summary: Answer the ringing call.
      description: |
        Fires `answer` (`RINGING → CONNECTED`, guard `guard_participant_assigned_to_stage`).
        Permission `ANSWER_CALL`. The frontend then joins the LiveKit room with the token from
        `createVoiceToken`; the voice-agent is already in the room, having joined on the
        `voice:join` message published at `CALL_RINGING` (D9).
      x-action: answer
      x-emits: [CALL_ANSWERED, STAGE_STATE_CHANGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The new operator stage view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorStageView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/operator/call/end:
    post:
      tags: [operator]
      operationId: endCall
      summary: Hang up the call.
      description: |
        Permission `END_CALL`. Not a stage transition of its own: it ends the call and is the
        precondition of `complete_stage` (guard `guard_call_ended`). The backend publishes
        `voice:cancel:{session_id}` so an in-flight caller response is cancelled across
        processes (D9).
      x-action: end_call
      x-emits: [CALL_ENDED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndCallRequest' }
      responses:
        '200':
