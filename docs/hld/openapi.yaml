        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/dds/resources/deselect:
    post:
      tags: [dds]
      operationId: deselectDdsResource
      summary: Deselect one resource.
      description: |
        Fires `deselect` (`SELECTED → AVAILABLE`, guard: the resource is not yet dispatched).
      x-action: deselect_resource
      x-emits: [RESOURCE_DESELECTED, RESOURCE_STATUS_CHANGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
