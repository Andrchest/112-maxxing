        '200':
          description: The new operator stage view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorStageView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/operator/handoff:
    post:
      tags: [operator]
      operationId: createHandoff
      summary: Freeze the card and send it to DDS.
      description: |
        Permission `CREATE_HANDOFF`; fires `create_handoff`
        (`HANDOFF_PREPARATION → HANDED_OFF`, guard `guard_at_least_one_recipient_service` —
        otherwise `409 RECIPIENT_SERVICES_EMPTY`).

        In one Unit of Work: the optional `comment_ru` is written to the card field
        `recipients.comment` first (a normal revision, so a `CARD_FIELD_CHANGED` precedes the
        three events below), `freeze_card_to_snapshot` deep-copies `OperatorCard.values` into an
        immutable `HandoffSnapshot`, and `snapshot_to_assignments` creates one `DDSAssignment`
        per recipient service. `HANDOFF_CREATED` is emitted exactly once whatever the number of
        recipients — one trainee action, one trainee event — and `HANDOFF_RECEIVED` once per
        assignment, `SIMULATION`-authored; those are the log's only record of which assignment
        belongs to which service. Nothing is read from `WorldTruth`
        (SPEC §10, §42 test 3): if the operator entered house `72` where the world says `27`,
        DDS receives `72`.

        (Additive, I3 E2b′, 70 §70.6.4) On a pack with a classifier the resolver runs once more
        and a final SIMULATION `RECIPIENTS_RESOLVED {final: true}` is appended immediately before
        `HANDOFF_CREATED`. The snapshot's and `HANDOFF_CREATED`'s `recipient_services` are the
        notification list auto ∪ manual, one assignment is created per service of it, and
        `RECIPIENT_SERVICES_EMPTY` is about that list. The conditional `RECIPIENTS_RESOLVED` is
        not in `x-emits` (a `v1` card has no classifier and appends none).
      x-action: create_handoff
      x-emits: [HANDOFF_CREATED, STAGE_STATE_CHANGED, HANDOFF_RECEIVED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHandoffRequest' }
      responses:
        '201':
          description: The frozen snapshot and the assignments it created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffCreatedView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/operator/stage/complete:
    post:
      tags: [operator]
      operationId: completeOperatorStage
      summary: Complete the Operator 112 stage.
      description: |
        Fires `complete_stage` (`HANDED_OFF → STAGE_COMPLETED`, guard `guard_call_ended`).
        The session machine then fires `begin_role_transition` when the `role_chain` has a next
        entry, or `complete` when it does not.
      x-action: complete_stage
      x-emits: [ROLE_STAGE_COMPLETED, STAGE_STATE_CHANGED, ROLE_TRANSITION_STARTED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The session after stage completion.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------ role transition ----
  /api/v1/sessions/{session_id}/stage/continue:
    post:
      tags: [sessions]
      operationId: continueToNextStage
      summary: Continue to the next role stage after the configurable pause.
      description: |
        Fires `finish_role_transition` (`ROLE_TRANSITION → ACTIVE`, guard
        `guard_pause_elapsed_and_next_assigned`: `now_ms ≥ transition_started_ms +
        policy.transition_pause_seconds·1000`). Called before the pause elapses it is refused
        with `409 INVALID_TRANSITION` — the pause is `SessionPolicy.transition_pause_seconds`
        (§10.10), not a frontend timer.

        The same `Incident` carries over; no new incident is created (SPEC §13, §42 test 5).
      x-action: finish_role_transition
      x-emits: [ROLE_TRANSITION_COMPLETED, ROLE_STAGE_STARTED, STAGE_STATE_CHANGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The session with the next stage active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # -------------------------------------------------- DDS stage commands ----
