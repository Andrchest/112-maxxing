  /api/v1/sessions/{session_id}/dds/resources/dispatch:
    post:
      tags: [dds]
      operationId: dispatchDdsResources
      summary: Dispatch every currently selected resource.
      description: |
        Permission `DISPATCH_RESOURCES`. Fires the assignment trigger `dispatch`
        (`RESOURCE_SELECTION → DISPATCHED`) the first time, and `dispatch_additional` (a
        self-transition from `EN_ROUTE` / `ARRIVED` / `WORKING`) afterwards — extra units may be
        added without losing progress. Guard `guard_at_least_one_selected_available`.

        `RESOURCE_DISPATCHED` carries `capabilities_union`, `eta_seconds_by_resource` and
        `service_type_by_resource` (additive, E9) so the `RESOURCE_SELECTION` evaluator needs no
        resource-table lookup (D5). `service_type_by_resource` maps each dispatched
        `resource_id` to **that unit's own** `service_type`: a unit whose service received no
        handoff leg is attached to the primary leg, so an evaluator may never infer a unit's
        service from the assignment it hangs on.
      x-action: dispatch
      x-emits: [RESOURCE_DISPATCHED, RESOURCE_STATUS_CHANGED, STAGE_STATE_CHANGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispatchRequest' }
      responses:
        '200':
          description: The dispatch result and the new DDS stage view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchResultView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

