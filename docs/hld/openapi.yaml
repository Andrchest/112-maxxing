            application/json:
              schema: { $ref: '#/components/schemas/LessonReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/instructor/lessons/{lesson_id}/report/release:
    post:
      tags: [lessons]
      operationId: releaseLessonReport
      summary: Release every card report of the lesson to its trainees (idempotent, no event).
      description: |
        Calls the existing per-session release for every card; sets `incidents.card_status` to
        `CHECKED` where the projection allows it (70 §70.4.6). Emits no event (HLD 20 §20.3).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '200':
          description: The lesson after release.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # --------------------------------------------- I4 E32: lesson comments ----
  /api/v1/lessons/{lesson_id}/comments:
    get:
      tags: [lessons]
      operationId: listLessonComments
      summary: Instructor comments on a lesson result — the lesson equivalent of listSessionComments.
      description: Trainee access follows the lesson report's release (every card released).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '200':
          description: Comments, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultCommentList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [lessons]
      operationId: createLessonComment
      summary: Add a comment (or an edit, as a new row) to a lesson result (INSTRUCTOR / ADMIN).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResultCommentRequest' }
      responses:
        '201':
          description: The stored comment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultCommentView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ------------------------------------------- weight proposals & groups ----
  # Additive, I3 E9a (70 §70.3.7): AI-suggested difficulty weights are stored as proposals and
  # applied to `PlanEntry.weight` only when the instructor accepts them; trainee groups are named
  # lists of trainees a lesson may be created for.
  /api/v1/lessons/{lesson_id}/weight-proposals:
    post:
      tags: [lessons]
      operationId: requestWeightProposals
      summary: Ask for difficulty-weight proposals for every card (stored, never applied).
      description: |
        The creator of the lesson or an ADMIN. One `WeightProposer` call for the whole lesson: the
        LLM adapter (JSON-schema constrained, prompt built only from scenario **metadata** — title,
        difficulty, card type, number of services, timers, special-variant flags, provenance —
        never from world truth) or, on any LLM failure, the deterministic heuristic
        (`source: HEURISTIC`, `fallback_reason`). The answer replaces the lesson's stored
        proposals; **no weight changes** — only `acceptWeightProposals` writes `PlanEntry.weight`,
        so scoring stays deterministic (SPEC §2, D11).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '201':
          description: The stored proposals beside the current weights.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightProposalSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [lessons]
      operationId: getWeightProposals
      summary: The lesson's latest weight proposals beside the current weights.
      description: '`404 NOT_FOUND` until proposals have been requested.'
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '200':
          description: The stored proposals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightProposalSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/lessons/{lesson_id}/weight-proposals/accept:
    post:
      tags: [lessons]
      operationId: acceptWeightProposals
      summary: Accept the chosen proposals into the plan's weights.
      description: |
        The creator of the lesson or an ADMIN. Each chosen position's `proposed_weight` becomes
        its `PlanEntry.weight` (and the proposal's `accepted_at` is set); the others are left as
        they are. Allowed in every lesson state — `getLessonReport` reads the weights when asked,
        nothing is rescored. `422 VALIDATION_ERROR` for a position without a proposal, `404` when
        no proposals exist.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WeightProposalAcceptRequest' }
      responses:
        '200':
          description: The proposals after the accept, with the new current weights.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightProposalSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/trainee-groups:
    get:
      tags: [lessons]
      operationId: listTraineeGroups
      summary: List trainee groups (INSTRUCTOR / ADMIN).
      x-action: '-'
      x-emits: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Groups in `name_ru` order.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TraineeGroup' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [lessons]
      operationId: createTraineeGroup
      summary: Create a trainee group (INSTRUCTOR / ADMIN).
      description: Every member must be an active `TRAINEE` account (`422 VALIDATION_ERROR`).
      x-action: '-'
      x-emits: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TraineeGroupRequest' }
      responses:
        '201':
          description: The created group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraineeGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/trainee-groups/{group_id}:
    get:
      tags: [lessons]
      operationId: getTraineeGroup
      summary: One trainee group with its members.
      x-action: '-'
      x-emits: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraineeGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [lessons]
      operationId: updateTraineeGroup
      summary: Rename a trainee group and replace its members whole.
      x-action: '-'
      x-emits: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TraineeGroupRequest' }
      responses:
        '200':
          description: The group after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraineeGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [lessons]
      operationId: deleteTraineeGroup
      summary: Delete a trainee group; lessons created for it keep their participants.
      description: '`lessons.group_id` of every lesson created for it becomes `null`.'
      x-action: '-'
      x-emits: []
      parameters:
        - name: group_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ----------------------------------------------------------- incidents ----
  # Additive, I3 E4a (70 §70.3.6).
  /api/v1/incidents:
    get:
      tags: [incidents]
      operationId: listMyIncidents
      summary: The caller's cross-session incident list (ДДС «Список происшествий», 112 «реестр»).
      description: |
        One row per session the caller participates in (optionally one lesson), with the materialised
        `card_status` and the deadline offsets; the client renders countdowns from
        `session_offset_ms` and never decides a status. A ДДС trainee sees rows only once the card
        has arrived (its session is `ACTIVE` or terminal).
      x-action: '-'
      x-emits: []
      parameters:
        - name: lesson_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: role_type
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RoleType' }
        - name: card_status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CardStatus' }
        - name: q
          in: query
          required: false
          description: Search over display number, address and classifier code («Поиск»).
          schema: { type: string }
      responses:
        '200':
          description: Incidents, newest arrival first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/IncidentListItem' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # -------------------------------------------------------- materials ---- (additive, I4 E34)
  /api/v1/materials:
    post:
      tags: [materials]
      operationId: uploadMaterial
      summary: Upload a methodical material (INSTRUCTOR / ADMIN) — ТЗ ¶227, ¶387, ¶370.
      description: |
        Allow-list pdf, docx, doc, xlsx, txt, md, png, jpg (else `422 MATERIAL_TYPE_NOT_ALLOWED`);
        larger than `SIM_MATERIAL_MAX_MB` is `422 MATERIAL_TOO_LARGE`. Stored under
        `data_dir/materials/<sha256>` (identical bytes stored once).
      x-action: '-'
      x-emits: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [title_ru, file]
              properties:
                title_ru: { type: string, minLength: 1 }
                file: { type: string, format: binary }
      responses:
        '201':
          description: The stored material.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingMaterialView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [materials]
      operationId: listMaterials
      summary: The reference base «Справочная база» (every authenticated role) — ТЗ ¶256.
      description: |
        Unarchived materials for everyone; `include_archived` only for INSTRUCTOR / ADMIN. No
        per-trainee assignment (Q-E13-1 open).
      x-action: '-'
      x-emits: []
      parameters:
        - name: include_archived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Materials, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TrainingMaterialView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/materials/{material_id}/file:
    get:
      tags: [materials]
      operationId: getMaterialFile
      summary: Download or open a material (every authenticated role).
      description: The stored content type; a PDF is sent inline (Content-Disposition inline), other types as an attachment.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/MaterialIdParam'
      responses:
        '200':
          description: The file bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/materials/{material_id}/archive:
    post:
      tags: [materials]
      operationId: archiveMaterial
      summary: Archive a material — hidden from trainees, file kept (INSTRUCTOR / ADMIN).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/MaterialIdParam'
      responses:
        '200':
          description: The material after archiving (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrainingMaterialView' }
  # ------------------------------------ I4 E33: reports, statistics, CSV ----
  /api/v1/lessons/{lesson_id}/report.csv:
    get:
      tags: [lessons]
      operationId: getLessonReportCsv
      summary: (additive, I4 E33; I7 E46b) The lesson report as CSV, Excel or PDF — ТЗ ¶360, ¶379.
      description: |
        Same access and numbers as `getLessonReport`. `format=csv` (the default, unchanged since
        I4 E33): UTF-8 with BOM, `;` separator, Russian column headers, decimal comma; one row per
        card and norm (a card without a norm gets one row), then the weighted total. (I7 E46b)
        `format=xlsx`/`pdf`: the same numbers as two sections ("Карточки", "Нормативы и время
        реакции") instead of one wide table.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
        - $ref: '#/components/parameters/ExportFormatParam'
      responses:
        '200':
          description: The CSV, Excel or PDF file (`format`).
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/statistics:
    get:
      tags: [statistics]
      operationId: getTraineeStatistics
      summary: (additive, I4 E33) Per-trainee statistics across sessions and lessons — ТЗ ¶101, ¶138, ¶225, ¶232.
      description: |
        INSTRUCTOR / ADMIN: every trainee (optionally one, or one group). TRAINEE: self only —
        asking for another `trainee_id` is `403 FORBIDDEN_FOR_ROLE` — over the sessions whose
        report is visible to them. Read from stored scores; nothing is re-scored (D11). The window
        is on `completed_at`. An unknown `trainee_id` / `group_id` is `404`.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/TraineeIdQueryParam'
        - $ref: '#/components/parameters/GroupIdQueryParam'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: One row per trainee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraineeStatistics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/statistics.csv:
    get:
      tags: [statistics]
      operationId: getTraineeStatisticsCsv
      summary: (additive, I4 E33; I7 E46b) getTraineeStatistics as CSV, Excel or PDF (same access, same numbers) — ТЗ ¶360, ¶379.
      description: |
        `format=csv` (the default, unchanged since I4 E33): UTF-8 with BOM, `;` separator, Russian
        headers, decimal comma. (I7 E46b) `format=xlsx`/`pdf`: the same rows and columns, typed
        cells (numbers as numbers).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/TraineeIdQueryParam'
        - $ref: '#/components/parameters/GroupIdQueryParam'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - $ref: '#/components/parameters/ExportFormatParam'
      responses:
        '200':
          description: The CSV, Excel or PDF file (`format`).
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/me/history:
    get:
      tags: [statistics]
      operationId: getMyHistory
      summary: (additive, I4 E33) The caller's own statistics plus their completed sessions with score and date — ТЗ ¶252, ¶265, ¶266.
      description: A session appears with its score only once its report is visible to the caller (the existing release rule).
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: Own history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------ I5 E36: trainee rating ----
  # Q-E12-2: «рейтинг нужен, сортировка по среднему проценту баллов».
  /api/v1/statistics/rating:
    get:
      tags: [statistics]
      operationId: getTraineeRating
      summary: (additive, I5 E36) Trainees ranked by their average score percent (INSTRUCTOR / ADMIN).
      description: |
        Same filters as `getTraineeStatistics` (one trainee, one group, a `completed_at` window),
        same exclusion rule (unscored/aborted cards do not count, D11 — nothing is re-scored).
        Ordered by `average_percent` descending, ties by `display_name_ru`; a trainee with no
        qualifying session has nothing to rank and is left out. INSTRUCTOR / ADMIN only — `403
        FORBIDDEN_FOR_ROLE` for a TRAINEE.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/TraineeIdQueryParam'
        - $ref: '#/components/parameters/GroupIdQueryParam'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: The ranking, best first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraineeRating' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/statistics/rating.csv:
    get:
      tags: [statistics]
      operationId: getTraineeRatingCsv
      summary: (additive, I5 E36; I7 E46b) getTraineeRating as CSV, Excel or PDF (same access, same numbers).
      description: |
        `format=csv` (the default, unchanged since I5 E36): UTF-8 with BOM, `;` separator, Russian
        headers, decimal comma. (I7 E46b) `format=xlsx`/`pdf`: the same rows and columns.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/TraineeIdQueryParam'
        - $ref: '#/components/parameters/GroupIdQueryParam'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - $ref: '#/components/parameters/ExportFormatParam'
      responses:
        '200':
          description: The CSV, Excel or PDF file (`format`).
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------ I7 E54: «Типичные ошибки» (G11, ТЗ ¶233) ----
  /api/v1/statistics/typical-errors:
    get:
      tags: [statistics]
      operationId: getTypicalErrors
      summary: (additive, I7 E54) Top failed rules across sessions in scope (INSTRUCTOR/ADMIN).
      description: |
        Same filters as `getTraineeStatistics` (one trainee, one group, a `completed_at` window).
        Deterministic, no ML (ТЗ ¶233's own reading): the rules most of the scoped sessions
        failed, worst first, at most 10, each with its failed-session count and share of the
        scope. INSTRUCTOR / ADMIN only (`403 FORBIDDEN_FOR_ROLE` for a TRAINEE); an INSTRUCTOR's
        scope is narrowed to sessions of lessons they created, an ADMIN's is every scored session.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/TraineeIdQueryParam'
        - $ref: '#/components/parameters/GroupIdQueryParam'
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: The top failed rules, worst first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TypicalErrors' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 JWT minted by `loginUser`; the secret comes from the environment (D8, SPEC §41).
    sipGatewaySecret:
      type: apiKey
      in: header
      name: X-Sip-Gateway-Secret
      description: (additive, I3 E6e) The SIP gateway's service credential, `SIM_SIP_GATEWAY_SECRET` from the environment; accepted only on `/api/v1/telephony/*`. Unset ⇒ every telephony operation answers `401`.

  parameters:
    CallIdParam:
      description: (additive, I3 E6b) A ДДС call's `call_id` (80 §80.3.1).
      name: call_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionIdParam:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScenarioIdParam:
      name: scenario_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScenarioVersionIdParam:
      name: scenario_version_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentIdParam:
      name: assignment_id
      in: path
      required: true
      description: (additive, I3 E5a) One `dds_assignments` leg of the session's DDS stage.
      schema: { type: string, format: uuid }
    LessonIdParam:
      name: lesson_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PackQueryParam:
      name: pack
      in: query
      required: false
      description: (additive, I3 E2a) Reference pack id; default = the newest pack in the manifest.
      schema: { type: string, examples: [v046_24-r1, legacy-r1] }
    MaterialIdParam:
      description: (additive, I4 E34) A `training_materials` row (71 §71.11).
      name: material_id
      in: path
      required: true
    # ---------------------------------------------- I4 E33: statistics ----
    FromParam:
      name: from
      in: query
      required: false
      description: (additive, I4 E33) Inclusive lower bound (UTC).
      schema: { type: string, format: date-time }
    ToParam:
      name: to
      in: query
      required: false
      description: (additive, I4 E33) Exclusive upper bound (UTC).
      schema: { type: string, format: date-time }
    TraineeIdQueryParam:
      name: trainee_id
      in: query
      required: false
      description: (additive, I4 E33)
      schema: { type: string, format: uuid }
    GroupIdQueryParam:
      name: group_id
      in: query
      required: false
      description: (additive, I4 E33)
      schema: { type: string, format: uuid }
    ExportFormatParam:
      name: format
      in: query
      required: false
      description: (additive, I7 E46b) `csv` (default, byte-identical to before this epic), `xlsx` or `pdf`.
      schema: { type: string, enum: [csv, xlsx, pdf], default: csv }
    ExportFormatXlsxPdfParam:
      name: format
      in: query
      required: true
      description: (additive, I7 E46b) `xlsx` or `pdf` — no CSV precedent for this report, so there is no default.
      schema: { type: string, enum: [xlsx, pdf] }

  responses:
    Unauthorized:
      description: '`UNAUTHENTICATED` — missing, malformed or expired bearer token.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: |
        `FORBIDDEN_FOR_ROLE` — the caller's user role, or the participant assignment to the
        active `RoleStage`, does not permit this operation. Also `REPORT_NOT_RELEASED`;
        (additive, I3 E5a) `FORBIDDEN_FOR_SERVICE` — the leg is bound to another ДДС participant.
        (additive, I5 E39) `NOT_RESOURCE_OWNER` — an INSTRUCTOR changing a lesson, session, report
        or trainee group another instructor created (reads stay open; ADMIN is exempt).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: '`NOT_FOUND` — no such session, scenario, version, resource or segment; (additive, I3 E6e) `DIAL_NUMBER_UNKNOWN` — a softphone-dialled number reaches nobody on the selected card.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: |
        A state conflict. `INVALID_TRANSITION` when the state machine rejects the trigger (D8),
        `ACTION_NOT_AVAILABLE` when the `RoleModule` does not offer the action in the current
        stage state, plus `SCENARIO_VERSION_LOCKED`, `SCENARIO_VERSION_EXISTS`,
        `PREFAB_HANDOFF_REQUIRED`, `RECIPIENT_SERVICES_EMPTY`, `HANDOFF_ALREADY_CREATED`,
        `RESOURCE_UNAVAILABLE`, `SESSION_NOT_ACTIVE`, `REPORT_NOT_READY`; (additive, I3 E1)
        `VARIANT_NOT_SUPPORTED`, `VARIANT_NOT_AVAILABLE`; (additive, I3 E2a)
        `REFERENCE_PACK_UNKNOWN` — the scenario version names a reference pack the manifest
        does not have; (additive, I3 E4a) `LESSON_NOT_ACTIVE`; (additive, I3 E2b′)
        `SERVICE_REMOVAL_FORBIDDEN` — a service removal under a card schema other than `v1`;
        (additive, I3 E6b) `DDS_LINE_BUSY` — the user already has a live ДДС call in the session;
        (additive, I3 E6e) `NO_ACTIVE_DDS_SESSION` — a softphone dialled and the user has no ACTIVE
        session where they are a ДДС participant with a phone; (additive, I4 E28) `USERNAME_TAKEN`
        — `createUser` names an existing username; `SELF_MODIFICATION_FORBIDDEN` — an ADMIN tried
        to block or demote its own account; `LAST_ADMIN_REQUIRED` — the last active ADMIN account
        cannot be blocked or demoted; (additive, I4 E29) `BACKUP_REQUIRED` — `purgeRecordings`
        refused a non-dry-run purge because no fresh, successful backup is recorded.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: |
        `VALIDATION_ERROR`, `CARD_FIELD_UNKNOWN`, `CARD_VALUE_TYPE_MISMATCH` or
        `SCENARIO_INVALID` — the request body is well-formed JSON but not acceptable; (additive,
        I3 E2a) `SERVICE_UNKNOWN` — a service id outside the session's service catalog; (additive,
        I3 E3a) `CARD_OPTION_UNKNOWN` — a card value that is not one of the field's option codes;
        (additive, I3 E5a) `COMMENT_REQUIRED` — «Не принята» / «Отказ» without a comment;
        (additive, I3 E6c) `PROPOSAL_UNKNOWN` — `proposed_by_call_id` names no
        `DDS_CALL_STATUS_PROPOSED` of the leg; (additive, I4 E34) `MATERIAL_TYPE_NOT_ALLOWED` —
        `uploadMaterial`'s file extension is not on the allow-list; `MATERIAL_TOO_LARGE` — the
        body exceeds `SIM_MATERIAL_MAX_MB`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: |
        `INFERENCE_NOT_READY` — a required inference service is not `READY` while
        `REQUIRE_INFERENCE_READY=true` (D8, SPEC §37); or `LLM_UNAVAILABLE` for the optional
        explanation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: |
        (additive, I7 E51, G5, ТЗ ¶295) `LOGIN_THROTTLED` — too many failed logins for this
        username or client IP; `Retry-After` (seconds) is also on the response header.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/LoginThrottledProblem' }

  schemas:

    # ------------------------------------------------------------ errors ----
    ProblemCode:
      type: string
      description: The machine-readable error code carried by every RFC 7807 problem.
      enum:
        - UNAUTHENTICATED
        - FORBIDDEN_FOR_ROLE
        - NOT_FOUND
        - VALIDATION_ERROR
        - INVALID_TRANSITION
        - ACTION_NOT_AVAILABLE
        - PARTICIPANT_NOT_ASSIGNED
        - INFERENCE_NOT_READY
        - SCENARIO_INVALID
        - SCENARIO_VERSION_LOCKED
        - SCENARIO_VERSION_EXISTS
        - PREFAB_HANDOFF_REQUIRED
        - RECIPIENT_SERVICES_EMPTY
        - HANDOFF_ALREADY_CREATED
        - CARD_FIELD_UNKNOWN
        - CARD_VALUE_TYPE_MISMATCH
        - RESOURCE_UNAVAILABLE
        - SESSION_NOT_ACTIVE
        - REPORT_NOT_READY
        - REPORT_NOT_RELEASED
        - EXPLANATION_ALREADY_EXISTS
        - LLM_UNAVAILABLE
        - AUDIO_PURGED
        - RANGE_NOT_SATISFIABLE
        - VARIANT_NOT_SUPPORTED        # additive, I3 E1
        - VARIANT_NOT_AVAILABLE        # additive, I3 E1
        - REFERENCE_PACK_UNKNOWN       # additive, I3 E2a
        - SERVICE_UNKNOWN              # additive, I3 E2a
        - LESSON_NOT_ACTIVE            # additive, I3 E4a
        - CARD_OPTION_UNKNOWN          # additive, I3 E3a
        - SERVICE_REMOVAL_FORBIDDEN    # additive, I3 E2b′
        - COMMENT_REQUIRED             # additive, I3 E5a
        - PROPOSAL_UNKNOWN             # additive, I3 E6c
        - FORBIDDEN_FOR_SERVICE        # additive, I3 E5a
        - DDS_LINE_BUSY                # additive, I3 E6b
        - DIAL_NUMBER_UNKNOWN          # additive, I3 E6e
        - NO_ACTIVE_DDS_SESSION        # additive, I3 E6e
        - USERNAME_TAKEN               # additive, I4 E28
        - SELF_MODIFICATION_FORBIDDEN  # additive, I4 E28
        - LAST_ADMIN_REQUIRED          # additive, I4 E28
        - MATERIAL_TYPE_NOT_ALLOWED    # additive, I4 E34
        - MATERIAL_TOO_LARGE           # additive, I4 E34
        - BACKUP_REQUIRED              # additive, I4 E29
        - NOT_RESOURCE_OWNER           # additive, I5 E39
        - LOGIN_THROTTLED              # additive, I7 E51 (G5)

    Problem:
      type: object
      description: RFC 7807 problem detail (D8). `code` is the contract; `title` and `detail` are prose.
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, default: 'about:blank' }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: [string, 'null'] }
        instance: { type: [string, 'null'], format: uri-reference }
        code: { $ref: '#/components/schemas/ProblemCode' }

    ScenarioProblem:
      description: A `SCENARIO_INVALID` problem, carrying the complete validation report.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [validation_report]
          properties:
            validation_report: { $ref: '#/components/schemas/ScenarioValidationReport' }

    LoginThrottledProblem:
      description: (additive, I7 E51, G5) A `LOGIN_THROTTLED` problem; `retry_after_s` repeats the `Retry-After` header.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [retry_after_s]
          properties:
            retry_after_s: { type: integer, minimum: 1 }

    # ------------------------------------------------------------- enums ----
    UserRole:
      type: string
      description: Account role (D8). Distinct from `RoleType`, which is a simulation role.
      enum: [TRAINEE, INSTRUCTOR, ADMIN]
    RoleType:
      type: string
      enum: [OPERATOR_112, DDS, EDDS]
    ActorType:
      type: string
      enum: [TRAINEE, INSTRUCTOR, SIMULATION, MODEL, SYSTEM]
    SessionMode:
      type: string
      enum: [SINGLE_ROLE, FULL_CYCLE_SINGLE_TRAINEE, MULTI_TRAINEE, ASSESSMENT]
    SessionState:
      type: string
      enum: [CREATED, READY, ACTIVE, ROLE_TRANSITION, COMPLETED, ABORTED]
    CardSource:
      description: (additive, I3 E1) Variant switch `card_source` (70 §70.2.1).
      type: string
      enum: [GENERATED_CARD, CALLER_VOICE]
    DdsMode:
      description: (additive, I3 E1) Variant switch `dds_mode` (70 §70.2.1).
      type: string
      enum: [MEMO_STATUSES, RESOURCE_PICKER]
    DdsCardCheck:
      description: (additive, I3 E1) Variant switch `dds_card_check` (70 §70.2.1).
      type: string
      enum: ['OFF', 'ON']
    DdsBrigadeCall:
      description: (additive, I3 E1) Variant switch `dds_brigade_call` (70 §70.2.1). (I3 E6b) `ON` is implemented — "the ДДС has a phone" (80 §80.5) — memo mode only (R41); the default stays `OFF` (C7).
      type: string
      enum: ['OFF', 'ON']
    DdsCallKind:
      description: (additive, I3 E6b) Who a ДДС call is to (80 §80.3.1).
      type: string
      enum: [SERVICE_HEAD, CLAIMANT, OPERATOR_112]
    DdsCallDirection:
      description: (additive, I3 E6b) `INBOUND` = the brigade calls the ДДС (E6c).
      type: string
      enum: [OUTBOUND, INBOUND]
    CallEndpoint:
      description: (additive, I3 E6b) Where the trainee's side of the call is — the browser widget or a registered softphone. Not a variant switch (D25).
      type: string
      enum: [BROWSER, SIP]
    DdsCallState:
      description: (additive, I3 E6b) `DDS_CALL_TRANSITIONS` states (80 §80.3.2).
      type: string
      enum: [DIALING, RINGING, CONNECTED, ENDED]
    DdsCallEndReason:
      description: (additive, I3 E6b)
      type: string
      enum: [HANGUP, NO_ANSWER, BUSY, ABORT, TRANSPORT_LOST]
    CallAnsweredBy:
      description: (additive, I3 E6b) `TRAINEE` on an `OPERATOR_112` call is the reserved hook for a human 112 trainee (owner Q1, E6g — not in I3).
      type: string
      enum: [AI, TRAINEE]
    CallSelectionReason:
      description: (additive, I3 E6b) Why this session was the one a call went to (80 §80.3.5).
      type: string
      enum: [BROWSER_BUTTON, LAST_OPENED_CARD, OLDEST_ACTIVE, INBOUND_SCRIPT]
    Operator112StageState:
      type: string
      enum: [WAITING_FOR_CALL, RINGING, CONNECTED, INTERVIEW, HANDOFF_PREPARATION, HANDED_OFF, STAGE_COMPLETED]
    DDSStageState:
      type: string
      enum: [RECEIVED, ACKNOWLEDGED, RESOURCE_SELECTION, DISPATCHED, EN_ROUTE, ARRIVED, WORKING, RESOLVED, CLOSED]
    StageState:
      description: Either an `Operator112StageState` or a `DDSStageState` member.
      oneOf:
        - $ref: '#/components/schemas/Operator112StageState'
        - $ref: '#/components/schemas/DDSStageState'
    ServiceType:
      description: |
        (changed, I3 E2a) `ServiceId` — a service catalog id (70 §70.6.3, D18), no longer a closed
        enum. The six legacy ids (`FIRE_RESCUE`, `POLICE`, `AMBULANCE`, `GAS_SERVICE`,
        `UTILITY_EMERGENCY`, `EDDS`) stay valid verbatim; the name `ServiceType` is kept so every
        existing `$ref` survives.
      type: string
      minLength: 1
      pattern: '^[A-Z][A-Z0-9_]*$'
    ResourceType:
      type: string
      enum:
        - FIRE_ENGINE
        - LADDER_TRUCK
        - RESCUE_UNIT
        - AMBULANCE_UNIT
        - RESUSCITATION_UNIT
        - POLICE_PATROL
        - GAS_EMERGENCY_UNIT
        - UTILITY_CREW
        - FIRE_CHIEF_CAR
    ResourceStatus:
      type: string
      enum: [AVAILABLE, SELECTED, DISPATCHED, EN_ROUTE, ON_SCENE, WORKING, RETURNING, OUT_OF_SERVICE, UNAVAILABLE]
    ResourceCapability:
      type: string
      enum:
        - FIRE_SUPPRESSION
        - HIGH_RISE_ACCESS
        - LADDER_RESCUE
        - TECHNICAL_RESCUE
        - SMOKE_DIVING
        - BASIC_LIFE_SUPPORT
        - ADVANCED_LIFE_SUPPORT
        - BURN_CARE
        - PUBLIC_ORDER
        - TRAFFIC_CONTROL
        - AREA_CORDON
        - GAS_SHUTOFF
        - GAS_LEAK_DETECTION
        - POWER_SHUTOFF
        - WATER_SUPPLY
        - COMMAND_AND_CONTROL
    KnowledgeState:
      type: string
      enum: [KNOWN, UNKNOWN, INCORRECT_BELIEF, UNCERTAIN]
    DisclosurePolicy:
      type: string
      enum: [SPONTANEOUS, ON_ASK, ONLY_IF_EXPLICITLY_ASKED, NEVER_DISCLOSE]
    SpeechAct:
      type: string
      enum: [QUESTION, ANSWER, STATEMENT, CONFIRMATION, INSTRUCTION, GREETING, CLOSING, REASSURANCE, REPEAT_REQUEST, UNINTELLIGIBLE]
    IncidentType:
      type: string
      enum: [FIRE, MEDICAL, CRIME, TRAFFIC_ACCIDENT, GAS_LEAK, UTILITY_FAILURE, RESCUE, OTHER]
    CallerRelationship:
      type: string
      enum: [VICTIM, WITNESS, NEIGHBOUR, RELATIVE, PASSERBY, OFFICIAL, UNKNOWN]
    AgeGroup:
      type: string
      enum: [CHILD, TEEN, ADULT, ELDERLY]
    EmotionLabel:
      type: string
      enum: [CALM, WORRIED, FRIGHTENED, PANICKED, ANGRY, CONFUSED, APATHETIC]
    ValueType:
      type: string
      enum: [STRING, INTEGER, FLOAT, BOOLEAN, ENUM, STRING_LIST]
    NotificationSeverity:
      type: string
      enum: [INFO, WARNING, CRITICAL]
    StatusUpdateKind:
      type: string
      enum:
        - ACKNOWLEDGEMENT
        - EN_ROUTE_REPORT
        - ON_SCENE_REPORT
        - SITUATION_UPDATE
        - ADDITIONAL_FORCES_REQUESTED
        - RESOLUTION_REPORT
    HealthStatus:
      type: string
      enum: [READY, WARMING, NOT_READY, FATAL]
    ClosureReason:
      type: string
      enum: [RESOLVED, FALSE_CALL, TRANSFERRED, CANCELLED_BY_CALLER]
    WorldEventKind:
      type: string
      enum: [TIMED, CONDITIONAL, ACTION_TRIGGERED, SEEDED_RANDOM]
    EffectKind:
      type: string
      enum:
        - MUTATE_WORLD_TRUTH
        - MUTATE_CALLER_BELIEF
        - CREATE_NOTIFICATION
        - CREATE_RADIO_MESSAGE
        - ALTER_RESOURCE_AVAILABILITY
        - TRIGGER_EVENT
        - CHANGE_CALLER_EMOTION
    GateOutcome:
      type: string
      enum: [ALLOWED, ALLOWED_SPONTANEOUS, ALLOWED_REPEAT, WITHHELD, NOT_YET, UNAVAILABLE]
    GateReason:
      type: string
      enum:
        - OK
        - NEVER_DISCLOSE
        - CALLER_DOES_NOT_KNOW
        - NOT_YET_AVAILABLE
        - REQUIRES_EXPLICIT_QUESTION
        - UNKNOWN_FACT_ID
        - ALREADY_REVEALED
    ScoringCategory:
      type: string
      enum:
        - INFORMATION_GATHERING
        - CARD_QUALITY
        - SERVICE_ROUTING
        - TIMELINESS
        - WORKFLOW
        - RESOURCE_MANAGEMENT
        - COMMUNICATION
    EvaluatorType:
      type: string
      enum:
        - FACT_OBTAINED
        - CARD_FIELD_CORRECT
        - CARD_FIELD_PRESENT
        - CARD_CONTRADICTION
        - SERVICE_SELECTION
        - DEADLINE
        - WORKFLOW_ACTION
        - RESOURCE_SELECTION
        - REQUIRED_STATUS_UPDATE
        - HANDOFF_COMPLETENESS
    Permission:
      type: string
      enum:
        - ANSWER_CALL
        - END_CALL
        - EDIT_CARD
        - SELECT_SERVICES
        - CREATE_HANDOFF
        - VIEW_HANDOFF
        - ACKNOWLEDGE_ASSIGNMENT
        - SELECT_RESOURCES
        - DISPATCH_RESOURCES
        - SEND_STATUS_UPDATE
        - CLOSE_INCIDENT
        - ACKNOWLEDGE_NOTIFICATION
        - VIEW_RESOURCE_BOARD
        - VIEW_TRANSCRIPT
        - SET_SERVICE_STATUS           # additive, I3 E5a
        - FLAG_CARD_ISSUE              # additive, I3 E5a
        - PLACE_DDS_CALL               # additive, I3 E6b
    EventType:
      type: string
      description: |
        All members of `backend/app/domain/events/types.py` — the 28 of SPEC §8 followed by the
        21 additive members of D5, then I3's additive members (70 §70.7).
      enum:
        - SESSION_CREATED
        - SESSION_STARTED
        - ROLE_STAGE_STARTED
        - CALL_RINGING
        - CALL_ANSWERED
        - USER_SPEECH_STARTED
        - USER_SPEECH_ENDED
        - ASR_PARTIAL
        - ASR_FINAL
        - CALLER_RESPONSE_PLANNED
        - CALLER_RESPONSE_GENERATED
        - CALLER_TTS_STARTED
        - CALLER_TTS_ENDED
        - CALLER_UTTERANCE_INTERRUPTED
        - CARD_FIELD_CHANGED
        - SERVICE_SELECTED
        - HANDOFF_CREATED
        - HANDOFF_RECEIVED
        - DDS_ACKNOWLEDGED
        - RESOURCE_SELECTED
        - RESOURCE_DISPATCHED
        - RESOURCE_STATUS_CHANGED
        - WORLD_EVENT_TRIGGERED
        - ROLE_STAGE_COMPLETED
        - SCORING_RULE_EVALUATED
        - SESSION_COMPLETED
        - MODEL_FALLBACK_USED
        - MODEL_ERROR
        - SESSION_ABORTED
        - STAGE_STATE_CHANGED
        - ROLE_TRANSITION_STARTED
        - ROLE_TRANSITION_COMPLETED
        - SERVICE_DESELECTED
        - RESOURCE_DESELECTED
        - DDS_STATUS_UPDATE_SENT
