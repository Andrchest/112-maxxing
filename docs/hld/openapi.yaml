  /api/v1/sessions/{session_id}/dds/legs/{assignment_id}/open:
    post:
      tags: [dds]
      operationId: openDdsCard
      summary: The ДДС opens the card on its leg (technical status «Получена службой»).
      description: |
        (additive, I3 E5a — 70 §70.4.2) `ADDED --receive--> RECEIVED`: `DDS_CARD_OPENED`
        (TRAINEE) and the leg's `DDS_SERVICE_STATUS_SET` (SIMULATION, `source: SYSTEM`).
        Idempotent: a second call on a leg past `ADDED` appends nothing and returns the leg.
        Offered in memo mode (`open_card` in `RECEIVED`; in `ACKNOWLEDGED` through
        `set_service_status`, whose first step on an `ADDED` leg is this `receive`); picker mode
        ⇒ `409 ACTION_NOT_AVAILABLE`.
      x-action: open_card
      x-emits: [DDS_CARD_OPENED, DDS_SERVICE_STATUS_SET]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - $ref: '#/components/parameters/AssignmentIdParam'
      responses:
        '200':
          description: The leg.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdsLegView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/dds/legs/{assignment_id}/status:
    post:
      tags: [dds]
      operationId: setDdsServiceStatus
      summary: Set the next response status of one service's leg (the memo's pencil form).
      description: |
        (additive, I3 E5a) Fires one `SERVICE_RESPONSE_TRANSITIONS` trigger (70 §70.4.2). An
        `ADDED` leg is first moved to `RECEIVED`. Out-of-sequence status ⇒ `409
        INVALID_TRANSITION`; missing comment on `NOT_ACCEPTED` / `REFUSED` ⇒ `422
        COMMENT_REQUIRED`; a leg bound to another participant — or a `SCRIPTED` leg, played by
        the scenario's script (I3 E5b, 70 §70.4.5) — ⇒ `403 FORBIDDEN_FOR_SERVICE`;
        `dds_mode: RESOURCE_PICKER` ⇒ `409 ACTION_NOT_AVAILABLE`. In memo mode any ДДС participant
        of the session may issue it (several ДДС trainees, each bound to a service). The trainee's first primary
        decision also fires the stage's `acknowledge`; no other stage trigger is fired (memo mode
        never enters `RESOURCE_SELECTION` … `WORKING`, 70 §70.4.4). Due deadline events are
        appended first (flush-before-append). (additive, I3 E6c — 80 §80.3.3, D24) The optional
        `proposed_by_call_id` names the ДДС call on which the status was heard: it must name a
        `DDS_CALL_STATUS_PROPOSED` of this leg, else `422 PROPOSAL_UNKNOWN`; it is copied into
        `DDS_SERVICE_STATUS_SET.proposed_by_call_id`. The status written is the request's, never
        the proposal's (the AI proposes, the trainee commits — INV 4).
      x-action: set_service_status
      x-emits: [DDS_CARD_STATUS_CHANGED, DDS_SERVICE_STATUS_SET, DDS_ACKNOWLEDGED, STAGE_STATE_CHANGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - $ref: '#/components/parameters/AssignmentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetServiceStatusRequest' }
      responses:
        '200':
          description: The leg after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdsLegView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/sessions/{session_id}/dds/card-issues:
    post:
      tags: [dds]
      operationId: flagDdsCardIssue
      summary: 'The ДДС flags an error in the received card (only `dds_card_check: ON`).'
      description: |
        (additive, I3 E5b — 70 §70.4.4, §70.7, C1) «Отметить ошибку в карточке». Records the flag
        against the frozen snapshot only; the DDS never sees the truth (INV 3) — whether the flag
        was right is scoring's question. Offered under `dds_card_check: ON` in memo `ACKNOWLEDGED`
        and in every picker state from `ACKNOWLEDGED` until the stage closes; `OFF` (the default)
        or any other state ⇒ `409 ACTION_NOT_AVAILABLE`; a leg the caller does not play ⇒
        `403 FORBIDDEN_FOR_SERVICE`; a blank `comment_ru` ⇒ `422 COMMENT_REQUIRED`; a `field_path`
        outside the session's card schema ⇒ `422 CARD_FIELD_UNKNOWN`.
      x-action: flag_card_issue
      x-emits: [DDS_CARD_ISSUE_FLAGGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlagCardIssueRequest' }
      responses:
        '201':
          description: The recorded flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardIssueView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # --- I7 E55 ---
  /api/v1/sessions/{session_id}/dds/card-marks:
    post:
      tags: [dds]
      operationId: setDdsCardMarks
      summary: The ДДС sets the card's «ЧС» / «ЧП» marks (memo mode; not scored).
      description: |
        (additive, I7 E55; owner decision 2026-09-29, Q9) The pencil beside «ЧС» / «ЧП» on the
        ДДС screen (`СКРИНШОТ ДДСГСИ.docx` image6, REQ-3040). The marks are the ДДС's own, not the
        112 card's: any ДДС participant of a `dds_mode: MEMO_STATUSES` session sets them while the
        stage still holds the card (whenever `set_service_status` or `close` is offered — so not
        once the stage is `CLOSED`); both default to `false`. A change appends one
        `DDS_CARD_MARKS_SET` (TRAINEE); the same pair again appends nothing. Picker mode or a
        closed stage ⇒ `409 ACTION_NOT_AVAILABLE`; an instructor or a non-ДДС caller ⇒ `403`.
        Answers with the work item, `dds_marks` included. Not read by any scoring rule. The audit
        row carries `dds_card.chs` / `dds_card.chp` before → after (I7 E43).
      x-action: set_service_status
      x-emits: [DDS_CARD_MARKS_SET]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetDdsCardMarksRequest' }
      responses:
        '200':
          description: The work item with its marks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdsWorkItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/sessions/{session_id}/dds/close:
    post:
      tags: [dds]
      operationId: closeDdsIncident
      summary: Close the incident.
      description: |
        Permission `CLOSE_INCIDENT`; fires `close` (`RESOLVED → CLOSED`). The stage then
        completes and, being the last `role_chain` entry in the primary flow, the session
        machine fires `complete` and deterministic scoring runs over the event log.
        (I3 E5a — 70 §70.4.4) Picker mode unchanged (`RESOLVED --close--> CLOSED`). Memo mode:
        fires `close` from `ACKNOWLEDGED` (additive `DDS_TRANSITIONS` row, guard
        `memo_all_legs_terminal` — every leg `COMPLETED`, `NOT_ACCEPTED` or `REFUSED`) and then
        from `RESOLVED`, in one Unit of Work; a leg still open ⇒ `409 INVALID_TRANSITION`. In
        picker mode the new guard always denies. `x-emits` lists the memo order; picker mode
        appends the same events without the first `STAGE_STATE_CHANGED`.
      x-action: close
      x-emits: [STAGE_STATE_CHANGED, DDS_INCIDENT_CLOSED, ROLE_STAGE_COMPLETED, STAGE_STATE_CHANGED, SCORING_RULE_EVALUATED, SESSION_COMPLETED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseIncidentRequest' }
      responses:
        '200':
          description: The session after closure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ----------------------------------------------------------- dds-calls ----
  # (additive, I3 E6b — `80-telephony.md` §80.3, `contracts/i3-telephony-openapi-delta.yaml`)
  /api/v1/sessions/{session_id}/dds-calls:
    post:
      tags: [dds]
      operationId: startDdsCall
      summary: The ДДС trainee places a call (service head, claimant or 112) — only `dds_brigade_call = ON`.
      description: |
        (additive, I3 E6b — 80 §80.3.2) Fires `start` then, when the transport is ready, `ring`
        of `DDS_CALL_TRANSITIONS`. `SERVICE_HEAD` needs `assignment_id` of a leg the caller plays
        (`plays_leg`), else `403 FORBIDDEN_FOR_SERVICE`; `CLAIMANT` and `OPERATOR_112` take no
        `assignment_id` (`422 VALIDATION_ERROR`). `dds_brigade_call = OFF`, `dds_mode =
        RESOURCE_PICKER` or the DDS stage not started ⇒ `409 ACTION_NOT_AVAILABLE`; the user
        already has a live call in the session ⇒ `409 DDS_LINE_BUSY`. The endpoint is `SIP` when
        the user has a live softphone binding and the deployment offers `sip` (80 §80.3.7, E6e),
        else `BROWSER`; `voice` is the room-scoped LiveKit token for the browser endpoint and
        `null` for `SIP` (the softphone rings instead). `SERVICE_HEAD` kind: E6c; `OPERATOR_112`
        kind: E6d; `CLAIMANT`: E6b — all three are implemented. A `CLAIMANT` call is placed to the frozen snapshot's `caller.phone`;
        while the session's 112 call is live the claimant is `busy` (the call comes back `ENDED`).
        (I3 E6c — 80 §80.4.1) A `SERVICE_HEAD` call without `assignment_id` ⇒ `422
        VALIDATION_ERROR`, a leg not on this card ⇒ `404`; it dials the service's number (its
        catalog `code`, else `7` + its position) and the persona is resolved from the session's
        reference pack by catalog category (`code` over `kind`) unless the scenario names one for
        the service (R42); `persona_id` is recorded on `DDS_CALL_STARTED` and a `busy` persona
        answers `BUSY`.
        (I3 E6d — 80 §80.3.4) An `OPERATOR_112` call («Позвонить в 112», `call_112`) dials `112`
        and is answered by the AI 112 operator (persona `OPERATOR_112`; owner Q1's default): it
        knows the session's snapshot only and asks for REQ-5332's checklist — self-identification,
        the address, the card being worked, the change — each item the trainee covers becoming a
        `DDS_CALL_ASSERTION` for the instructor and the scorer. `answered_by` is `AI` on every
        I3 call; `TRAINEE` on an `OPERATOR_112` call is the reserved hook of E6g.
      x-action: [call_service_head, call_claimant, call_112]
      x-emits: [DDS_CALL_STARTED, DDS_CALL_ENDED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartDdsCallRequest' }
      responses:
        '201':
          description: The call (usually `RINGING`; `ENDED` with `BUSY` for a claimant whose 112 call is live).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartDdsCallResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [dds]
      operationId: listDdsCalls
      summary: Every ДДС call of the session, newest first — restores the phone widget after a refresh (INV 13).
      description: (additive, I3 E6b) Read from the `dds_calls` read model (migration 0014). DDS and INSTRUCTOR only.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The calls.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DdsCallView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/dds-calls/{call_id}:
    get:
      tags: [dds]
      operationId: getDdsCall
      summary: One ДДС call.
      description: (additive, I3 E6b) One row of the `dds_calls` read model. DDS and INSTRUCTOR only.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - $ref: '#/components/parameters/CallIdParam'
      responses:
        '200':
          description: The call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdsCallView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/dds-calls/{call_id}/answer:
    post:
      tags: [dds]
      operationId: answerDdsCall
      summary: The ДДС trainee answers an INBOUND brigade call (a `report CALL_IN` script step).
      description: |
        (additive, I3 E6c — 80 §80.3.2, §80.3.3) Fires `answer` (TRAINEE) on an `INBOUND` call in
        `RINGING` — the brigade's call a due `report: CALL_IN` step of the trainee's own leg
        started; an `OUTBOUND` call or another state ⇒ `409 INVALID_TRANSITION`; another
        trainee's line ⇒ `403 FORBIDDEN_FOR_ROLE`. Returns the call and, for the browser
        endpoint, the room-scoped token.
      x-action: answer
      x-emits: [DDS_CALL_ANSWERED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - $ref: '#/components/parameters/CallIdParam'
      responses:
        '200':
          description: The call, `CONNECTED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartDdsCallResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/dds-calls/{call_id}/hang-up:
    post:
      tags: [dds]
      operationId: hangUpDdsCall
      summary: The ДДС trainee hangs up (from DIALING, RINGING or CONNECTED).
      description: |
        (additive, I3 E6b) Fires `hang_up` (TRAINEE, `end_reason HANGUP`), then publishes
        `voice:cancel:{session_id} {call_id, reason HANGUP}` after commit (the agent leaves; a SIP
        endpoint's gateway sends `BYE`). An `ENDED` call ⇒ `409 INVALID_TRANSITION`; another
        trainee's line ⇒ `403 FORBIDDEN_FOR_ROLE`.
      x-action: hang_up
      x-emits: [DDS_CALL_ENDED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - $ref: '#/components/parameters/CallIdParam'
      responses:
        '200':
          description: The call, `ENDED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdsCallView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ----------------------------------------------------------- telephony ----
  # (additive, I3 E6e — `80-telephony.md` §80.2.3, §80.3.5, §80.7,
  # `contracts/i3-telephony-openapi-delta.yaml` items `x-epic: E6e`). Called by the SIP gateway
  # only, with its service credential (`sipGatewaySecret`); never with a user's bearer token.
  /api/v1/telephony/dial:
    post:
      tags: [telephony]
      operationId: dialFromSip
      summary: The SIP gateway asks the backend to start the call a registered softphone dialled.
      description: |
        (additive, I3 E6e — 80 §80.2.3 step 2, §80.3.5) Resolves the session by the selection
        rule — among the user's ACTIVE sessions where they are a ДДС participant, the DDS stage is
        the active stage and `dds_brigade_call = ON`, the card this user opened last
        (`DDS_CARD_OPENED`) wins, else the oldest — then `dialed` by the pure dial plan (`112`, a
        catalog `code`, `7` + 3 digits, the claimant's number), and runs the same `startDdsCall`
        use case with `endpoint SIP`, `dialed` as dialled and `selection_reason` recorded on
        `DDS_CALL_STARTED`. The call stays `DIALING` until the gateway reports `leg UP`.
        `sip_user` is a `users.username`; an unknown or retired account ⇒ `403`. Unknown number, a
        service with no leg on the selected card, or a leg the user does not play ⇒
        `404 DIAL_NUMBER_UNKNOWN` (the gateway answers SIP `404`); no eligible session ⇒
        `409 NO_ACTIVE_DDS_SESSION` (SIP `480`); every other `startDdsCall` refusal as there
        (`409 DDS_LINE_BUSY` ⇒ SIP `486`). `999` never reaches this endpoint (gateway echo).
      security:
        - sipGatewaySecret: []
      x-action: '-'
      x-emits: [DDS_CALL_STARTED, DDS_CALL_ENDED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SipDialRequest' }
      responses:
        '201':
          description: The call was started; the gateway joins `room_name` with a self-minted token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SipDialResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/telephony/calls/{call_id}:
    get:
      tags: [telephony]
      operationId: getTelephonyCall
      summary: The gateway re-reads a call it bridges (after a Redis reconnect or its own restart).
      description: (additive, I3 E6e) One row of the `dds_calls` read model; `available_actions` is empty (the gateway is not a participant).
      security:
        - sipGatewaySecret: []
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/CallIdParam'
      responses:
        '200':
          description: The call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdsCallView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/telephony/calls/{call_id}/leg:
    post:
      tags: [telephony]
      operationId: reportSipLeg
      summary: The gateway reports its softphone leg of a SIP-endpoint call.
      description: |
        (additive, I3 E6e — 80 §80.2.3, §80.3.2) `UP` — the gateway is in the room with the
        softphone connected ⇒ an OUTBOUND call in `DIALING` fires `ring` (guard
        `guard_dds_call_transport_ready`: the transport ready and the gateway's leg up; not ready
        yet ⇒ the call stays `DIALING` and the gateway reports again), an INBOUND call in `RINGING`
        fires `answer` by the TRAINEE on the line (picking up the softphone); otherwise idempotent.
        `FAILED` — the softphone did not answer within 30 s or rejected the call ⇒ `hang_up` by
        SYSTEM, `end_reason ABORT`. `DOWN` — `BYE` or `CANCEL` from the softphone ⇒ `hang_up` by
        TRAINEE, `end_reason HANGUP`. A report on an `ENDED` call (or a session no longer ACTIVE)
        is accepted and ignored (200), so a late `BYE` never fails. A `BROWSER` call ⇒
        `409 INVALID_TRANSITION`. After the commit: `voice:join` for a call just rung,
        `voice:cancel` for a call just ended.
      security:
        - sipGatewaySecret: []
      x-action: '-'
      x-emits: [DDS_CALL_ANSWERED, DDS_CALL_ENDED]
      parameters:
        - $ref: '#/components/parameters/CallIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SipLegReport' }
      responses:
        '200':
          description: The call after the report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdsCallView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/telephony/sip-credentials/{username}:
    get:
      tags: [telephony]
      operationId: getSipCredential
      summary: Per-user SIP HA1 for the registrar (migration 0015).
      description: |
        (additive, I3 E6e — 80 §80.7) Returns `users.sip_ha1` for `username` (set by
        `python -m app.tools.set_sip_password`); `404` when the account has none — the deployment
        password then applies; `403` for an unknown or retired account — the registrar answers that
        REGISTER `403` (E6e decision 3). Never logged by either side (SPEC §41).
      security:
        - sipGatewaySecret: []
      x-action: '-'
      x-emits: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: The HA1 digest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SipCredentialView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------- instructor ----
  /api/v1/instructor/sessions/{session_id}/overview:
    get:
      tags: [instructor]
      operationId: getInstructorSessionOverview
      summary: Live instructor overview — includes WorldTruth and gate internals.
      description: |
        `x-visibility: INSTRUCTOR`. The one live endpoint that exposes `WorldTruth`,
        `CallerBelief` and `FactAccessGate` decisions (D3, D11). Restricted to `INSTRUCTOR` and
        `ADMIN`; a `TRAINEE` gets `403 FORBIDDEN_FOR_ROLE` even for a session they participate in.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorSessionOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/instructor/sessions/{session_id}/report/release:
    post:
      tags: [instructor]
      operationId: releaseReportToTrainee
      summary: Release the report to the trainee.
      description: |
        For modes whose `SessionPolicy.report_visible_to_trainee_before_release` is `false`
        (`MULTI_TRAINEE`, `ASSESSMENT`) the trainee's `GET /api/v1/reports/{session_id}` answers
        `403 REPORT_NOT_RELEASED` until this command runs. It changes no score: releasing is a
        visibility flag, not a scoring operation (D11).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The release state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportReleaseView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
