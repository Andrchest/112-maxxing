      tags: [dds]
      operationId: acknowledgeNotification
      summary: Acknowledge one notification.
      description: Permission `ACKNOWLEDGE_NOTIFICATION`. Held by both `Operator112Module` and `DDSModule`.
      x-action: acknowledge_notification
      x-emits: [NOTIFICATION_ACKNOWLEDGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - name: notification_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The acknowledged notification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/dds/radio-messages:
    get:
      tags: [dds]
      operationId: listRadioMessages
      summary: Radio traffic addressed to the caller's role.
      description: |
        Radio messages have **no table**: they are read from `session_events`
        (`RADIO_MESSAGE_CREATED`) through a read model built from the log
        (`docs/hld/20-db-schema.md` §20.1). Filtered to `to_role == the caller's role`.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - name: after_seq_no
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Radio messages in log order.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, last_seq_no]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RadioMessageView' }
                  last_seq_no: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/dds/close:
    post:
      tags: [dds]
      operationId: closeDdsIncident
      summary: Close the incident.
      description: |
        Permission `CLOSE_INCIDENT`; fires `close` (`RESOLVED → CLOSED`). The stage then
        completes and, being the last `role_chain` entry in the primary flow, the session
        machine fires `complete` and deterministic scoring runs over the event log.
      x-action: close
      x-emits: [DDS_INCIDENT_CLOSED, ROLE_STAGE_COMPLETED, STAGE_STATE_CHANGED, SCORING_RULE_EVALUATED, SESSION_COMPLETED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseIncidentRequest' }
      responses:
        '200':
          description: The session after closure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------- instructor ----
  /api/v1/instructor/sessions/{session_id}/overview:
    get:
      tags: [instructor]
      operationId: getInstructorSessionOverview
      summary: Live instructor overview — includes WorldTruth and gate internals.
      description: |
        `x-visibility: INSTRUCTOR`. The one live endpoint that exposes `WorldTruth`,
        `CallerBelief` and `FactAccessGate` decisions (D3, D11). Restricted to `INSTRUCTOR` and
        `ADMIN`; a `TRAINEE` gets `403 FORBIDDEN_FOR_ROLE` even for a session they participate in.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstructorSessionOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/instructor/sessions/{session_id}/report/release:
    post:
      tags: [instructor]
      operationId: releaseReportToTrainee
      summary: Release the report to the trainee.
      description: |
        For modes whose `SessionPolicy.report_visible_to_trainee_before_release` is `false`
        (`MULTI_TRAINEE`, `ASSESSMENT`) the trainee's `GET /api/v1/reports/{session_id}` answers
        `403 REPORT_NOT_RELEASED` until this command runs. It changes no score: releasing is a
        visibility flag, not a scoring operation (D11).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The release state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportReleaseView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------- reports ----
  /api/v1/reports/{session_id}:
    get:
      tags: [reports]
      operationId: getSessionReport
      summary: The post-session report (SPEC §29, every item).
      description: |
        Assembles every SPEC §29 item: total score, score by category, critical errors, the
        complete event timeline, the transcript with audio offsets for click-to-seek, the final
        card, the ground-truth-vs-entered-card diff, the handoff snapshot, the DDS decisions, the
        resource timeline, timing metrics and the evidence for every scoring rule.

        The truth-vs-card diff is the one place `WorldTruth` is shown to a human (D11); it is
        included only for `INSTRUCTOR`/`ADMIN`, or for the trainee once the report is released.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/reports/{session_id}/rescore:
    post:
      tags: [reports]
      operationId: rescoreSession
      summary: Re-score deterministically from the event log.
      description: |
        Runs `score(scenario_version, events)` again over `(scenario_versions.content, ordered
        session_events)` — no LLM, no clock, no materialized table (D11, SPEC §42 tests 9–11) —
        and compares the result with the stored `score_results`. The response's
        `identical_to_stored` flag is the machine-checkable form of "the same event log and
        scenario version must always reproduce the same score" (SPEC §28).

        `persist: false` (the default) leaves the stored results untouched, so the check is
        non-destructive.
      x-action: '-'
      x-emits: [SCORING_RULE_EVALUATED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescoreRequest' }
      responses:
        '200':
          description: The recomputed report plus the equality flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RescoreResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/reports/{session_id}/explanation:
    get:
      tags: [reports]
      operationId: getReportExplanation
      summary: The stored LLM explanation of an already-computed report.
      description: |
        A separate resource from the report on purpose: the explanation is generated only from
        an already persisted `ScoreReport`, is stored separately, and cannot write to the score
        tables (SPEC §29, D11). `404` when none has been generated.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The explanation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExplanation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [reports]
      operationId: generateReportExplanation
      summary: Generate the LLM explanation of an already-computed report.
      description: |
        Reads the persisted `ScoreReport` and produces prose. It **cannot alter scores**: the
        handler has no write path to `score_results` or `score_evidence`, and the response
        echoes `score_report_checksum` so a client can verify that the numbers did not move
        (SPEC §2, §29, D11). Refused with `409 REPORT_NOT_READY` before scoring has run.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateExplanationRequest' }
      responses:
        '201':
          description: The generated explanation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportExplanation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/reports/{session_id}/inference-metrics:
    get:
      tags: [reports]
      operationId: listInferenceMetrics
      summary: Inference latency telemetry for one session (SPEC §27).
      description: |
        Rows of `inference_metrics` plus the aggregate of the critical product metric
        `speech_end_to_first_audio_ms` (p50 / p95), computed per turn from `USER_SPEECH_ENDED`
        and the first audible `CALLER_TTS_STARTED` (D9). Benchmark values are measured, never
        hard-coded (SPEC §27).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - name: component
          in: query
          required: false
          schema:
            type: string
            enum: [ASR, LLM_INTERPRETER, LLM_GENERATOR, TTS, VAD]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        '200':
          description: Metrics and the product-metric aggregate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InferenceMetricsPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # -------------------------------------------------------------- health ----
  /api/v1/health/live:
    get:
      tags: [health]
      operationId: getHealthLive
      summary: Process liveness.
      description: Liveness only, deliberately separate from readiness (SPEC §37).
      security: []
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthLiveResponse' }

  /api/v1/health/ready:
    get:
      tags: [health]
      operationId: getHealthReady
      summary: Per-service readiness.
      description: |
        Aggregates `postgres`, `redis`, `livekit` (owned by the backend) with `llm`, `asr`,
        `tts`, `vad` (read from the Redis keys `voice:health:{service}`, a missing key being
        `NOT_READY`, `docs/hld/60-inference-ops.md` §4.3). Each component reports
        `READY | WARMING | NOT_READY | FATAL` (D8). The UI disables the start button from this
        response (SPEC §37). Answers `200` when `overall` is `READY`, `503` otherwise, so a
        plain HTTP health probe works.
      security: []
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: Every required component is `READY`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReadyResponse' }
        '503':
          description: At least one required component is not `READY`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReadyResponse' }

  # --------------------------------------------------------------- admin ----
  /api/v1/admin/recordings/purge:
    post:
      tags: [admin]
      operationId: purgeRecordings
      summary: Purge recordings past the retention window (ADMIN).
      description: |
        Deletes the WAV files of sessions past `RECORDING_RETENTION_DAYS`, sets
        `audio_segments.file_path = NULL` and `audio_segments.purged_at = now()`, and writes one
        `recording_purge_audit` record. Rows are kept so that offsets, transcripts, events and
        scores stay intact and the same event log still reproduces the same score (SPEC §28,
        §41, D9). `dry_run: true` reports what would be purged and deletes nothing.

        No session event is appended: a completed session's log is closed (D9).
      x-action: '-'
      x-emits: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurgeRecordingsRequest' }
      responses:
        '200':
          description: What was purged, or would be purged under `dry_run`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurgeRecordingsResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/inference/clear-fatal:
    post:
      tags: [admin]
      operationId: clearInferenceFatal
      summary: Clear a latched FATAL inference state (ADMIN).
      description: |
        Deletes the Redis key `voice:health:fatal`, which is otherwise never expired so that a
        restart loop cannot make a fatal condition look transient
        (`docs/hld/60-inference-ops.md` §4.3). Touches no session state.
      x-action: '-'
      x-emits: [INFERENCE_HEALTH_CHANGED]
      responses:
        '200':
          description: The readiness snapshot after clearing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReadyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

