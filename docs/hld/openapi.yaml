    get:
      tags: [health]
      operationId: getHealthReady
      summary: Per-service readiness.
      description: |
        Aggregates `postgres`, `redis`, `livekit` (owned by the backend) with `llm`, `asr`,
        `tts`, `vad` (read from the Redis keys `voice:health:{service}`, a missing key being
        `NOT_READY`, `docs/hld/60-inference-ops.md` §4.3). Each component reports
        `READY | WARMING | NOT_READY | FATAL` (D8). The UI disables the start button from this
        response (SPEC §37). Answers `200` when `overall` is `READY`, `503` otherwise, so a
        plain HTTP health probe works.
      security: []
      x-action: '-'
