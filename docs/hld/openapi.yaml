        - DDS_CARD_OPENED              # additive, I3 E5a
        - DDS_SERVICE_STATUS_SET       # additive, I3 E5a
        - DDS_CARD_ISSUE_FLAGGED       # additive, I3 E5b
        - DDS_CARD_MARKS_SET           # additive, I7 E55
        - DDS_CALL_STARTED             # additive, I3 E6b
        - DDS_CALL_ANSWERED            # additive, I3 E6b
        - DDS_CALL_ENDED               # additive, I3 E6b
        - DDS_CALL_STATUS_PROPOSED     # additive, I3 E6c
        - DDS_CALL_ASSERTION           # additive, I3 E6c

    # ------------------------------------------------------ value objects ----
    FactValue:
      description: |
        `FactValue = str | int | float | bool | list[str] | None` — the value domain shared by
        `WorldTruth.facts`, `CallerBelief.facts` and `OperatorCard.values`
        (`10-domain-model.md` §10.3).
      anyOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items: { type: string }
        - type: 'null'

    ActorRef:
      type: object
      additionalProperties: false
      required: [actor_type, actor_id]
      properties:
        actor_type: { $ref: '#/components/schemas/ActorType' }
        actor_id: { type: [string, 'null'], format: uuid }

    ActionDescriptor:
      type: object
      description: |
        One entry of `RoleModule.available_actions(stage_state)`. The frontend enables buttons
        from this list and never decides a transition itself (D12).
      additionalProperties: false
      required: [action_id, label_ru, permission, trigger]
      properties:
        action_id: { type: string, examples: [answer, edit_card, create_handoff] }
        label_ru: { type: string, examples: [Ответить] }
        permission: { $ref: '#/components/schemas/Permission' }
        trigger:
          type: [string, 'null']
          description: The state-machine trigger, or `null` for a non-transition command such as `edit_card`.

    # -------------------------------------------------------------- auth ----
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 256, format: password }

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string, description: HS256 JWT. }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer, minimum: 1, description: Seconds until expiry. }
        user: { $ref: '#/components/schemas/UserAccount' }

    UserAccount:
      type: object
      additionalProperties: false
      required: [id, username, display_name_ru, user_role, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name_ru: { type: string }
        user_role: { $ref: '#/components/schemas/UserRole' }
        created_at: { type: string, format: date-time }

    # ---------------------------------------------------- accounts (I4 E28) ----
    UserAccountI4:
      description: (additive, I4 E28) `UserAccount` plus `is_active`.
      type: object
      additionalProperties: false
      required: [id, username, display_name_ru, user_role, created_at, is_active]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name_ru: { type: string }
        user_role: { $ref: '#/components/schemas/UserRole' }
        created_at: { type: string, format: date-time }
        is_active:
          type: boolean
          description: (I4 E28) `false` = blocked (ТЗ ¶197); refused at login and per request.

    # ---------------------------------------------- I5 E37: profile export (Q-E16-4) ----
    UserProfileExport:
      description: |
        (additive, I5 E37) `exportUserProfile` — `UserAccountI4`'s fields plus the E33 history
        summary for a TRAINEE account (`null` for INSTRUCTOR/ADMIN). Never the password hash or
        the SIP HA1 (SPEC §41).
      type: object
      additionalProperties: false
      required: [id, username, display_name_ru, user_role, created_at, is_active, history]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name_ru: { type: string }
        user_role: { $ref: '#/components/schemas/UserRole' }
        created_at: { type: string, format: date-time }
        is_active: { type: boolean }
        history:
          oneOf:
            - $ref: '#/components/schemas/TraineeStatisticsRow'
            - type: 'null'
    UserCreateRequest:
      description: (I4 E28) `createUser`'s body.
      type: object
      additionalProperties: false
      required: [username, display_name_ru, user_role, password]
      properties:
        username: { type: string, minLength: 1 }
        display_name_ru: { type: string, minLength: 1 }
        user_role: { $ref: '#/components/schemas/UserRole' }
        password:
          type: string
          writeOnly: true
          description: Minimum length from config; never logged or audited.
    UserUpdateRequest:
      description: (I4 E28) `updateUser`'s body. Every field optional; at least one is required.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name_ru: { type: string, minLength: 1 }
        user_role: { $ref: '#/components/schemas/UserRole' }
        is_active: { type: boolean }
    PasswordResetRequest:
      description: (I4 E28) `resetUserPassword`'s body.
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, writeOnly: true }

    # ------------------------------------------------ admin monitoring (I4 E29) ----
    AuditAction:
      description: The `audit_log.action` CHECK list (HLD 20 §20.11.1), written by E25, read by E29.
      type: string
      enum: [HTTP_REQUEST, LOGIN_SUCCEEDED, LOGIN_FAILED, ACCESS_DENIED, WS_CONNECTED]
    AuditOutcome:
      type: string
      enum: [OK, DENIED, ERROR]
    AuditEntryView:
      description: (I4 E29) One `audit_log` row. Never carries request or response bodies.
      type: object
      additionalProperties: false
      required: [id, ts, user_id, role, action, operation_id, method, path_template, target_ids, status, client_ip, outcome]
      properties:
        id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        user_id: { type: [string, 'null'], format: uuid }
        role: { type: [string, 'null'] }
        action: { $ref: '#/components/schemas/AuditAction' }
        operation_id: { type: [string, 'null'] }
        method: { type: string }
        path_template: { type: string }
        target_ids:
          type: object
          description: Path parameters of the request (e.g. `session_id`); for LOGIN_* the attempted `username`.
          additionalProperties: { type: string }
        status: { type: integer }
        client_ip: { type: [string, 'null'] }
        outcome: { $ref: '#/components/schemas/AuditOutcome' }
        username:
          type: [string, 'null']
          description: (additive, I6) The acting account's login, joined from `users` at read time; `null` when `user_id` is `null` (for LOGIN_* the attempted username is `target_ids.username`).
        display_name_ru:
          type: [string, 'null']
          description: (additive, I6) The acting account's display name, joined like `username`.
        changes:
          type: array
          description: |
            (additive, I7 E43, Q-E15-3) «было → стало»: each field the request's use case changed, in
            order; empty for a read, a refusal, a failed request or an entry written before 0019.
          items: { $ref: '#/components/schemas/AuditChangeView' }
    # --- I7 E43 ---
    AuditChangeView:
      description: |
        (I7 E43) One changed field of an audited request. `field` is `<entity>.<field>`, optionally
        with a `[qualifier]` (a card position, a rule id), e.g. `user.user_role`, `lesson.weight[2]`,
        `score.rule_points[R1]`. `before`/`after` are any JSON value (`null` = absent / not set). A
        secret (password, hash, HA1, token, key) is never recorded: both are `null` («изменён»).
      type: object
      additionalProperties: false
      required: [field, before, after]
      properties:
        field: { type: string }
        before: {}
        after: {}
    # --- end I7 E43 ---
    UsageStats:
      description: (I4 E29) `getUsageStats`'s response.
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [date, logins, sessions, lessons, active_users]
            properties:
              date: { type: string, format: date }
              logins: { type: integer, minimum: 0 }
              sessions: { type: integer, minimum: 0 }
              lessons: { type: integer, minimum: 0 }
              active_users: { type: integer, minimum: 0 }
    ServerLoad:
      description: (I4 E29) Every metric is `null` when it cannot be read — never `0`.
      type: object
      additionalProperties: false
      required: [sampled_at, cpu_percent, memory_used_mb, memory_total_mb, disk_used_gb, disk_total_gb, gpu_memory_used_mb, gpu_memory_total_mb]
      properties:
        sampled_at: { type: string, format: date-time }
        cpu_percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        memory_used_mb: { type: [number, 'null'], minimum: 0 }
        memory_total_mb: { type: [number, 'null'], minimum: 0 }
        disk_used_gb: { type: [number, 'null'], minimum: 0 }
        disk_total_gb: { type: [number, 'null'], minimum: 0 }
        gpu_memory_used_mb: { type: [number, 'null'], minimum: 0 }
        gpu_memory_total_mb: { type: [number, 'null'], minimum: 0 }
    ErrorRecordView:
      description: (I4 E29) One merged error record (`getErrorReport`).
      type: object
      additionalProperties: false
      required: [ts, source, message, session_id]
      properties:
        ts: { type: string, format: date-time }
        source: { type: string, enum: [BACKEND_LOG, VOICE_AGENT_LOG, SIP_GATEWAY_LOG, MODEL_ERROR, INFERENCE_FATAL] } # VOICE_AGENT_LOG/SIP_GATEWAY_LOG additive, I7 E51 (G6)
        message: { type: string }
        session_id: { type: [string, 'null'], format: uuid }
    AdminAlertView:
      description: (I4 E29) One derived alert (`listAdminAlerts`).
      type: object
      additionalProperties: false
      required: [kind, since, detail_ru]
      properties:
        kind: { type: string, enum: [INFERENCE_FATAL, BACKUP_STALE, BACKUP_FAILED, LOGIN_FAILURES] }
        since: { type: string, format: date-time }
        detail_ru: { type: string }
    BackupStatus:
      description: '(I4 E29) `backups/last.json` written by E26''s backup service; `available: false` when absent or unreadable.'
      type: object
      additionalProperties: false
      required: [available, finished_at, status, database_bytes, recordings_bytes, database_sha256, recordings_sha256]
      properties:
        available: { type: boolean }
        finished_at: { type: [string, 'null'], format: date-time }
        status: { type: [string, 'null'], enum: [OK, FAILED, null] }
        database_bytes: { type: [integer, 'null'], minimum: 0 }
        recordings_bytes: { type: [integer, 'null'], minimum: 0 }
        database_sha256: { type: [string, 'null'] }
        recordings_sha256: { type: [string, 'null'] }

    # --------------------------------------------------------- scenarios ----
    ScenarioSummary:
      type: object
      description: '`Scenario` — identity only (D4): slug and title, never content.'
      additionalProperties: false
      required: [scenario_id, slug, title_ru, version_count, latest_version, latest_difficulty, archived_at]
      properties:
        scenario_id: { type: string, format: uuid }
        slug: { type: string }
        title_ru: { type: string }
        version_count: { type: integer, minimum: 0 }
        latest_version: { type: [integer, 'null'], minimum: 1 }
        latest_difficulty:
          description: (additive, I3 E9a) The latest version's difficulty («Сложность», 1–5).
          type: [integer, 'null']
          minimum: 1
          maximum: 5
        archived_at:
          description: (additive, I4 E32) `null` = active; set = hidden from pickers.
          type: [string, 'null']
          format: date-time
        # --- I7 E53 ---
        category:
          description: >-
            (additive, I7 E53, G13; ТЗ ¶324/¶334) The latest version's event category — the
            classifier group of its `incident.classifier_code` (prefab card, else `world_truth`),
            else of its first numeric `incident.types` chip; `null` = «без категории».
          oneOf:
            - $ref: '#/components/schemas/ScenarioCategory'
            - type: 'null'
        # --- end I7 E53 ---

    # --- I7 E53 ---
    ScenarioCategory:
      type: object
      description: (additive, I7 E53) One classifier group (`reference/classifier`), as a scenario's category.
      additionalProperties: false
      required: [group_no, name_ru]
      properties:
        group_no: { type: integer, minimum: 1 }
        name_ru: { type: string }
    # --- end I7 E53 ---

    ScenarioVersionListItem:
      type: object
      additionalProperties: false
      required:
        - id
        - scenario_id
        - schema_version
        - version
        - title
        - description
        - difficulty
        - role_chain
        - content_sha256
        - locked_at
        - created_at
        - variants
      properties:
        id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        schema_version: { type: integer, minimum: 1 }
        version: { type: integer, minimum: 1 }
        title: { type: string }
        description: { type: string }
        difficulty: { type: integer }
        role_chain:
          type: array
          items: { $ref: '#/components/schemas/RoleType' }
        content_sha256: { type: string }
        locked_at:
          type: [string, 'null']
          format: date-time
          description: Set in the transaction that creates the first session using this version (D4).
        created_at: { type: string, format: date-time }
        variants: { $ref: '#/components/schemas/ScenarioVariantsView' }

    ScenarioVersionTraineeSummary:
      type: object
      description: |
        Trainee-safe projection: no `world_truth`, `caller_knowledge`, `disclosure_rules`,
        `expected_response`, `world_events` or `scoring_rules`. The caller's persona is included
        only to the extent a dispatcher would perceive it on the phone.
      additionalProperties: false
      required:
        - id
        - scenario_id
        - scenario_slug
        - version
        - title
        - description
        - difficulty
        - role_chain
        - caller_display_ru
        - caller_language
        - caller_age_group
        - caller_relationship
        - estimated_duration_seconds
        - resource_count
        - variants
      properties:
        id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        scenario_slug: { type: string }
        version: { type: integer, minimum: 1 }
        title: { type: string }
        description: { type: string }
        difficulty: { type: integer }
        role_chain:
          type: array
          items: { $ref: '#/components/schemas/RoleType' }
        caller_display_ru:
          type: string
          description: '`CallerProfile.identity_ru`.'
        caller_language: { type: string, examples: ['ru-RU'] }
        caller_age_group: { $ref: '#/components/schemas/AgeGroup' }
        caller_relationship: { $ref: '#/components/schemas/CallerRelationship' }
        estimated_duration_seconds: { type: [integer, 'null'], minimum: 0 }
        resource_count:
          type: integer
          minimum: 0
          description: How many resources the DDS board will show — a count, never the list.
        variants: { $ref: '#/components/schemas/ScenarioVariantsView' }

    ScenarioVariantsView:
      description: |
        (additive, I3 E1) What a scenario version supports and defaults to, after the schema-1
        derivation and the implemented-values filter (70 §70.2.2).
      type: object
      additionalProperties: false
      required: [supported, default]
      properties:
        supported:
          type: object
          additionalProperties: false
          required: [card_source, dds_mode, dds_card_check, dds_brigade_call]
          properties:
            card_source: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CardSource' } }
            dds_mode: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DdsMode' } }
            dds_card_check: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DdsCardCheck' } }
            dds_brigade_call: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DdsBrigadeCall' } }
        default: { $ref: '#/components/schemas/SessionVariants' }

    SessionVariants:
      description: (additive, I3 E1) The resolved, recorded variants of one session (immutable after creation).
      type: object
      additionalProperties: false
      required: [card_source, dds_mode, dds_card_check, dds_brigade_call]
      properties:
        card_source: { $ref: '#/components/schemas/CardSource' }
        dds_mode: { $ref: '#/components/schemas/DdsMode' }
        dds_card_check: { $ref: '#/components/schemas/DdsCardCheck' }
        dds_brigade_call: { $ref: '#/components/schemas/DdsBrigadeCall' }

    VariantsRequest:
      description: (additive, I3 E1) Every field optional; a missing one takes the scenario default, then the product default.
      type: object
      additionalProperties: false
      properties:
        card_source: { $ref: '#/components/schemas/CardSource' }
        dds_mode: { $ref: '#/components/schemas/DdsMode' }
        dds_card_check: { $ref: '#/components/schemas/DdsCardCheck' }
        dds_brigade_call: { $ref: '#/components/schemas/DdsBrigadeCall' }

    ScenarioImportRequest:
      type: object
      additionalProperties: false
      required: [format, content]
      properties:
        format:
          type: string
          enum: [YAML, JSON]
        content:
          type: string
          description: The complete scenario version document, verbatim (`docs/hld/30-scenario-format.md`).
        source_path:
          type: [string, 'null']
          description: 'Optional provenance, e.g. `scenarios/examples/fire-apartment/v1.yaml`.'

    ScenarioValidationIssue:
      type: object
      description: One violation from `validate_scenario_version` (`30-scenario-format.md` §30.8).
      additionalProperties: false
      required: [rule_number, severity, location, message]
      properties:
        rule_number:
          type: integer
          minimum: 1
          maximum: 40
          description: |
            The §30.8 rule number that failed. (changed, I3 E1) The bound is the highest rule
            number that exists or is reserved: R40 (`70-i3-alignment.md` §70.2.3; R32–R36 and R40
            exist from E1, R37–R39 are reserved for E2/E4).
        severity:
          type: string
          enum: [ERROR, WARNING]
        location:
          type: string
          description: 'Dotted path into the document, e.g. `caller_knowledge.facts.incident.fire_source`.'
        message: { type: string }
        fact_id: { type: [string, 'null'] }
        field_path: { type: [string, 'null'] }

    ScenarioValidationReport:
      type: object
      additionalProperties: false
      required: [valid, scenario_slug, version, schema_version, content_sha256, issues, checked_rule_count]
      properties:
        valid:
          type: boolean
          description: '`false` if any issue has `severity: ERROR`. A scenario that is not valid cannot start a session (D4).'
        scenario_slug: { type: [string, 'null'] }
        version: { type: [integer, 'null'], minimum: 1 }
        schema_version: { type: [integer, 'null'], minimum: 1 }
        content_sha256: { type: [string, 'null'] }
        issues:
          type: array
          items: { $ref: '#/components/schemas/ScenarioValidationIssue' }
        checked_rule_count:
          type: integer
          minimum: 1
          description: |
            The complete §30.8 list is always run; a partial run is never reported as valid.
            (changed, I3 E1) The number of rules the run executed, derived from the validation
            rule registry — no longer a const: I3 epics register further rules (E1: R32–R36, R40;
            later R37–R39).

    # ---------------------------------------------------------- sessions ----
    ParticipantAssignment:
      type: object
      description: One `session_participants` row — a user bound to a simulation role.
      additionalProperties: false
      required: [user_id, assigned_role_type]
      properties:
        user_id: { type: string, format: uuid }
        assigned_role_type:
          description: |
            `null` is permitted only where `SessionPolicy.assignment_rule` is
            `ALL_STAGES_ONE_PARTICIPANT` (one trainee plays every stage).
          oneOf:
            - $ref: '#/components/schemas/RoleType'
            - type: 'null'
        assigned_service_id:
          description: |
            (additive, I3 E5b) ДДС participant → service binding (70 §70.4.5): the leg of this
            service is theirs; a notified service no participant is bound to is played by the
            scenario's scripted responder. Distinct per session and only for a participant who
            plays the DDS stage (else `validate` refuses: `409 INVALID_TRANSITION`); an id outside
            the pack's service catalog ⇒ `422 SERVICE_UNKNOWN`. Several ДДС participants in
            `MULTI_TRAINEE` must each be bound. `null`/absent = not bound.
          type: [string, 'null']

    SessionCreateRequest:
      type: object
      additionalProperties: false
      required: [scenario_version_id, session_mode, participants]
      properties:
        scenario_version_id: { type: string, format: uuid }
        session_mode: { $ref: '#/components/schemas/SessionMode' }
        participants:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ParticipantAssignment' }
        session_seed:
          type: [string, 'null']
          description: |
            Overrides `ScenarioVersion.deterministic_seed`. Recorded in the `SESSION_CREATED`
            payload, so an identical seed with identical timestamped actions reproduces an
            identical world-event stream (D7, SPEC §42 test 7).
        time_scale:
          type: number
          minimum: 0.1
          maximum: 10
          default: 1
          description: |
            Multiplier applied to simulated time only. It scales world-event scheduling and ETA
            countdowns; it never scales the audio path, which is realtime by nature.
        variants: { $ref: '#/components/schemas/VariantsRequest' }
        timers:
          description: (additive, I4 E31) Override of the scenario timers, recorded in `SESSION_CREATED.timers`.
          oneOf:
            - $ref: '#/components/schemas/CardTimersRequest'
            - type: 'null'
        pass_criteria:
          description: (additive, I5 E38, Q-E9b-3) «Сдал / не сдал», recorded in `SESSION_CREATED.pass_criteria`; absent = the defaults (70 %, no failed-rule limit, a critical error fails).
          oneOf:
            - $ref: '#/components/schemas/PassCriteriaRequest'
            - type: 'null'

    SessionParticipantView:
      type: object
      additionalProperties: false
      required: [user_id, username, display_name_ru, assigned_role_type, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name_ru: { type: string }
        assigned_role_type:
          oneOf:
            - $ref: '#/components/schemas/RoleType'
            - type: 'null'
        joined_at: { type: string, format: date-time }

    RoleStageView:
      type: object
      additionalProperties: false
      required: [role_stage_id, role_type, order_index, state, participant_user_id, started_at_offset_ms, completed_at_offset_ms]
      properties:
        role_stage_id: { type: string, format: uuid }
        role_type: { $ref: '#/components/schemas/RoleType' }
        order_index: { type: integer, minimum: 0 }
        state: { $ref: '#/components/schemas/StageState' }
        participant_user_id: { type: [string, 'null'], format: uuid }
        started_at_offset_ms: { type: [integer, 'null'] }
        completed_at_offset_ms: { type: [integer, 'null'] }

    SessionListItem:
      type: object
      additionalProperties: false
      required: [id, scenario_slug, scenario_version, session_mode, state, created_at, created_by_user_id, my_role_type]
      properties:
        id: { type: string, format: uuid }
        scenario_slug: { type: string }
        scenario_version: { type: integer, minimum: 1 }
        session_mode: { $ref: '#/components/schemas/SessionMode' }
        state: { $ref: '#/components/schemas/SessionState' }
        created_at: { type: string, format: date-time }
        created_by_user_id: { type: string, format: uuid }
        my_role_type:
          description: The caller's role in this session, or `null` when they only observe it.
          oneOf:
            - $ref: '#/components/schemas/RoleType'
            - type: 'null'
        lesson_id:
          description: |
            (additive, I6 NAV2) The lesson this session is a card of — same `SessionDetail.lesson_id`
            — or `null` for a single session.
          oneOf:
            - { type: string, format: uuid }
            - type: 'null'
        started_at:
          description: |
            (additive, I6 NAV2) Same `SessionDetail.started_at`; `null` before the session starts.
          oneOf:
            - { type: string, format: date-time }
            - type: 'null'

    SessionDetail:
      type: object
      description: |
        The materialized session header every command returns (D8). `session_seed` is included
        because it is public reproduction data, not hidden incident truth.
      additionalProperties: false
      required:
        - id
        - scenario_version_id
        - scenario_slug
        - scenario_version
        - session_mode
        - state
        - session_seed
        - time_scale
        - incident_id
        - role_chain
        - stages
        - active_role_stage_id
        - participants
        - created_by_user_id
        - created_at
        - started_at
        - completed_at
        - abort_reason
        - monotonic_offset_ms
        - last_seq_no
        - transition_pause_seconds
        - transition_continue_available_at_offset_ms
        - variants
        - scenario_role_chain
        - lesson_id
        - lesson_position
      properties:
        id: { type: string, format: uuid }
        scenario_version_id: { type: string, format: uuid }
        scenario_slug: { type: string }
        scenario_version: { type: integer, minimum: 1 }
        session_mode: { $ref: '#/components/schemas/SessionMode' }
        state: { $ref: '#/components/schemas/SessionState' }
        session_seed: { type: string }
        time_scale: { type: number }
        incident_id: { type: string, format: uuid }
        role_chain:
          type: array
          items: { $ref: '#/components/schemas/RoleType' }
        stages:
          type: array
          items: { $ref: '#/components/schemas/RoleStageView' }
        active_role_stage_id: { type: [string, 'null'], format: uuid }
        participants:
          type: array
          items: { $ref: '#/components/schemas/SessionParticipantView' }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        abort_reason: { type: [string, 'null'] }
        monotonic_offset_ms:
          type: integer
          minimum: 0
          description: |
            Current simulation time: ms since `SESSION_STARTED`, derived from the persisted
            `started_at` plus paused intervals, so a restart or a refresh never resets it (D7).
        last_seq_no:
          type: integer
          minimum: 0
          description: The highest `seq_no` visible to the caller's role — the WebSocket resume cursor.
        transition_pause_seconds:
          type: integer
          minimum: 0
          description: '`SessionPolicy.transition_pause_seconds` for this mode (§10.10).'
        transition_continue_available_at_offset_ms:
          type: [integer, 'null']
          description: |
            When `state` is `ROLE_TRANSITION`, the offset at which `continueToNextStage` stops
            being refused. `null` otherwise.
        variants: { $ref: '#/components/schemas/SessionVariants' }
        scenario_role_chain:
          description: |
            (additive, I3 E1) The scenario's `role_chain`; `role_chain` above is the session's
            effective chain (the suffix starting at DDS under `card_source: GENERATED_CARD`).
          type: array
          items: { $ref: '#/components/schemas/RoleType' }
        lesson_id:
          description: (additive, I3 E4a) The lesson this session is a card of; `null` for a single session (70 §70.3.2).
          type: [string, 'null']
          format: uuid
        lesson_position:
          description: (additive, I3 E4a) The card's plan position; set exactly when `lesson_id` is.
          type: [integer, 'null']
          minimum: 1

    AbortSessionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    CallStateView:
      type: object
      description: |
        The phone widget's state (D12). `call_id` and `room_name` are what the LiveKit client
        needs; nothing about the caller's hidden knowledge appears here.
      additionalProperties: false
      required: [call_id, room_name, phase, caller_display_ru, started_at_offset_ms, answered_at_offset_ms, ended_at_offset_ms, duration_ms, caller_speaking]
      properties:
        call_id: { type: [string, 'null'], format: uuid }
        room_name: { type: [string, 'null'] }
        phase:
          type: string
          enum: [NO_CALL, RINGING, CONNECTED, ENDED]
        caller_display_ru: { type: [string, 'null'] }
        started_at_offset_ms: { type: [integer, 'null'] }
        answered_at_offset_ms: { type: [integer, 'null'] }
        ended_at_offset_ms: { type: [integer, 'null'] }
        duration_ms: { type: [integer, 'null'] }
        caller_speaking:
          type: boolean
          description: True while caller TTS is playing; drives the level meter and barge-in affordance.

    SessionSnapshot:
      type: object
      description: |
        The browser-refresh restore payload (SPEC §39, §42 test 13). Exactly one of `card` and
        `work_item` is non-null, decided by the active stage's `RoleModule` — a DDS trainee can
        never receive the live `OperatorCard` (D3).
      additionalProperties: false
      required:
        - session
        - my_role_type
        - active_role_stage_id
        - active_role_type
        - stage_state
        - available_actions
        - card
        - work_item
        - call_state
        - last_seq_no
        - visible_sources
        - server_time_utc
      properties:
        session: { $ref: '#/components/schemas/SessionDetail' }
        my_role_type:
          oneOf:
            - $ref: '#/components/schemas/RoleType'
            - type: 'null'
        active_role_stage_id: { type: [string, 'null'], format: uuid }
        active_role_type:
          oneOf:
            - $ref: '#/components/schemas/RoleType'
            - type: 'null'
        stage_state:
          oneOf:
            - $ref: '#/components/schemas/StageState'
            - type: 'null'
        available_actions:
          type: array
          description: '`RoleModule.available_actions(stage_state)` filtered by the caller''s participant assignment.'
          items: { $ref: '#/components/schemas/ActionDescriptor' }
        card:
          description: Present for `OPERATOR_112` and `INSTRUCTOR` only.
          oneOf:
            - $ref: '#/components/schemas/OperatorCardView'
            - type: 'null'
        work_item:
          description: Present for `DDS` only, and built solely from the `HandoffSnapshot`.
          oneOf:
            - $ref: '#/components/schemas/DdsWorkItem'
            - type: 'null'
        call_state: { $ref: '#/components/schemas/CallStateView' }
        last_seq_no:
          type: integer
          minimum: 0
          description: Pass this as `after_seq_no` in the WebSocket `resume` frame.
        visible_sources:
          type: array
          description: '`DataVisibilityPolicy.sources` for the caller''s role — the UI renders only these panels.'
          items:
            type: string
            enum:
              - OPERATOR_CARD
              - CARD_REVISIONS
              - HANDOFF_SNAPSHOT
              - DDS_ASSIGNMENT
              - RESOURCE_BOARD
              - NOTIFICATIONS
              - RADIO_MESSAGES
              - TRANSCRIPT
              - CALL_STATE
              - SCORE_REPORT
              - WORLD_TRUTH
              - CALLER_BELIEF
              - GATE_INTERNALS
        server_time_utc: { type: string, format: date-time }

    SessionEventEnvelope:
      type: object
      description: |
        The envelope pushed over the WebSocket and returned by `listSessionEvents` — identical
        in both (D8, `docs/hld/40-realtime-protocol.md` §2). `payload` follows the
        `EVENT_PAYLOAD_CATALOG` entry for `event_type`, after the per-role redaction of §4.
      additionalProperties: false
      required: [seq_no, event_type, timestamp_utc, monotonic_offset_ms, payload]
      properties:
        seq_no: { type: integer, minimum: 1 }
        event_type: { $ref: '#/components/schemas/EventType' }
        timestamp_utc: { type: string, format: date-time }
        monotonic_offset_ms: { type: integer }
        payload:
          type: object
          additionalProperties: true
        actor_type: { $ref: '#/components/schemas/ActorType' }
        correlation_id: { type: [string, 'null'], format: uuid }
        redacted_keys:
          type: array
          description: |
            Payload keys removed for this role by the redaction table. Present so the UI can
            show "hidden" rather than silently imply absence; always empty for `INSTRUCTOR`.
          items: { type: string }

    SessionEventPage:
      type: object
      additionalProperties: false
      required: [items, last_seq_no, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SessionEventEnvelope' }
        last_seq_no: { type: integer, minimum: 0 }
        has_more: { type: boolean }

    VoiceTokenResponse:
      type: object
      additionalProperties: false
      required: [token, livekit_url, room_name, participant_identity, expires_at]
      properties:
        token: { type: string, description: LiveKit JWT minted by the backend (D9). }
        livekit_url: { type: string, format: uri }
        room_name: { type: string }
        participant_identity: { type: string }
        expires_at: { type: string, format: date-time }

    # ------------------------------------------- dds calls (I3 E6b) ----
    VoiceTokenRequest:
      description: (additive, I3 E6b) `createVoiceToken`'s optional body.
      type: object
      additionalProperties: false
      properties:
        call_id:
          type: [string, 'null']
          format: uuid
          description: A non-`ENDED` `DdsCall` of the caller; absent ⇒ the session's 112 call (unchanged behaviour).
    StartDdsCallRequest:
      description: (additive, I3 E6b)
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/DdsCallKind' }
        assignment_id:
          type: [string, 'null']
          format: uuid
          description: Required for `SERVICE_HEAD` (the leg), absent / null otherwise (422).
    SipDialRequest:
      description: (additive, I3 E6e) What a registered softphone dialled (80 §80.2.3 step 2).
      type: object
      additionalProperties: false
      required: [sip_user, dialed, sip_call_id]
      properties:
        sip_user: { type: string, minLength: 1, maxLength: 128, description: 'The registered username (= `users.username`).' }
        dialed: { type: string, minLength: 1, maxLength: 32, pattern: '^[0-9*#+]+$' }
        sip_call_id: { type: string, minLength: 1, maxLength: 256, description: 'The SIP `Call-ID`, for correlation in logs only.' }
    SipDialResponse:
      description: (additive, I3 E6e) The call the gateway bridges the softphone into.
      type: object
      additionalProperties: false
      required: [call_id, session_id, room_name, kind, persona_id]
      properties:
        call_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        room_name: { type: string }
        kind: { $ref: '#/components/schemas/DdsCallKind' }
        persona_id: { type: [string, 'null'] }
    SipLegReport:
      description: (additive, I3 E6e) The gateway's softphone leg of a `SIP`-endpoint call.
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [UP, FAILED, DOWN] }
        sip_status: { type: [integer, 'null'], minimum: 100, maximum: 699, description: 'The final SIP response of a FAILED click-to-call (e.g. 486, 408).' }
    SipCredentialView:
      description: (additive, I3 E6e) A per-user SIP Digest HA1 (migration 0015). A credential digest — never logged.
      type: object
      additionalProperties: false
      required: [username, realm, ha1]
      properties:
        username: { type: string }
        realm: { type: string }
        ha1: { type: string, pattern: '^[0-9a-f]{32}$', description: 'MD5(username:realm:password); never logged.' }
    StartDdsCallResponse:
      description: (additive, I3 E6b)
      type: object
      additionalProperties: false
      required: [call, voice]
      properties:
        call: { $ref: '#/components/schemas/DdsCallView' }
        voice:
          description: Room-scoped LiveKit token for the browser endpoint; `null` for `SIP` or an `ENDED` call.
          oneOf:
            - $ref: '#/components/schemas/VoiceTokenResponse'
            - type: 'null'
    DdsCallView:
      description: (additive, I3 E6b) One row of the `dds_calls` read model (migration 0014), plus the caller's legal actions.
      type: object
      additionalProperties: false
      required: [call_id, session_id, kind, direction, assignment_id, service_type, dialed, endpoint, room_name, persona_id, persona_title_ru, actor_user_id, state, answered_by, started_at_offset_ms, answered_at_offset_ms, ended_at_offset_ms, end_reason, available_actions]
      properties:
        call_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DdsCallKind' }
        direction: { $ref: '#/components/schemas/DdsCallDirection' }
        assignment_id: { type: [string, 'null'], format: uuid }
        service_type: { type: [string, 'null'], description: '`ServiceId` of the leg (SERVICE_HEAD only).' }
        dialed: { type: string, examples: ['101', '7012', '112', '9161234567'] }
        endpoint: { $ref: '#/components/schemas/CallEndpoint' }
        room_name: { type: string }
        persona_id: { type: [string, 'null'], examples: [BRIGADE_101, OPERATOR_112] }
        persona_title_ru: { type: [string, 'null'], examples: [Начальник караула ПСЧ, Заявитель] }
        actor_user_id: { type: [string, 'null'], format: uuid }
        state: { $ref: '#/components/schemas/DdsCallState' }
        answered_by:
          oneOf:
            - $ref: '#/components/schemas/CallAnsweredBy'
            - type: 'null'
        started_at_offset_ms: { type: integer }
        answered_at_offset_ms: { type: [integer, 'null'] }
        ended_at_offset_ms: { type: [integer, 'null'] }
        end_reason:
          oneOf:
            - $ref: '#/components/schemas/DdsCallEndReason'
            - type: 'null'
        available_actions:
          type: array
          description: '`hang_up` «Положить трубку» while live (the line owner only); `answer` «Ответить» on a ringing INBOUND call (E6c).'
          items: { $ref: '#/components/schemas/ActionDescriptor' }

    # ------------------------------------------------------ operator card ----
    OperatorCardView:
      type: object
      description: '`OperatorCard` (SPEC §9). `values` is keyed by the dotted `field_path`s of `CARD_FIELDS`.'
      additionalProperties: false
      required: [card_id, incident_id, values, revision_counter, field_specs]
      properties:
        card_id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        values:
          type: object
          description: 'Only the paths the trainee has set; an unset field is absent, not `null`-filled.'
          additionalProperties: { $ref: '#/components/schemas/FactValue' }
        revision_counter: { type: integer, minimum: 0 }
        field_specs:
          type: array
          description: 'The session''s card schema (`CARD_FIELDS` for `v1`) — the UI renders the form from this, never from a hard-coded list.'
          items: { $ref: '#/components/schemas/CardFieldSpec' }
        card_schema:
          type: string
          examples: [v1, v2]
          description: Additive, I3 E3a (70 §70.5.4) — the id of the card schema `field_specs` come from.

    CardFieldSpec:
      type: object
      additionalProperties: false
      required: [field_path, value_type, enum_name, label_ru, scoring_relevant, required_for_handoff]
      properties:
        field_path: { type: string, examples: ['address.house'] }
        value_type: { $ref: '#/components/schemas/ValueType' }
        enum_name:
          type: [string, 'null']
          description: 'The enum backing a `ValueType.ENUM` field, e.g. `IncidentType`.'
        label_ru: { type: string, examples: [Дом] }
        scoring_relevant: { type: boolean }
        required_for_handoff:
          type: boolean
          description: Advisory only — a missing field never blocks a handoff (SPEC §10).
        # -- additive, I3 E3a (70 §70.5.2, delta `CardFieldSpec`). Always sent; for a v1 schema
        # they carry their neutral values (group null, order = position, control by value type,
        # options/visible_when null, required_in_block/routing_relevant false). Not listed in
        # `required` so that clients built before E3b keep compiling.
        group: { type: [string, 'null'], examples: [header, applicant, address, incident, q_fire, services] }
        order: { type: integer, minimum: 0 }
        control: { $ref: '#/components/schemas/CardControl' }
        options:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/CardOption' }
        visible_when:
          description: When the field is shown; advisory — a hidden field is still accepted.
          oneOf:
            - $ref: '#/components/schemas/CardCondition'
            - type: 'null'
        required_in_block: { type: boolean }
        routing_relevant: { type: boolean }
        # --- I7 E55 ---
        max_length:
          type: [integer, 'null']
          minimum: 1
          description: |
            (additive, I7 E55) The longest `STRING` value the field takes — the card's «0 / 1999»
            counter on «Описание со слов заявителя»; `null` = unbounded. A longer value ⇒
            `422 CARD_VALUE_TYPE_MISMATCH`.

    CardControl:
      type: string
      description: Additive, I3 E3a (70 §70.5.2) — how the UI renders a card field.
      enum: [TEXT, TEXTAREA, NUMBER, SELECT, TOGGLE_SET, CHIPS, CHECKBOX, PHONE]

    CardOption:
      type: object
      description: |
        Additive, I3 E3a (70 §70.5.2). `code` is a classifier identifier (D18 applied, B1 §4): a
        questionnaire chip's признак text, a routing flag key, a «Что случилось» entry's classifier
        `group_no`, or a catalog okrug / district. `classifier_features` lists the признаки a chip
        stands for when it stands for several (default `[code]`); `routing: none` marks an option
        bound to nothing in the classifier (A-3).
      additionalProperties: false
      required: [code, label_ru]
      properties:
        code: { type: string }
        label_ru: { type: string }
        classifier_features:
          type: [array, 'null']
          items: { type: string }
        routing: { type: [string, 'null'], enum: [none, null] }

    CardCondition:
      description: Additive, I3 E3a — a condition over the card's own values (not the world `Condition`, HLD 30 §30.6.1).
      oneOf:
        - type: object
          additionalProperties: false
          required: [all]
          properties:
            all: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CardCondition' } }
        - type: object
          additionalProperties: false
          required: [any]
          properties:
            any: { type: array, minItems: 1, items: { $ref: '#/components/schemas/CardCondition' } }
        - type: object
          additionalProperties: false
          required: [not]
          properties:
            not: { $ref: '#/components/schemas/CardCondition' }
        - type: object
          additionalProperties: false
          required: [field_path, op]
          properties:
            field_path: { type: string }
            op: { type: string, enum: [EQ, NE, IN, CONTAINS, PRESENT] }
            value: { $ref: '#/components/schemas/FactValue' }

    CardSchemaView:
      type: object
      description: Additive, I3 E3a — `getCardSchema`.
      additionalProperties: false
      required: [schema_id, sha256, field_specs]
      properties:
        schema_id: { type: string }
        sha256: { type: string }
        field_specs:
          type: array
          items: { $ref: '#/components/schemas/CardFieldSpec' }

    CardRevisionView:
      type: object
      description: One `incident_card_revisions` row — SPEC §9's previous value, new value, path, time and actor.
      additionalProperties: false
      required: [revision_id, card_id, revision_no, field_path, previous_value, new_value, actor, at_offset_ms]
      properties:
        revision_id: { type: string, format: uuid }
        card_id: { type: string, format: uuid }
        revision_no: { type: integer, minimum: 1 }
        field_path: { type: string }
        previous_value: { $ref: '#/components/schemas/FactValue' }
        new_value: { $ref: '#/components/schemas/FactValue' }
        actor: { $ref: '#/components/schemas/ActorRef' }
        at_offset_ms: { type: integer }

    CardRevisionPage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CardRevisionView' }
        total: { type: integer, minimum: 0 }

    SetCardFieldRequest:
      type: object
      additionalProperties: false
      required: [field_path, new_value]
      properties:
        field_path:
          type: string
          description: 'Must be a `CARD_FIELDS` member other than `recipients.services`.'
          examples: ['address.house']
        new_value: { $ref: '#/components/schemas/FactValue' }
        client_command_id:
          type: [string, 'null']
          format: uuid
          description: Optional idempotency key; a repeat with the same id returns the first result.

    SetCardFieldResponse:
      type: object
      additionalProperties: false
      required: [card, revision]
      properties:
        card: { $ref: '#/components/schemas/OperatorCardView' }
        revision:
          description: '`null` when the command was a no-op (the value was already set).'
          oneOf:
            - $ref: '#/components/schemas/CardRevisionView'
            - type: 'null'

    ServiceSelectionRequest:
      type: object
      additionalProperties: false
      required: [service_type]
      properties:
        service_type: { $ref: '#/components/schemas/ServiceType' }

    ServiceSelectionView:
      type: object
      description: |
        (Additive, I3 E2b′, 70 §70.6.4) `selected_services` keeps meaning `recipients.services`
        (the manual additions); the resolver's answer comes from the log's last
        `RECIPIENTS_RESOLVED`, and `notification_list` is what `createHandoff` freezes.
      additionalProperties: false
      required: [card_id, selected_services, available_services, card, auto_services, informed_services, notification_list, classifier_code, candidate_codes, removal_allowed]
      properties:
        card_id: { type: string, format: uuid }
        selected_services:
          type: array
          description: The new value of the card field `recipients.services`.
          items: { $ref: '#/components/schemas/ServiceType' }
        available_services:
          type: array
          description: |
            Every service the UI offers, including plausibly wrong ones: the six legacy catalog
            ids for a `v1` card; the catalog's displayed, non-deprecated entries under `v2`
            (hidden and deprecated entries excluded, C8).
          items: { $ref: '#/components/schemas/ServiceType' }
        card: { $ref: '#/components/schemas/OperatorCardView' }
        auto_services:
          type: array
          description: The resolver's automatic services (last `RECIPIENTS_RESOLVED`).
          items: { $ref: '#/components/schemas/ServiceType' }
        informed_services:
          type: array
          description: '`display: false` organisations the resolver informs — never legs (REQ-5280).'
          items: { $ref: '#/components/schemas/ServiceType' }
        notification_list:
          type: array
          description: auto ∪ manual — what `createHandoff` freezes into `recipient_services`.
          items: { $ref: '#/components/schemas/ServiceType' }
        classifier_code: { type: [string, 'null'] }
        candidate_codes:
          type: array
          items: { type: string }
        removal_allowed:
          type: boolean
          description: '`false` for every service under a `v2` card (C10).'

    EndCallRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [OPERATOR_HANGUP, CALLER_HANGUP, TRANSPORT_LOST]

    OperatorStageView:
      type: object
      description: The materialized view every Operator 112 command returns (D8).
      additionalProperties: false
      required: [role_stage_id, stage_state, available_actions, card, call_state, session_state, last_seq_no]
      properties:
        role_stage_id: { type: string, format: uuid }
        stage_state: { $ref: '#/components/schemas/Operator112StageState' }
        available_actions:
          type: array
          items: { $ref: '#/components/schemas/ActionDescriptor' }
        card: { $ref: '#/components/schemas/OperatorCardView' }
        call_state: { $ref: '#/components/schemas/CallStateView' }
        session_state: { $ref: '#/components/schemas/SessionState' }
        last_seq_no: { type: integer, minimum: 0 }

    # ------------------------------------------------------------ handoff ----
    CreateHandoffRequest:
      type: object
      additionalProperties: false
      properties:
        comment_ru:
          type: [string, 'null']
          maxLength: 2000
          description: |
            Written to the card field `recipients.comment` before freezing, so it is part of the
            snapshot rather than a side channel around it.

    HandoffSnapshotView:
      type: object
      description: |
        `HandoffSnapshot` — immutable; the DB trigger rejects UPDATE and DELETE (D3). `card_values`
        is a deep copy of the trainee's entries at freeze time and shares nothing with the card.
      additionalProperties: false
      required:
        - snapshot_id
        - incident_id
        - card_id
        - card_revision_id
        - card_values
        - recipient_services
        - created_by_user_id
        - created_at_offset_ms
        - content_sha256
      properties:
        snapshot_id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        card_id: { type: string, format: uuid }
        card_revision_id: { type: string, format: uuid }
        card_values:
          type: object
          additionalProperties: { $ref: '#/components/schemas/FactValue' }
        recipient_services:
          type: array
          items: { $ref: '#/components/schemas/ServiceType' }
        created_by_user_id: { type: string, format: uuid }
        created_at_offset_ms: { type: integer }
        content_sha256:
          type: string
          description: Canonical JSON of `card_values` + `recipient_services`.

    HandoffCreatedView:
      type: object
      additionalProperties: false
      required: [snapshot, assignment_ids, stage_state, session_state]
      properties:
        snapshot: { $ref: '#/components/schemas/HandoffSnapshotView' }
        assignment_ids:
          type: array
          description: One `DDSAssignment` per recipient service.
          items: { type: string, format: uuid }
        stage_state: { $ref: '#/components/schemas/Operator112StageState' }
        session_state: { $ref: '#/components/schemas/SessionState' }

    # ---------------------------------------------------------------- DDS ----
    DdsWorkItem:
      type: object
      x-source: HANDOFF_SNAPSHOT
      description: |
        The DDS incoming work item. **Every field is sourced from `handoff_snapshots` and
        `dds_assignments`; no field is sourced from `WorldTruth`, `CallerBelief` or the live
        `OperatorCard`** (SPEC §3, §10, D3, §42 test 3). If the operator entered house `72`
        where the world says `27`, `card_values["address.house"]` is `"72"`. A field the
        operator never filled is simply absent from `card_values`, and there is no endpoint
        through which DDS could repair it.

        The schema has two documented readings (E9). The **trainee** endpoints —
        `getDdsWorkItem`, `DdsStageView.work_item`, `SessionSnapshot.work_item` — answer with the
        stage-wide *work-item projection*: one work item owned by the DDS `RoleStage` and
        addressed to `recipient_services`, whose `assignment_id` / `service_type` are those of
        the first recipient service, whose `dispatched_at_offset_ms` is the earliest over the
        assignments, and whose `selected_resource_ids` / `dispatched_resource_ids` are the union
        over them. The **instructor and report** views —
        `InstructorSessionOverview.assignments`, `ScoreReport…dds_decisions` — answer with the
        per-service `dds_assignments` rows verbatim, each with its own resource lists and its own
        `dispatched_at_offset_ms` (`null` on a recipient service that received no unit). Same
        schema, two scopes; `recipient_services`, not `service_type`, is "who this went to".
      additionalProperties: false
      required:
        - assignment_id
        - incident_id
        - role_stage_id
        - snapshot_id
        - service_type
        - state
        - card_values
        - recipient_services
        - handoff_content_sha256
        - received_at_offset_ms
        - acknowledged_at_offset_ms
        - dispatched_at_offset_ms
        - closed_at_offset_ms
        - closure_reason
        - selected_resource_ids
        - dispatched_resource_ids
        - missing_field_paths
      properties:
        assignment_id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        role_stage_id: { type: string, format: uuid }
        snapshot_id: { type: string, format: uuid }
        service_type: { $ref: '#/components/schemas/ServiceType' }
        state: { $ref: '#/components/schemas/DDSStageState' }
        card_values:
          type: object
          description: |
            The frozen trainee entries, verbatim from the snapshot. (additive, I7 E55) For a ДДС
            trainee whose own legs are all the 03 service (`AMBULANCE`), `description.text` is its
            first 100 characters (card instruction: «в службу 03 передаются только первые 100
            символов»); every other reader gets it whole.
          additionalProperties: { $ref: '#/components/schemas/FactValue' }
        recipient_services:
          type: array
          items: { $ref: '#/components/schemas/ServiceType' }
        handoff_content_sha256: { type: string }
        received_at_offset_ms: { type: integer }
        acknowledged_at_offset_ms: { type: [integer, 'null'] }
        dispatched_at_offset_ms: { type: [integer, 'null'] }
        closed_at_offset_ms: { type: [integer, 'null'] }
        closure_reason:
          oneOf:
            - $ref: '#/components/schemas/ClosureReason'
            - type: 'null'
        selected_resource_ids:
          type: array
          items: { type: string, format: uuid }
        dispatched_resource_ids:
          type: array
          items: { type: string, format: uuid }
        missing_field_paths:
          type: array
          description: |
            `CARD_FIELDS` entries with `required_for_handoff: true` that the snapshot leaves
            empty. Computed from the snapshot and the field specs alone — it names the gap
            without filling it, because the omission must propagate (SPEC §10). (I3 E3a) The
            session's card schema's `required_for_handoff` fields for a `v2` card.
          items: { type: string }
        card_schema:
          type: string
          examples: [v1, v2]
          description: |
            Additive, I3 E3a (70 §70.5.4) — the card schema of the reference pack the session
            recorded (`SESSION_CREATED.reference_pack`), never read from the scenario (INV 3).
        field_specs:
          type: array
          description: |
            Additive, I3 E3a — the field specs of `card_schema`, so the ДДС renders `card_values`
            (and their option labels) from data. Always sent; not in `required` so clients built
            before E3c keep compiling.
          items: { $ref: '#/components/schemas/CardFieldSpec' }
        # --- I7 E55 ---
        dds_marks:
          description: |
            (additive, I7 E55) The ДДС screen's «ЧС» / «ЧП» marks, set by a ДДС participant with
            `setDdsCardMarks` (the last `DDS_CARD_MARKS_SET` wins; both `false` before the first).
            Read-only everywhere else (instructor overview, report); never scored.
          allOf:
            - $ref: '#/components/schemas/DdsCardMarks'

    # --- I7 E55 ---
    DdsCardMarks:
      description: (additive, I7 E55) The ДДС's «ЧС» / «ЧП» marks on the received card.
      type: object
      additionalProperties: false
      required: [chs, chp]
      properties:
        chs: { type: boolean, description: 'ЧС' }
        chp: { type: boolean, description: 'ЧП' }
    SetDdsCardMarksRequest:
      description: (additive, I7 E55) The pencil beside «ЧС» / «ЧП» — both marks, as they should now be.
      type: object
      additionalProperties: false
      required: [chs, chp]
      properties:
        chs: { type: boolean }
        chp: { type: boolean }

    EtaProfileView:
      type: object
      description: '`EtaProfile` — the only ETA input; `ScenarioDefinedEta` reads these verbatim (D7, SPEC §11).'
      additionalProperties: false
      required: [turnout_delay_seconds, travel_time_seconds, setup_seconds, on_scene_work_seconds, return_time_seconds]
      properties:
        turnout_delay_seconds: { type: integer, minimum: 0 }
        travel_time_seconds: { type: integer, minimum: 0 }
        setup_seconds: { type: integer, minimum: 0 }
        on_scene_work_seconds: { type: integer, minimum: 0 }
        return_time_seconds: { type: integer, minimum: 0 }

    EmergencyResourceView:
      type: object
      description: '`EmergencyResource` (SPEC §11), every listed item present.'
      additionalProperties: false
      required:
        - resource_id
        - service_type
        - resource_type
        - callsign
        - name_ru
        - capabilities
        - current_status
        - available_from_ms
        - available_until_ms
        - eta
        - home_station_ru
        - crew_size
        - selectable
      properties:
        resource_id: { type: string, format: uuid }
        service_type: { $ref: '#/components/schemas/ServiceType' }
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        callsign: { type: string, examples: ['АЦ-1'] }
        name_ru: { type: string }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/ResourceCapability' }
        current_status: { $ref: '#/components/schemas/ResourceStatus' }
        available_from_ms: { type: integer, minimum: 0 }
        available_until_ms: { type: [integer, 'null'] }
        eta: { $ref: '#/components/schemas/EtaProfileView' }
        home_station_ru: { type: string }
        crew_size: { type: integer, minimum: 0 }
        selectable:
          type: boolean
          description: |
            Whether `select` would currently succeed — derived from
            `RESOURCE_STATUS_TRANSITIONS` and the availability window, so the UI greys out
            rather than guessing. The backend still re-checks the guard.

    ResourceSelectionRequest:
      type: object
      additionalProperties: false
      required: [resource_id]
      properties:
        resource_id: { type: string, format: uuid }

    DispatchRequest:
      type: object
      additionalProperties: false
      properties:
        note_ru: { type: [string, 'null'], maxLength: 1000 }

    DispatchResultView:
      type: object
      additionalProperties: false
      required: [stage, dispatched_resource_ids, eta_seconds_by_resource, is_additional]
      properties:
        stage: { $ref: '#/components/schemas/DdsStageView' }
        dispatched_resource_ids:
          type: array
          items: { type: string, format: uuid }
        eta_seconds_by_resource:
          type: object
          description: '`resource_id` → total ETA seconds, as carried in the `RESOURCE_DISPATCHED` payload.'
          additionalProperties: { type: integer, minimum: 0 }
        is_additional:
          type: boolean
          description: True when this was `dispatch_additional` rather than the first `dispatch`.

    StatusUpdateRequest:
      type: object
      additionalProperties: false
      required: [update_kind, text_ru]
      properties:
        update_kind: { $ref: '#/components/schemas/StatusUpdateKind' }
        text_ru: { type: string, minLength: 1, maxLength: 2000 }

    StatusUpdateView:
      type: object
      additionalProperties: false
      required: [assignment_id, update_kind, text_ru, at_offset_ms, actor_user_id]
      properties:
        assignment_id: { type: string, format: uuid }
        update_kind: { $ref: '#/components/schemas/StatusUpdateKind' }
        text_ru: { type: string }
        at_offset_ms: { type: integer }
        actor_user_id: { type: string, format: uuid }

    NotificationView:
      type: object
      description: |
        Trainee-facing (DDS/operator console). INV 3: the notification's
        `source_world_event_id` — the hidden world event that produced it — is NOT part of this
        schema, exactly as the WS path redacts it (`docs/hld/40-realtime-protocol.md` §215-239).
      additionalProperties: false
      required: [notification_id, incident_id, audience_role, severity, title_ru, body_ru, created_at_offset_ms, acknowledged_at_offset_ms]
      properties:
        notification_id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        audience_role: { $ref: '#/components/schemas/RoleType' }
        severity: { $ref: '#/components/schemas/NotificationSeverity' }
        title_ru: { type: string }
        body_ru: { type: string }
        created_at_offset_ms: { type: integer }
        acknowledged_at_offset_ms: { type: [integer, 'null'] }

    RadioMessageView:
      type: object
      description: |
        Projected from `RADIO_MESSAGE_CREATED` events; there is no radio table
        (`docs/hld/20-db-schema.md` §20.1). `seq_no` is the log position it was read from.
        Trainee-facing. INV 3: no `source_world_event_id`, as on `NotificationView`.
      additionalProperties: false
      required: [radio_message_id, seq_no, incident_id, from_callsign, to_role, text_ru, resource_id, created_at_offset_ms]
      properties:
        radio_message_id: { type: string, format: uuid }
        seq_no: { type: integer, minimum: 1 }
        incident_id: { type: string, format: uuid }
        from_callsign: { type: string }
        to_role: { $ref: '#/components/schemas/RoleType' }
        text_ru: { type: string }
        resource_id: { type: [string, 'null'], format: uuid }
        created_at_offset_ms: { type: integer }

    CloseIncidentRequest:
      type: object
      additionalProperties: false
      required: [closure_reason]
      properties:
        closure_reason: { $ref: '#/components/schemas/ClosureReason' }
        comment_ru: { type: [string, 'null'], maxLength: 2000 }

    DdsStageView:
      type: object
      description: The materialized view every DDS command returns (D8). It embeds the work item, never WorldTruth.
      additionalProperties: false
      required: [role_stage_id, stage_state, available_actions, work_item, resources, unacknowledged_notification_count, session_state, last_seq_no]
      properties:
        role_stage_id: { type: string, format: uuid }
        stage_state: { $ref: '#/components/schemas/DDSStageState' }
        available_actions:
          type: array
          items: { $ref: '#/components/schemas/ActionDescriptor' }
        work_item: { $ref: '#/components/schemas/DdsWorkItem' }
        resources:
          type: array
          items: { $ref: '#/components/schemas/EmergencyResourceView' }
        unacknowledged_notification_count: { type: integer, minimum: 0 }
        session_state: { $ref: '#/components/schemas/SessionState' }
        last_seq_no: { type: integer, minimum: 0 }

    # --------------------------------------------------------- instructor ----
    WorldTruthView:
      type: object
      x-visibility: INSTRUCTOR
      description: '`WorldTruth`. Instructor console and report context only (D3, D11).'
      additionalProperties: false
      required: [incident_id, revision, facts, value_types]
      properties:
        incident_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 0 }
        facts:
          type: object
          additionalProperties: { $ref: '#/components/schemas/FactValue' }
        value_types:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ValueType' }
        label_ru:
          type: object
          description: >-
            ADDITIVE (E20-E R11): `fact_id -> FactDefinition.label_ru` for every key of `facts`,
            joined from the active `ScenarioVersion` (§10.4). Absent for a `fact_id` the join
            cannot resolve; never a fabricated label.
          additionalProperties: { type: string }

    CallerBeliefView:
      type: object
      x-visibility: INSTRUCTOR
      description: '`CallerBelief` — what the simulated caller believes, plus current emotion. Instructor only.'
      additionalProperties: false
      required: [incident_id, revision, facts, knowledge, certainty, emotion, stress_level, revealed_fact_ids]
      properties:
        incident_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 0 }
        facts:
          type: object
          additionalProperties: { $ref: '#/components/schemas/FactValue' }
        knowledge:
          type: object
          additionalProperties: { $ref: '#/components/schemas/KnowledgeState' }
        certainty:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 1 }
        emotion: { $ref: '#/components/schemas/EmotionLabel' }
        stress_level: { type: number, minimum: 0, maximum: 1 }
        revealed_fact_ids:
          type: array
          description: Written only by `FACTS_DELIVERED`, never by the gate (D10).
          items: { type: string }
        label_ru:
          type: object
          description: >-
            ADDITIVE (E20-E R11): the same `fact_id -> FactDefinition.label_ru` join
            `WorldTruthView.label_ru` carries, over this view's own `facts` keys.
          additionalProperties: { type: string }

    GateDecisionView:
      type: object
      x-visibility: INSTRUCTOR
      description: One `GateDecision` from `FACT_GATE_EVALUATED`. Gate internals are instructor-only (D3).
      additionalProperties: false
      required: [fact_id, outcome, reason]
      properties:
        fact_id: { type: string }
        outcome: { $ref: '#/components/schemas/GateOutcome' }
        reason: { $ref: '#/components/schemas/GateReason' }

    GateTurnView:
      type: object
      x-visibility: INSTRUCTOR
      additionalProperties: false
      required: [turn_index, at_offset_ms, decisions, allowed_fact_ids, spontaneous_attached, withheld_count]
      properties:
        turn_index: { type: integer, minimum: 0 }
        at_offset_ms: { type: integer }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/GateDecisionView' }
        allowed_fact_ids:
          type: array
          items: { type: string }
        spontaneous_attached:
          type: array
          items: { type: string }
        withheld_count: { type: integer, minimum: 0 }

    TruthVsCardDiffEntry:
      type: object
      x-visibility: INSTRUCTOR
      description: |
        One row of the ground-truth-vs-entered-card diff (SPEC §29). This is the one place
        `WorldTruth` is shown to a human (D11) — it is a review artefact, never an input to a
        running stage.
      additionalProperties: false
      required: [field_path, label_ru, world_fact_id, world_value, card_value, verdict]
      properties:
        field_path: { type: string }
        label_ru: { type: string }
        world_fact_id: { type: [string, 'null'] }
        world_value: { $ref: '#/components/schemas/FactValue' }
        card_value: { $ref: '#/components/schemas/FactValue' }
        verdict:
          type: string
          enum: [MATCH, MISMATCH, MISSING, NOT_COMPARABLE]

    InstructorSessionOverview:
      type: object
      x-visibility: INSTRUCTOR
      description: |
        The live instructor console payload. It is the union of the two trainee views plus the
        hidden layers; no trainee endpoint returns this schema or any part of it.
      additionalProperties: false
      required:
        - session
        - stages
        - world_truth
        - caller_belief
        - gate_turns
        - card
        - handoff
        - assignments
        - resources
        - call_state
        - last_seq_no
        - inference_health
      properties:
        session: { $ref: '#/components/schemas/SessionDetail' }
        stages:
          type: array
          items: { $ref: '#/components/schemas/RoleStageView' }
        world_truth: { $ref: '#/components/schemas/WorldTruthView' }
        caller_belief: { $ref: '#/components/schemas/CallerBeliefView' }
        gate_turns:
          type: array
          items: { $ref: '#/components/schemas/GateTurnView' }
        card:
          oneOf:
            - $ref: '#/components/schemas/OperatorCardView'
            - type: 'null'
        handoff:
          oneOf:
            - $ref: '#/components/schemas/HandoffSnapshotView'
            - type: 'null'
        assignments:
          type: array
          items: { $ref: '#/components/schemas/DdsWorkItem' }
        resources:
          type: array
          items: { $ref: '#/components/schemas/EmergencyResourceView' }
        call_state: { $ref: '#/components/schemas/CallStateView' }
        last_seq_no: { type: integer, minimum: 0 }
        inference_health: { $ref: '#/components/schemas/HealthReadyResponse' }

    ReportReleaseView:
      type: object
      additionalProperties: false
      required: [session_id, released, released_at, released_by_user_id]
      properties:
        session_id: { type: string, format: uuid }
        released: { type: boolean }
        released_at: { type: [string, 'null'], format: date-time }
        released_by_user_id: { type: [string, 'null'], format: uuid }

    # ------------------------------------------------------------ report ----
    ScoreEvidenceView:
      type: object
      description: |
        Exactly one of `event_id`, `card_revision_id`, `snapshot_id` is set. A rule that awards
        or deducts without evidence is a hard error, never a silent zero (D11, §42 test 11).
      additionalProperties: false
      required: [event_id, card_revision_id, snapshot_id, seq_no, note_ru]
      properties:
        event_id: { type: [string, 'null'], format: uuid }
        card_revision_id: { type: [string, 'null'], format: uuid }
        snapshot_id: { type: [string, 'null'], format: uuid }
        seq_no: { type: [integer, 'null'] }
        note_ru: { type: string }

    ScoreResultView:
      type: object
      additionalProperties: false
      required: [rule_id, name_ru, description_ru, evaluator_type, category, points_awarded, max_points, passed, critical_failure, evidence]
      properties:
        rule_id: { type: string }
        name_ru: { type: string }
        description_ru: { type: string }
        evaluator_type: { $ref: '#/components/schemas/EvaluatorType' }
        category: { $ref: '#/components/schemas/ScoringCategory' }
        points_awarded: { type: number, description: May be negative (a penalty). }
        max_points: { type: number }
        passed: { type: boolean }
        critical_failure: { type: boolean }
        evidence:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ScoreEvidenceView' }

    ScoreCategoryTotalView:
      type: object
      additionalProperties: false
      required: [category, points_awarded, max_points]
      properties:
        category: { $ref: '#/components/schemas/ScoringCategory' }
        points_awarded: { type: number }
        max_points: { type: number }

    ScoreReportView:
      type: object
      additionalProperties: false
      required: [scenario_version_id, session_id, total_points, total_max_points, by_category, critical_errors, results, computed_from_event_count, checksum]
      properties:
        scenario_version_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        total_points: { type: number }
        total_max_points: { type: number }
        by_category:
          type: array
          items: { $ref: '#/components/schemas/ScoreCategoryTotalView' }
        critical_errors:
          type: array
          items: { $ref: '#/components/schemas/ScoreResultView' }
        results:
          type: array
          items: { $ref: '#/components/schemas/ScoreResultView' }
        computed_from_event_count: { type: integer, minimum: 0 }
        checksum:
          type: string
          description: Canonical-JSON SHA-256 of the numeric results; what `rescoreSession` compares.

    TranscriptSegmentView:
      type: object
      description: |
        One `transcript_segments` row (SPEC §19 fields). `audio_segment_id` plus `start_ms` is
        what makes click-transcript-to-seek work (SPEC §29).
      additionalProperties: false
      required: [id, speaker, start_ms, end_ms, text, is_final, confidence, asr_provider, asr_model, audio_segment_id, turn_index]
      properties:
        id: { type: string, format: uuid }
        speaker:
          type: string
          enum: [OPERATOR, CALLER]
        start_ms: { type: integer }
        end_ms: { type: integer }
        text: { type: string }
        is_final: { type: boolean }
        confidence: { type: [number, 'null'] }
        asr_provider:
          type: [string, 'null']
          description: '`null` for caller rows, whose text is the delivered TTS text.'
        asr_model: { type: [string, 'null'] }
        audio_segment_id: { type: [string, 'null'], format: uuid }
        turn_index: { type: [integer, 'null'] }
        call_id:
          type: [string, 'null']
          format: uuid
          description: (additive, I3 E6c — 80 §80.6.1) The call the row was said on; the report groups by it.
        call_party_ru:
          type: [string, 'null']
          description: '(additive, I3 E6c) The party label of the call («Вызов 112: абонент», «Звонок ДДС: Начальник караула ПСЧ»).'

    AudioSegmentRef:
      type: object
      additionalProperties: false
      required: [audio_segment_id, speaker, start_ms, end_ms, sample_rate, purged]
      properties:
        audio_segment_id: { type: string, format: uuid }
        speaker:
          type: string
          enum: [OPERATOR, CALLER]
        start_ms:
          type: integer
          description: Session-relative, not file-relative (D9).
        end_ms: { type: integer }
        sample_rate: { type: integer }
        purged:
          type: boolean
          description: True when the retention purge nulled `file_path`; the transcript survives.

    TimelineEntryView:
      type: object
      description: One row of the complete event timeline (SPEC §29), projected from `session_events`.
      additionalProperties: false
      required: [seq_no, event_type, monotonic_offset_ms, timestamp_utc, actor_type, actor_id, summary_ru, payload]
      properties:
        seq_no: { type: integer, minimum: 1 }
        event_type: { $ref: '#/components/schemas/EventType' }
        monotonic_offset_ms: { type: integer }
        timestamp_utc: { type: string, format: date-time }
        actor_type: { $ref: '#/components/schemas/ActorType' }
        actor_id: { type: [string, 'null'], format: uuid }
        summary_ru: { type: string }
        payload:
          type: object
          additionalProperties: true
        call_id:
          type: [string, 'null']
          format: uuid
          description: (additive, I3 E6c — 80 §80.6.1) The payload's `call_id`, so turns group by call.
        call_party_ru:
          type: [string, 'null']
          description: (additive, I3 E6c) The call's party label, read from `DDS_CALL_STARTED.kind` and the persona.

    DdsDecisionView:
      type: object
      description: The DDS decisions section of SPEC §29 — what was acknowledged, dispatched, reported and closed.
      additionalProperties: false
      required: [assignment_id, service_type, acknowledged_at_offset_ms, dispatch_events, status_updates, closure_reason, closed_at_offset_ms, response_status, responder, bound_user_id, status_history, card_issues]
      properties:
        assignment_id: { type: string, format: uuid }
        service_type: { $ref: '#/components/schemas/ServiceType' }
        acknowledged_at_offset_ms: { type: [integer, 'null'] }
        dispatch_events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [at_offset_ms, resource_ids, callsigns, is_additional]
            properties:
              at_offset_ms: { type: integer }
              resource_ids:
                type: array
                items: { type: string, format: uuid }
              callsigns:
                type: array
                items: { type: string }
              is_additional: { type: boolean }
              note_ru:
                type: [string, 'null']
                description: >-
                  ADDITIVE (E20-E R11): the trainee's free-text dispatch note
                  (`RESOURCE_DISPATCHED.note_ru`, E17 R2). `null`/absent when none was given.
        status_updates:
          type: array
          items: { $ref: '#/components/schemas/StatusUpdateView' }
        closure_reason:
          oneOf:
            - $ref: '#/components/schemas/ClosureReason'
            - type: 'null'
        closed_at_offset_ms: { type: [integer, 'null'] }
        comment_ru:
          type: [string, 'null']
          description: >-
            ADDITIVE (E20-E R11): the trainee's free-text closure comment
            (`DDS_INCIDENT_CLOSED.comment_ru`, E17 R2). `null`/absent when none was given or the
            leg is not yet closed.
        response_status:
          description: (additive, I3 E5b) The leg's last memo status (picker legs — the mirrored one).
          allOf:
            - $ref: '#/components/schemas/ServiceResponseStatus'
        responder:
          description: (additive, I3 E5b) Who played the leg — a ДДС trainee or the scenario's script.
          type: string
          enum: [TRAINEE, SCRIPTED]
        bound_user_id:
          description: (additive, I3 E5b) The ДДС participant bound to the leg's service, if any.
          type: [string, 'null']
          format: uuid
        status_history:
          description: |
            (additive, I3 E5b) Every `DDS_SERVICE_STATUS_SET` of the leg in log order, the author
            before the time (REQ-5295) — the same entries the leg block shows.
          type: array
          items: { $ref: '#/components/schemas/ServiceStatusEntryView' }
        card_issues:
          description: '(additive, I3 E5b) The card issues flagged on this leg (`dds_card_check: ON`).'
          type: array
          items: { $ref: '#/components/schemas/CardIssueView' }
        # --- I7 E55 ---
        dds_marks:
          description: |
            (additive, I7 E55) The card's «ЧС» / «ЧП» marks at the end of the session — the same on
            every leg (they are the card's, not a leg's); shown read-only, never scored.
          oneOf:
            - $ref: '#/components/schemas/DdsCardMarks'
            - type: 'null'

    ResourceTimelineEntryView:
      type: object
      description: One `RESOURCE_STATUS_CHANGED` step — the resource timeline of SPEC §29.
      additionalProperties: false
      required: [resource_id, callsign, previous_status, new_status, trigger, at_offset_ms]
      properties:
        resource_id: { type: string, format: uuid }
        callsign: { type: string }
        previous_status:
          description: >-
            null for a unit's first recorded transition — never a fabricated status (SPEC §27).
          oneOf:
            - $ref: '#/components/schemas/ResourceStatus'
            - type: 'null'
        new_status: { $ref: '#/components/schemas/ResourceStatus' }
        trigger: { type: string }
        at_offset_ms: { type: integer }

    TimingMetricsView:
      type: object
      description: |
        The timing metrics section of SPEC §29. `speech_end_to_first_audio_ms` is the SPEC §27
        critical product metric, measured per turn — never hard-coded.
      additionalProperties: false
      required: [turn_count, speech_end_to_first_audio_ms_p50, speech_end_to_first_audio_ms_p95, asr_latency_ms_p50, llm_ttft_ms_p50, tts_first_audio_ms_p50, barge_in_cutoff_ms_p95, fallback_count]
      properties:
        turn_count: { type: integer, minimum: 0 }
        speech_end_to_first_audio_ms_p50: { type: [number, 'null'] }
        speech_end_to_first_audio_ms_p95: { type: [number, 'null'] }
        asr_latency_ms_p50: { type: [number, 'null'] }
        llm_ttft_ms_p50:
          type: [number, 'null']
          description: >-
            null by construction on the shipped configuration (E20-H, H3), not a bug: the
            interpreter and generator LLM calls are non-streaming
            (`app/application/dialogue/interpreter.py`, `generator.py`), so their
            `inference_metrics.ttft_ms` is written as `None` — there is no distinct "first token"
            instant to measure when the whole completion arrives at once — and `percentile()` over
            an empty sample is `null` (SPEC §27: never fake a value). A streaming LLM provider
            would make this non-null without any change to this aggregation
            (`app.application.reports.timing_metrics`).
        tts_first_audio_ms_p50: { type: [number, 'null'] }
        barge_in_cutoff_ms_p95: { type: [number, 'null'] }
        fallback_count: { type: integer, minimum: 0 }

    SessionReport:
      type: object
      description: |
        Every SPEC §29 item, in order: total score, score by category, critical errors, complete
        event timeline, transcript, audio playback references, click-to-seek offsets, final card,
        ground-truth-vs-card diff, handoff snapshot, DDS decisions, resource timeline, timing
        metrics, evidence per rule (carried inside each `ScoreResultView`).
      additionalProperties: false
      required:
        - session_id
        - session
        - score_report
        - timeline
        - transcript
        - audio_segments
        - final_card
        - truth_vs_card_diff
        - handoff
        - dds_decisions
        - resource_timeline
        - timing_metrics
        - explanation_available
        - released
        - dds_participant_totals
        - text_quality
        - pass_verdict
        - recommendations
      properties:
        session_id: { type: string, format: uuid }
        session: { $ref: '#/components/schemas/SessionDetail' }
        score_report: { $ref: '#/components/schemas/ScoreReportView' }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/TimelineEntryView' }
        transcript:
          type: array
          items: { $ref: '#/components/schemas/TranscriptSegmentView' }
        audio_segments:
          type: array
          description: 'Fetch each with `getAudioSegment`; `start_ms` is the seek target.'
          items: { $ref: '#/components/schemas/AudioSegmentRef' }
        final_card:
          description: >-
            For a viewer who may not see the card, the view with an empty `values` map (its public
            field catalog still included) rather than the key being omitted (E16 ruling).
          allOf:
            - $ref: '#/components/schemas/OperatorCardView'
        truth_vs_card_diff:
          type: array
          x-visibility: INSTRUCTOR
          description: |
            Included for `INSTRUCTOR`/`ADMIN` always, and for the trainee once the report is
            released. Empty array when the caller may not see it.
          items: { $ref: '#/components/schemas/TruthVsCardDiffEntry' }
        handoff:
          oneOf:
            - $ref: '#/components/schemas/HandoffSnapshotView'
            - type: 'null'
        dds_decisions:
          type: array
          items: { $ref: '#/components/schemas/DdsDecisionView' }
        resource_timeline:
          type: array
          items: { $ref: '#/components/schemas/ResourceTimelineEntryView' }
        timing_metrics: { $ref: '#/components/schemas/TimingMetricsView' }
        explanation_available: { type: boolean }
        released: { type: boolean }
        dds_participant_totals:
          description: |
            (additive, I3 E5b) Per ДДС participant of the session, in participant order. Empty
            when the viewer may not see the DDS sections.
          type: array
          items: { $ref: '#/components/schemas/DdsParticipantTotalsView' }
        text_quality:
          description: (additive, I4 E35, §71.12) «Грамотность и адреса» — report-only, no score effect (D35).
          allOf:
            - $ref: '#/components/schemas/TextQualityReportView'
        pass_verdict:
          description: (additive, I5 E38, Q-E9b-3) «Сдал / не сдал» under the session's recorded criteria — derived at report time, never stored, never part of the checksum.
          oneOf:
            - $ref: '#/components/schemas/PassVerdictView'
            - type: 'null'
        recommendations:
          description: >-
            (additive, I7 E54, G10, ТЗ ¶267/¶237) «Рекомендации по улучшению навыков» — one line
            per failed ScoringCategory this viewer's own visible rules cost, worst first, at most
            5. Empty when every visible rule passed (the UI then shows «Замечаний нет»). Never
            part of the checksum.
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/RecommendationView' }

    RecommendationView:
      type: object
      additionalProperties: false
      required: [category, text_ru]
      properties:
        category: { $ref: '#/components/schemas/ScoringCategory' }
        text_ru:
          type: string
          maxLength: 300
          description: >-
            The rule's own `advice` override (scenario schema-2, ≤300 chars, rule R45) when the
            failed rule that cost this category the most points set one, else the pinned default
            of `reference/advice/v1.yaml`.

    RescoreRequest:
      type: object
      additionalProperties: false
      properties:
        persist:
          type: boolean
          default: false
          description: |
            When `true`, the recomputed results replace `score_results` / `score_evidence`.
            The default is a non-destructive check.

    RescoreResult:
      type: object
      additionalProperties: false
      required: [session_id, identical_to_stored, recomputed, stored_checksum, recomputed_checksum, differences, persisted]
      properties:
        session_id: { type: string, format: uuid }
        identical_to_stored:
          type: boolean
          description: |
            The machine-checkable form of SPEC §28: the same event log and scenario version must
            always reproduce the same score. `false` is a defect, never an expected outcome.
        recomputed: { $ref: '#/components/schemas/ScoreReportView' }
        stored_checksum: { type: [string, 'null'] }
        recomputed_checksum: { type: string }
        differences:
          type: array
          description: Per-rule deltas when `identical_to_stored` is false; empty otherwise.
          items:
            type: object
            additionalProperties: false
            required: [rule_id, stored_points, recomputed_points]
            properties:
              rule_id: { type: string }
              stored_points: { type: [number, 'null'] }
              recomputed_points: { type: number }
        persisted: { type: boolean }

    GenerateExplanationRequest:
      type: object
      additionalProperties: false
      properties:
        regenerate:
          type: boolean
          default: false
          description: Replace an existing explanation instead of failing with `EXPLANATION_ALREADY_EXISTS`.
        audience:
          type: string
          enum: [TRAINEE, INSTRUCTOR]
          default: TRAINEE

    ReportExplanation:
      type: object
      description: |
        Prose generated from an already persisted `ScoreReport`. It may not alter numeric
        results (SPEC §2, §29): `score_report_checksum` is echoed so the client can verify that
        the numbers are the ones it already has.
      additionalProperties: false
      required: [session_id, audience, text_ru, generated_at, llm_provider, llm_model, score_report_checksum]
      properties:
        session_id: { type: string, format: uuid }
        audience:
          type: string
          enum: [TRAINEE, INSTRUCTOR]
        text_ru: { type: string }
        generated_at: { type: string, format: date-time }
        llm_provider: { type: string }
        llm_model: { type: string }
        score_report_checksum:
          type: string
          description: Equals `ScoreReportView.checksum` of the report it explains.

    InferenceMetricView:
      type: object
      description: One `inference_metrics` row — the SPEC §27 `InferenceMetric` fields.
      additionalProperties: false
      required:
        - id
        - session_id
        - request_id
        - component
        - provider
        - model
        - model_version
        - turn_index
        - input_tokens
        - input_duration_ms
        - output_tokens
        - output_audio_ms
        - started_at
        - first_output_at
        - finished_at
        - ttft_ms
        - total_latency_ms
        - tokens_per_second
        - realtime_factor
        - gpu_memory_mb
        - fallback_count
        - retry_count
      properties:
        id: { type: string, format: uuid }
        session_id: { type: [string, 'null'], format: uuid }
        request_id: { type: string }
        component:
          type: string
          enum: [ASR, LLM_INTERPRETER, LLM_GENERATOR, TTS, VAD]
        provider: { type: string }
        model: { type: string }
        model_version: { type: [string, 'null'] }
        turn_index: { type: [integer, 'null'] }
        input_tokens: { type: [integer, 'null'] }
        input_duration_ms: { type: [integer, 'null'] }
        output_tokens: { type: [integer, 'null'] }
        output_audio_ms: { type: [integer, 'null'] }
        started_at: { type: string, format: date-time }
        first_output_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        ttft_ms: { type: [integer, 'null'] }
        total_latency_ms: { type: [integer, 'null'] }
        tokens_per_second: { type: [number, 'null'] }
        realtime_factor: { type: [number, 'null'] }
        gpu_memory_mb: { type: [integer, 'null'] }
        fallback_count: { type: integer, minimum: 0 }
        retry_count: { type: integer, minimum: 0 }

    InferenceMetricsPage:
      type: object
      additionalProperties: false
      required: [items, total, timing_metrics]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InferenceMetricView' }
        total: { type: integer, minimum: 0 }
        timing_metrics: { $ref: '#/components/schemas/TimingMetricsView' }

    # ------------------------------------------------------------ health ----
    HealthLiveResponse:
      type: object
      additionalProperties: false
      required: [status, version, uptime_seconds]
      properties:
        status: { type: string, const: LIVE }
        version: { type: string }
        uptime_seconds: { type: integer, minimum: 0 }

    ComponentHealth:
      type: object
      additionalProperties: false
      required: [component, status, detail, checked_at]
      properties:
        component:
          type: string
          enum: [postgres, redis, livekit, llm, asr, tts, vad]
        status: { $ref: '#/components/schemas/HealthStatus' }
        detail:
          type: [string, 'null']
          description: |
            For an inference service, the `detail` of the `voice:health:{service}` key; a missing
            key reports `NOT_READY` with `"no heartbeat from voice-agent"`.
        checked_at: { type: string, format: date-time }
        provider: { type: [string, 'null'] }
        model_version: { type: [string, 'null'] }
        warmup_ms: { type: [integer, 'null'] }

    HealthReadyResponse:
      type: object
      description: |
        Readiness per SPEC §37 and D8. `overall` is `READY` only when every component in
        `required_components` is `READY`; `FATAL` anywhere makes `overall` `FATAL`, and a FATAL
        latched in `voice:health:fatal` is cleared only by `clearInferenceFatal`.
      additionalProperties: false
      required: [overall, components, required_components, require_inference_ready, model_profile]
      properties:
        overall: { $ref: '#/components/schemas/HealthStatus' }
        components:
          type: array
          items: { $ref: '#/components/schemas/ComponentHealth' }
        required_components:
          type: array
          description: The components `startSession` insists on while `require_inference_ready` is true.
          items: { type: string }
        require_inference_ready:
          type: boolean
          description: '`REQUIRE_INFERENCE_READY` (default true; tests set it false explicitly).'
        model_profile:
          type: string
          enum: [DEV_3060TI, DEV_3060TI_SHARED, FINAL_3080TI_12GB, FINAL_3080TI_16GB]

    # ------------------------------------------------------------- admin ----
    PurgeRecordingsRequest:
      type: object
      additionalProperties: false
      properties:
        dry_run:
          type: boolean
          default: true
          description: Report what would be purged and delete nothing.
        older_than_days:
          type: [integer, 'null']
          minimum: 0
          description: Overrides `RECORDING_RETENTION_DAYS` for this run.
        session_id:
          type: [string, 'null']
          format: uuid
          description: Restrict the purge to one session (`reason = MANUAL_REQUEST`).

    PurgeRecordingsResult:
      type: object
      additionalProperties: false
      required: [dry_run, retention_days, session_count, segment_count, bytes_freed, purged_at, reason]
      properties:
        dry_run: { type: boolean }
        retention_days: { type: integer, minimum: 0 }
        session_count: { type: integer, minimum: 0 }
        segment_count: { type: integer, minimum: 0 }
        bytes_freed: { type: integer, minimum: 0 }
        purged_at: { type: string, format: date-time }
        reason:
          type: string
          enum: [RETENTION_WINDOW, MANUAL_REQUEST, ADMIN_DELETE]

    # ----------------------------------------------------------- reference ----
    # Additive, I3 E2a (70 §70.6.1-§70.6.3, D18).
    ReferencePackRecord:
      description: What `SESSION_CREATED.reference_pack` records (ids and sha256 of the files used).
      type: object
      additionalProperties: false
      required: [pack_id, card_schema, card_schema_sha256, classifier, classifier_sha256, services, services_sha256]
      properties:
        pack_id: { type: string }
        card_schema: { type: string }
        card_schema_sha256: { type: string }
        classifier: { type: [string, 'null'] }
        classifier_sha256: { type: [string, 'null'] }
        services: { type: string }
        services_sha256: { type: string }
    ReferenceManifest:
      type: object
      additionalProperties: false
      required: [manifest_version, packs, files, sources]
      properties:
        manifest_version: { type: integer, const: 1 }
        packs:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [card_schema, services, classifier]
            properties:
              card_schema: { type: string }
              services: { type: string }
              classifier: { type: [string, 'null'] }
              personas:
                type: string
                description: (additive, I3 E6c — 80 §80.4.1) The ДДС phone's persona set; absent for a pack without one.
        files:
          type: object
          additionalProperties: { type: string, pattern: '^[0-9a-f]{64}$' }
        sources:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [path, sha256, tool]
            properties:
              path: { type: string }
              sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
              tool: { type: string }
    ServiceCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, name_ru, full_name_ru, kind, code, okrug, district, classifier_org_id, status_policy, display, deprecated]
      properties:
        id: { $ref: '#/components/schemas/ServiceType' }
        name_ru: { type: string }
        full_name_ru: { type: string }
        kind: { type: string, enum: [CITY, DISTRICT, PREFECTURE, DEPARTMENT] }
        code: { type: [string, 'null'], examples: ['101', '103'] }
        okrug: { type: [string, 'null'] }
        district: { type: [string, 'null'] }
        classifier_org_id: { type: [string, 'null'] }
        classifier_org_ids:
          type: array
          description: |
            Additive, I3 E3a (70 §70.6.3, B1 G4) — every classifier column group that answers
            for this service; `classifier_org_id` is its first member. `FIRE_RESCUE` is both
            `MCHS_SLUZHBA_101` and `MCHS_ODS_PSC`; a `display: false` entry is one classifier-only
            organisation (REQ-5280).
          items: { type: string }
        status_policy: { type: string, enum: [DEFAULT, NO_REFUSAL] }
        display: { type: boolean }
        deprecated: { type: boolean }
        phone: { type: [string, 'null'] }
    ClassifierRowSummary:
      type: object
      additionalProperties: false
      required: [code, group_no, group_ru, features, final_type_ru, main_service]
      properties:
        code: { type: string }
        group_no: { type: integer }
        group_ru: { type: string }
        features:
          type: array
          maxItems: 3
          items: { type: string }
        final_type_ru: { type: string }
        main_service: { type: [string, 'null'] }
    ClassifierRow:
      allOf:
        - $ref: '#/components/schemas/ClassifierRowSummary'
        - type: object
          required: [extra_features, ekp35_ru, routing]
          properties:
            extra_features:
              type: array
              items: { type: string }
            ekp35_ru: { type: [string, 'null'] }
            routing:
              description: Per organisation column, the sub-column cells; a cell counts as a notification iff non-empty and not «нет реагирования» (assumption A-1).
              type: object
              additionalProperties:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [when, value]
                  properties:
                    when:
                      type: object
                      additionalProperties: { type: boolean }
                    value: { type: [string, 'null'] }

    # ------------------------------------------------------------- lessons ----
    # Additive, I3 E4a (70 §70.3, §70.4.6), from `contracts/i3-openapi-delta.yaml`.
    LessonState:
      type: string
      enum: [CREATED, ACTIVE, COMPLETED, ABORTED]
    ArrivalKind:
      type: string
      enum: [AT_OFFSET, AFTER_PREVIOUS_112_STAGE, AFTER_PREVIOUS_SESSION]
    CardStatus:
      description: 'Card status of the memo p.27 (70 §70.4.6). Labels: Зарегистрирована, Отработана, Проверена, Не оповещено, Отказ, Не завершено, Завершена.'
      type: string
      enum: [REGISTERED, WORKED, CHECKED, NOT_NOTIFIED, REFUSED, NOT_COMPLETED, COMPLETED]
    ServiceResponseStatus:
      description: '(additive, I3 E5a) Per-leg status of the memo p.21–22 (70 §70.4.1). Labels: Добавлена, Получена службой, Принята, Не принята, Начало реагирования, Прибытие, Проведение работ, Работы завершены, Отказ от выполнения работ.'
      type: string
      enum: [ADDED, RECEIVED, ACCEPTED, NOT_ACCEPTED, RESPONSE_STARTED, ARRIVED, WORKING, COMPLETED, REFUSED]
    ServiceStatusEntryView:
      description: (additive, I3 E5a) One entry of a leg's status history (`dds_service_status_history`).
      type: object
      additionalProperties: false
      required: [event_id, previous_status, new_status, order_number, comment_ru, completion_reason, source, actor_user_id, actor_display_ru, at_offset_ms]
      properties:
        event_id: { type: string, format: uuid }
        previous_status: { $ref: '#/components/schemas/ServiceResponseStatus' }
        new_status: { $ref: '#/components/schemas/ServiceResponseStatus' }
        order_number: { type: [string, 'null'], description: '«Номер наряда», free text (assumption A-2).' }
        comment_ru: { type: [string, 'null'] }
        completion_reason: { type: [string, 'null'], enum: [WITHOUT_BRIGADE, null] }
        source: { type: string, enum: [TRAINEE, SCRIPTED_RESPONDER, PICKER_MIRROR, SYSTEM] }
        actor_user_id: { type: [string, 'null'], format: uuid }
        actor_display_ru: { type: string, description: 'Shown before the time (REQ-5295).' }
        at_offset_ms: { type: integer }
    DdsLegView:
      description: (additive, I3 E5a) One notified service's block — collapsed = last status + time; expanded = history (REQ-5294).
      type: object
      additionalProperties: false
      required: [assignment_id, service_type, service_name_ru, response_status, response_status_at_offset_ms, order_number, last_comment_ru, accept_missed, responder, bound_user_id, is_mine, history, available_actions]
      properties:
        assignment_id: { type: string, format: uuid }
        service_type: { $ref: '#/components/schemas/ServiceType' }
        service_name_ru: { type: string }
        response_status: { $ref: '#/components/schemas/ServiceResponseStatus' }
        response_status_at_offset_ms: { type: [integer, 'null'] }
        order_number: { type: [string, 'null'] }
        last_comment_ru: { type: [string, 'null'] }
        accept_missed: { type: boolean }
        responder: { type: string, enum: [TRAINEE, SCRIPTED] }
        bound_user_id: { type: [string, 'null'], format: uuid }
        is_mine:
          type: boolean
          description: The caller may set statuses on this leg (the pencil is shown).
        history:
          type: array
          items: { $ref: '#/components/schemas/ServiceStatusEntryView' }
        available_actions:
          type: array
          description: The legal next triggers of this leg for the caller (empty when `is_mine` is false).
          items: { $ref: '#/components/schemas/ActionDescriptor' }
        live_call_id:
          type: [string, 'null']
          format: uuid
          description: (additive, I3 E6c) The non-`ENDED` `SERVICE_HEAD` call on this leg, if any.
        phone_extension:
          type: [string, 'null']
          description: (additive, I3 E6e) The dial-plan number of this service — the catalog `code` (101…104) or `7` + 3 digits (80 §80.3.5); shown «тел. 7012». `null` for an undisplayed service.
    SetServiceStatusRequest:
      description: (additive, I3 E5a) The memo's pencil form.
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          description: The target status; `COMPLETED` under policy `NO_REFUSAL` from a non-`WORKING` status means `complete_without_brigade`.
          allOf:
            - $ref: '#/components/schemas/ServiceResponseStatus'
        order_number: { type: [string, 'null'], maxLength: 64 }
        comment_ru:
          type: [string, 'null']
          maxLength: 2000
          description: Mandatory (non-blank) for `NOT_ACCEPTED` and `REFUSED` — `422 COMMENT_REQUIRED`.
        proposed_by_call_id:
          type: [string, 'null']
          format: uuid
          description: (additive, I3 E6c) The call on which the status was heard; must name a `DDS_CALL_STATUS_PROPOSED` of this leg (`422 PROPOSAL_UNKNOWN`).
    PersonaView:
      description: (additive, I3 E6c — 80 §80.4.1) One AI persona of the ДДС phone.
      type: object
      additionalProperties: false
      required: [persona_id, applies, title_ru, gender, voice_id]
      properties:
        persona_id: { type: string, examples: [BRIGADE_101, DDS_DISTRICT, OPERATOR_112] }
        applies:
          type: object
          additionalProperties: false
          required: [code, kind]
          description: Most specific wins — `code` over `kind`.
          properties:
            code: { type: [string, 'null'], examples: ['101'] }
            kind: { type: [string, 'null'], enum: [CITY, DISTRICT, PREFECTURE, DEPARTMENT, OPERATOR_112, null] }
        title_ru: { type: string, examples: [Начальник караула ПСЧ] }
        gender: { type: string, enum: [MALE, FEMALE] }
        voice_id: { type: string, description: 'Logical voice id resolved through the profile `tts.voice_map`.', examples: [ru_male_adult_01] }
    CardIssueKind:
      description: '(additive, I3 E5b) What the ДДС says is wrong with the received card (70 §70.7).'
      type: string
      enum: [MISSING, WRONG, CONTRADICTION, OTHER]
    FlagCardIssueRequest:
      description: '(additive, I3 E5b) «Отметить ошибку в карточке» (`dds_card_check: ON`).'
      type: object
      additionalProperties: false
      required: [assignment_id, issue_kind, comment_ru]
      properties:
        assignment_id: { type: string, format: uuid }
        field_path: { type: [string, 'null'] }
        issue_kind: { $ref: '#/components/schemas/CardIssueKind' }
        comment_ru: { type: string, minLength: 1, maxLength: 2000 }
    CardIssueView:
      description: (additive, I3 E5b) One recorded card-issue flag (`DDS_CARD_ISSUE_FLAGGED`).
      type: object
      additionalProperties: false
      required: [event_id, assignment_id, field_path, issue_kind, comment_ru, at_offset_ms]
      properties:
        event_id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        field_path: { type: [string, 'null'] }
        issue_kind: { $ref: '#/components/schemas/CardIssueKind' }
        comment_ru: { type: string }
        at_offset_ms: { type: integer }
    DdsParticipantTotalsView:
      description: |
        (additive, I3 E5b) One ДДС participant's totals in the report (70 §70.4.5): the legs they
        played (bound to them — or every trainee leg when nobody is bound), the statuses they set
        (TRAINEE `DDS_SERVICE_STATUS_SET`), their primary decisions, refusals and completions, and
        their card-issue flags. Scripted, system and picker-mirror steps count for nobody.
      type: object
      additionalProperties: false
      required: [user_id, display_name_ru, assigned_service_id, legs, status_entries, accepted, not_accepted, refused, completed, card_issues]
      properties:
        user_id: { type: string, format: uuid }
        display_name_ru: { type: string }
        assigned_service_id: { type: [string, 'null'] }
        legs: { type: integer, minimum: 0 }
        status_entries: { type: integer, minimum: 0 }
        accepted: { type: integer, minimum: 0 }
        not_accepted: { type: integer, minimum: 0 }
        refused: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        card_issues: { type: integer, minimum: 0 }
    Arrival:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { $ref: '#/components/schemas/ArrivalKind' }
        offset_ms:
          type: [integer, 'null']
          minimum: 0
          description: Required for `AT_OFFSET` (lesson wall ms since start), forbidden otherwise.
        delay_ms: { type: integer, minimum: 0, default: 0 }
    PlanEntry:
      type: object
      additionalProperties: false
      required: [position, scenario_version_id, arrival]
      properties:
        position: { type: integer, minimum: 1 }
        scenario_version_id: { type: string, format: uuid }
        arrival: { $ref: '#/components/schemas/Arrival' }
        variants: { $ref: '#/components/schemas/VariantsRequest' }
        participants:
          description: E9a hook — per-workstation tasks; absent = every lesson participant.
          type: [array, 'null']
          items: { type: string, format: uuid }
        weight:
          description: E9a hook — difficulty weight in the lesson report.
          type: number
          exclusiveMinimum: 0
          default: 1
        timers:
          description: (additive, I4 E31) Per-card timer override, resolved as scenario ← this entry.
          oneOf:
            - $ref: '#/components/schemas/CardTimersRequest'
            - type: 'null'
    LessonCreateRequest:
      type: object
      additionalProperties: false
      required: [title_ru, session_mode, participants, scenario_plan]
      properties:
        title_ru: { type: string, minLength: 1 }
        session_mode: { $ref: '#/components/schemas/SessionMode' }
        participants:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ParticipantAssignment' }
        variants: { $ref: '#/components/schemas/VariantsRequest' }
        scenario_plan:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PlanEntry' }
        time_scale: { type: number, minimum: 0.1, maximum: 10, default: 1 }
        group_id:
          description: (additive, I3 E9a) The trainee group the lesson is created for — recorded; the participants are the request's own (`404` for an unknown group).
          type: [string, 'null']
          format: uuid
        pass_criteria:
          description: (additive, I5 E38, Q-E9b-3) «Сдал / не сдал» for every card of the lesson, recorded in each card's `SESSION_CREATED.pass_criteria`; absent = the defaults.
          oneOf:
            - $ref: '#/components/schemas/PassCriteriaRequest'
            - type: 'null'
        # --- I7 E53 ---
        shuffle:
          description: >-
            (additive, I7 E53, G12a; ТЗ ¶340) «Случайный порядок карточек». `true`: the server
            draws a seed and permutes the plan's cards once, at creation — each card moves only
            among the positions ticked for the same participants, and every position keeps its
            `arrival` — then records the seed in `LessonDetail.shuffle_seed`. Absent/`false` = the
            request's own order (unchanged). (No `default:` keyword on purpose: the generated
            client would make the key required, and an unticked form sends no key at all.)
          type: boolean
        # --- end I7 E53 ---
    LessonSessionView:
      type: object
      additionalProperties: false
      required: [position, session_id, incident_id, display_number, state, card_status, arrival, variants]
      properties:
        position: { type: integer, minimum: 1 }
        session_id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        display_number: { type: integer }
        state: { $ref: '#/components/schemas/SessionState' }
        card_status: { $ref: '#/components/schemas/CardStatus' }
        arrival: { $ref: '#/components/schemas/Arrival' }
        started_at_lesson_offset_ms: { type: [integer, 'null'] }
        variants: { $ref: '#/components/schemas/SessionVariants' }
    LessonListItem:
      type: object
      additionalProperties: false
      required: [lesson_id, title_ru, session_mode, state, card_count, created_at, created_by_user_id]
      properties:
        lesson_id: { type: string, format: uuid }
        title_ru: { type: string }
        session_mode: { $ref: '#/components/schemas/SessionMode' }
        state: { $ref: '#/components/schemas/LessonState' }
        card_count: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        created_by_user_id: { type: string, format: uuid }
    LessonDetail:
      type: object
      additionalProperties: false
      required: [lesson_id, title_ru, session_mode, state, participants, scenario_plan, sessions, created_at, started_at, completed_at, report_released_at, group_id, created_by_user_id]
      properties:
        lesson_id: { type: string, format: uuid }
        title_ru: { type: string }
        session_mode: { $ref: '#/components/schemas/SessionMode' }
        state: { $ref: '#/components/schemas/LessonState' }
        participants:
          type: array
          items: { $ref: '#/components/schemas/ParticipantAssignment' }
        scenario_plan:
          type: array
          items: { $ref: '#/components/schemas/PlanEntry' }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/LessonSessionView' }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        report_released_at: { type: [string, 'null'], format: date-time }
        group_id:
          description: (additive, I3 E9a) The trainee group the lesson was created for, or `null`.
          type: [string, 'null']
          format: uuid
        created_by_user_id:
          description: >-
            (additive, I5 E39) The lesson's owner — the instructor who created it. Only this
            instructor or an ADMIN may change the lesson (`403 NOT_RESOURCE_OWNER` otherwise).
          type: string
          format: uuid
        # --- I7 E53 ---
        shuffle_seed:
          description: >-
            (additive, I7 E53, G12a) The seed the plan's cards were permuted with at creation
            («Случайный порядок карточек»); `null` = the instructor's own order. A record only:
            `scenario_plan` already is the permuted order, and restarts/replays read it.
          type: [integer, 'null']
          minimum: 0
          maximum: 9007199254740991
        # --- end I7 E53 ---
    LessonReport:
      type: object
      additionalProperties: false
      required: [lesson_id, cards, weighted_total, weighted_max, typical_errors]
      properties:
        lesson_id: { type: string, format: uuid }
        cards:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [position, session_id, weight, score, unscored]
            properties:
              position: { type: integer, minimum: 1 }
              session_id: { type: string, format: uuid }
              weight: { type: number }
              score:
                description: (CHANGED, I4 E31) `null` for an ABORTED card.
                oneOf:
                  - $ref: '#/components/schemas/ScoreReportView'
                  - type: 'null'
              unscored:
                description: (additive, I4 E31) Present exactly when `score` is `null`.
                oneOf:
                  - $ref: '#/components/schemas/UnscoredCardView'
                  - type: 'null'
              norms:
                description: (additive, I4 E33) Per card and per leg; `[]` for an unscored card.
                type: array
                items: { $ref: '#/components/schemas/NormView' }
              failed_rule_count: { type: [integer, 'null'], minimum: 0, description: (additive, I4 E33) }
              critical_error_count: { type: [integer, 'null'], minimum: 0, description: (additive, I4 E33) }
              text_quality:
                description: (additive, I4 E35, §71.12) «Грамотность и адреса»; `null` for an unscored card, exactly like `score`.
                oneOf:
                  - $ref: '#/components/schemas/TextQualityReportView'
                  - type: 'null'
              reaction_times:
                description: (additive, I5 E36, Q-E12-1) Per leg; `[]` for an unscored card, like `norms`.
                type: array
                items: { $ref: '#/components/schemas/LegReactionTimeView' }
              workstation:
                description: (additive, I5 E36, Q-E12-3) The card's participants' logins, joined with ", "; "" for an unscored card.
                type: string
              pass_verdict:
                description: (additive, I5 E38, Q-E9b-3) «Итог» — «сдал / не сдал» under the card's recorded criteria; `null` for an unscored card, exactly like `score`.
                oneOf:
                  - $ref: '#/components/schemas/PassVerdictView'
                  - type: 'null'
        weighted_total: { type: number, description: Scored cards only (unchanged). }
        weighted_max: { type: number }
        typical_errors:
          description: >-
            (additive, I7 E54, G11) «Типичные ошибки» over this lesson's own sessions; empty rows
            for a trainee's own copy of the report (INSTRUCTOR/ADMIN only).
          allOf:
            - $ref: '#/components/schemas/TypicalErrors'
    # ------------------------------------------- I3 E9a: weights & groups ----
    ProposalSource:
      type: string
      enum: [LLM, HEURISTIC]
    WeightProposalLine:
      type: object
      additionalProperties: false
      required: [position, scenario_version_id, current_weight, proposed_weight, reason_ru, accepted_at]
      properties:
        position: { type: integer, minimum: 1 }
        scenario_version_id: { type: string, format: uuid }
        current_weight:
          description: The card's `PlanEntry.weight` now — what the report uses.
          type: number
        proposed_weight: { type: integer, minimum: 1, maximum: 10 }
        reason_ru: { type: string }
        accepted_at: { type: [string, 'null'], format: date-time }
    WeightProposalSet:
      description: A lesson's latest difficulty-weight proposals (70 §70.3.7) — never applied until accepted.
      type: object
      additionalProperties: false
      required: [lesson_id, source, model_name, fallback_reason, requested_at, requested_by_user_id, proposals]
      properties:
        lesson_id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/ProposalSource' }
        model_name: { type: [string, 'null'] }
        fallback_reason:
          description: Why the heuristic answered instead of the LLM (`LLM_TIMEOUT`, `LLM_UNAVAILABLE`, `LLM_INVALID_OUTPUT`), or `null`.
          type: [string, 'null']
        requested_at: { type: string, format: date-time }
        requested_by_user_id: { type: string, format: uuid }
        proposals:
          type: array
          items: { $ref: '#/components/schemas/WeightProposalLine' }
    WeightProposalAcceptRequest:
      type: object
      additionalProperties: false
      required: [positions]
      properties:
        positions:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1 }
    TraineeGroupRequest:
      type: object
      additionalProperties: false
      required: [name_ru]
      properties:
        name_ru: { type: string, minLength: 1, maxLength: 200 }
        member_user_ids:
          type: array
          items: { type: string, format: uuid }
    TraineeGroupMember:
      type: object
      additionalProperties: false
      required: [user_id, username, display_name_ru]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name_ru: { type: string }
    TraineeGroup:
      type: object
      additionalProperties: false
      required: [group_id, name_ru, created_by_user_id, created_at, members]
      properties:
        group_id: { type: string, format: uuid }
        name_ru: { type: string }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        members:
          type: array
          items: { $ref: '#/components/schemas/TraineeGroupMember' }
    IncidentListItem:
      description: One row of «Список происшествий» / «реестр». Deadlines are session offsets; `null` = not applicable yet.
      type: object
      additionalProperties: false
      required:
        - session_id
        - incident_id
        - display_number
        - lesson_id
        - card_status
        - session_state
        - arrived_at_utc
        - session_offset_ms
        - accept_deadline_offset_ms
        - fill_deadline_offset_ms
        - not_completed_deadline_offset_ms
        - classifier_code
        - address_line_ru
        - my_role_type
      properties:
        session_id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        display_number: { type: integer }
        lesson_id: { type: [string, 'null'], format: uuid }
        card_status: { $ref: '#/components/schemas/CardStatus' }
        session_state: { $ref: '#/components/schemas/SessionState' }
        arrived_at_utc: { type: [string, 'null'], format: date-time }
        session_offset_ms: { type: integer, minimum: 0 }
        accept_deadline_offset_ms: { type: [integer, 'null'] }
        fill_deadline_offset_ms: { type: [integer, 'null'] }
        not_completed_deadline_offset_ms: { type: [integer, 'null'] }
        classifier_code: { type: [string, 'null'] }
        address_line_ru:
          description: From the snapshot for a ДДС row, from the live card for a 112 row (never WorldTruth).
          type: [string, 'null']
        my_role_type:
          oneOf:
            - $ref: '#/components/schemas/RoleType'
            - type: 'null'
        service_leg_status:
          description: >-
            ADDITIVE (I7 E50, memo p.40 «Статус службы»): the viewing ДДС participant's own leg
            status. `null` for a 112-register row, an instructor/admin viewer, or an ambiguous
            binding (nobody bound to a single leg).
          oneOf:
            - $ref: '#/components/schemas/ServiceResponseStatus'
            - type: 'null'
        service_leg_status_at_offset_ms:
          description: 'ADDITIVE (I7 E50): when `service_leg_status` was last set.'
          type: [integer, 'null']
    # ----------------------------------------------- I4 E31: instructor core ----
    CardTimersRequest:
      description: |
        (I4 E31) A per-key override of the scenario's `timers` (HLD 30 §30.12), session ms; an
        absent key keeps the scenario value. R39 applies to the resolved result.
      type: object
      additionalProperties: false
      properties:
        accept_within_ms: { type: integer, exclusiveMinimum: 0 }
        fill_within_ms: { type: integer, exclusiveMinimum: 0 }
        not_completed_after_ms: { type: integer, exclusiveMinimum: 0 }
    UnscoredCardView:
      description: (I4 E31) An ABORTED card of the lesson (early end, ТЗ ¶342–343) — actions and times, no points (Q-E9b-6 open).
      type: object
      additionalProperties: false
      required: [state, timeline, times]
      properties:
        state: { $ref: '#/components/schemas/SessionState' }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/TimelineEntryView' }
        times:
          type: object
          additionalProperties: false
          required: [started_at, aborted_at, elapsed_ms]
          properties:
            started_at: { type: [string, 'null'], format: date-time }
            aborted_at: { type: [string, 'null'], format: date-time }
            elapsed_ms: { type: [integer, 'null'], minimum: 0 }
    # ----------------------------------------------- I4 E32: instructor misc ----
    ResultCommentRequest:
      description: (I4 E32) `createSessionComment` / `createLessonComment`.
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        replaces_comment_id:
          description: An edit is a new row that supersedes this one (append-only).
          type: [string, 'null']
          format: uuid
    ResultCommentView:
      description: (I4 E32) One `result_comments` row, oldest first in a list.
      type: object
      additionalProperties: false
      required: [comment_id, session_id, lesson_id, author_user_id, author_display_name_ru, text, created_at, replaces_comment_id, superseded]
      properties:
        comment_id: { type: string, format: uuid }
        session_id: { type: [string, 'null'], format: uuid }
        lesson_id: { type: [string, 'null'], format: uuid }
        author_user_id: { type: string, format: uuid }
        author_display_name_ru: { type: string }
        text: { type: string }
        created_at: { type: string, format: date-time }
        replaces_comment_id: { type: [string, 'null'], format: uuid }
        superseded:
          description: '`true` when a later row''s `replaces_comment_id` points at this one.'
          type: boolean
    ResultCommentList:
      description: (I4 E32) `listSessionComments` / `listLessonComments`.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ResultCommentView' }

    # ------------------------------------------------------------ materials ---- (additive, I4 E34)
    TrainingMaterialView:
      description: (additive, I4 E34) One `training_materials` row (71 §71.11).
      type: object
      additionalProperties: false
      required: [material_id, title_ru, file_name, content_type, size_bytes, sha256, uploaded_by_user_id, created_at, archived_at]
      properties:
        material_id: { type: string, format: uuid }
        title_ru: { type: string }
        file_name: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        uploaded_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        archived_at: { type: [string, 'null'], format: date-time }
    # ------------------------------------ I4 E33: reports, statistics, CSV ----
    NormView:
      description: (I4 E33; I5 E36) One measured interval against the norm the system holds (the session's recorded timers).
      type: object
      additionalProperties: false
      required: [kind, service_id, measured_ms, norm_ms, deviation_ms]
      properties:
        kind:
          type: string
          enum: [ACCEPT, FILL, DDS_FILL]
          description: 'DDS_FILL (additive, I5 E36, Q-E9b-2): the ДДС''s own 3-minute norm, per notified service — the same measured moment as ACCEPT, against the 3-minute limit.'
        service_id:
          type: [string, 'null']
          description: The leg's service for ACCEPT/DDS_FILL; `null` for the 112 FILL interval.
        measured_ms: { type: [integer, 'null'], minimum: 0 }
        norm_ms: { type: integer, minimum: 0 }
        deviation_ms:
          type: [integer, 'null']
          description: measured − norm (positive = late); `null` when not measured.
    LegReactionTimeView:
      description: (additive, I5 E36, Q-E12-1) A leg's two reaction times, delivery (`HANDOFF_RECEIVED`) as the start — no norm.
      type: object
      additionalProperties: false
      required: [service_id, to_open_ms, to_first_status_ms]
      properties:
        service_id: { type: [string, 'null'] }
        to_open_ms:
          type: [integer, 'null']
          minimum: 0
          description: Delivery → the leg's first DDS_CARD_OPENED; `null` if the card was never opened.
        to_first_status_ms:
          type: [integer, 'null']
          minimum: 0
          description: Delivery → the leg's first primary decision; `null` if none was taken.
    TraineeStatisticsRow:
      description: (I4 E33; I5 E36) One trainee's aggregates over their completed, scored sessions.
      type: object
      additionalProperties: false
      required: [trainee_user_id, display_name_ru, session_count, lesson_count, average_percent, failed_rules_by_category, accept_deviation_ms_avg, fill_deviation_ms_avg]
      properties:
        trainee_user_id: { type: string, format: uuid }
        display_name_ru: { type: string }
        session_count: { type: integer, minimum: 0 }
        lesson_count: { type: integer, minimum: 0 }
        average_percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        failed_rules_by_category:
          type: object
          description: '`ScoringCategory` → count of failed rules.'
          additionalProperties: { type: integer, minimum: 0 }
        accept_deviation_ms_avg: { type: [number, 'null'] }
        fill_deviation_ms_avg: { type: [number, 'null'] }
        reaction_to_open_ms_avg:
          description: (additive, I5 E36, Q-E12-1) Mean delivery → DDS_CARD_OPENED, over the legs this trainee played.
          type: [number, 'null']
        reaction_to_status_ms_avg:
          description: (additive, I5 E36, Q-E12-1) Mean delivery → the leg's first primary decision.
          type: [number, 'null']
        pass_count:
          description: (additive, I5 E38, Q-E9b-3) The sessions whose «сдал / не сдал» verdict is «сдал».
          type: integer
          minimum: 0
        pass_rate:
          description: (additive, I5 E38) `100 · pass_count / session_count`; `null` without a session.
          type: [number, 'null']
          minimum: 0
          maximum: 100
    TraineeStatistics:
      description: (I4 E33) `getTraineeStatistics`.
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/TraineeStatisticsRow' }
    MyHistorySession:
      description: (I4 E33) One of the caller's completed sessions; `score_percent` / `failed_rule_count` are `null` until its report is visible to them.
      type: object
      additionalProperties: false
      required: [session_id, lesson_id, scenario_title_ru, completed_at, score_percent, failed_rule_count]
      properties:
        session_id: { type: string, format: uuid }
        lesson_id: { type: [string, 'null'], format: uuid }
        scenario_title_ru: { type: string }
        completed_at: { type: string, format: date-time }
        score_percent: { type: [number, 'null'], minimum: 0, maximum: 100 }
        failed_rule_count: { type: [integer, 'null'], minimum: 0 }
        passed:
          description: >-
            ADDITIVE (I7 E50, ТЗ ¶265 REQ-2220): «сдал / не сдал» under the session's recorded
            criteria (`pass_verdict.session_pass_verdict`); `null` until the report is visible to
            the caller, exactly like `score_percent`.
          type: [boolean, 'null']
        reaction_open_ms:
          description: >-
            ADDITIVE (I7 E50): the caller's own ДДС leg(s), delivery → first `DDS_CARD_OPENED`,
            averaged when more than one leg; `null` without a measured leg (a 112 session, an
            unbound/scripted leg, or before the report is visible).
          type: [integer, 'null']
          minimum: 0
        reaction_first_status_ms:
          description: >-
            ADDITIVE (I7 E50): the caller's own ДДС leg(s), delivery → first primary decision,
            same averaging and `null` rule as `reaction_open_ms`.
          type: [integer, 'null']
          minimum: 0
        text_quality_issue_count:
          description: >-
            ADDITIVE (I7 E50, HLD 71 §71.12): the count of «Грамотность и адреса» flagged
            items (misspellings plus non-`KNOWN` street lookups) over the session's final 112 card
            and ДДС comments; `null` when the checker is unavailable or before the report is
            visible to the caller.
          type: [integer, 'null']
          minimum: 0
    MyHistory:
      description: (I4 E33) `getMyHistory`.
      type: object
      additionalProperties: false
      required: [statistics, sessions]
      properties:
        statistics: { $ref: '#/components/schemas/TraineeStatisticsRow' }
        sessions:
          type: array
          items: { $ref: '#/components/schemas/MyHistorySession' }
    # ------------------------------------------------ I5 E36: trainee rating ----
    TraineeRatingRow:
      description: (additive, I5 E36, Q-E12-2) One ranked trainee.
      type: object
      additionalProperties: false
      required: [rank, trainee_user_id, display_name_ru, average_percent]
      properties:
        rank: { type: integer, minimum: 1 }
        trainee_user_id: { type: string, format: uuid }
        display_name_ru: { type: string }
        average_percent: { type: number, minimum: 0, maximum: 100 }
        pass_count:
          description: (additive, I5 E38, Q-E9b-3) The trainee's sessions judged «сдал» — an additional column; the ranking is unchanged.
          type: integer
          minimum: 0
        pass_rate:
          description: (additive, I5 E38) `100 · pass_count / session_count`.
          type: [number, 'null']
          minimum: 0
          maximum: 100
    TraineeRating:
      description: (additive, I5 E36, Q-E12-2) `getTraineeRating`.
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/TraineeRatingRow' }
    # ------------------------------------------------ I7 E54: typical errors (G11, ТЗ ¶233) -----
    TypicalErrorRow:
      description: (additive, I7 E54, G11) One rule, worst (most failed sessions) first.
      type: object
      additionalProperties: false
      required: [rule_id, name_ru, category, failed_session_count, session_count, share_percent]
      properties:
        rule_id: { type: string }
        name_ru: { type: string }
        category: { $ref: '#/components/schemas/ScoringCategory' }
        failed_session_count: { type: integer, minimum: 0 }
        session_count:
          description: The scope's own session count (the same for every row).
          type: integer
          minimum: 0
        share_percent: { type: number, minimum: 0, maximum: 100 }
    TypicalErrors:
      description: (additive, I7 E54, G11) `getTypicalErrors`, and `LessonReport.typical_errors`.
      type: object
      additionalProperties: false
      required: [rows]
      properties:
        rows:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/TypicalErrorRow' }
    # ------------------------------------------- I4 E35: text quality (§71.12, D35) -----------
    # «Грамотность и адреса» — report-only, no score effect until the owner answers Q-E11-1.
    # This section is E35's own (§71.16: "E35's report-section schema is left out of the delta");
    # it is not in `docs/hld/contracts/i4-openapi-delta.yaml`. `text_quality` is added to
    # `SessionReport` (above) and to `LessonReport.cards.items` (§71.10, above) — both additive,
    # neither in the object's own `required` list, matching I4 E33's own norms/counters.
    MisspelledSpanView:
      description: (I4 E35) One word the ru_RU dictionary does not recognise, as an offset into its field's `text`.
      type: object
      additionalProperties: false
      required: [start, end, word, suggestions]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
        word: { type: string }
        suggestions:
          type: array
          description: Up to three dictionary suggestions, closest first.
          items: { type: string }
    StreetLookupView:
      description: (I4 E35) `ADDRESS_STREET`'s directory lookup against the Moscow OSM street-name list.
      type: object
      additionalProperties: false
      required: [status, suggestions]
      properties:
        status: { type: string, enum: [KNOWN, UNKNOWN, NEAR] }
        suggestions:
          type: array
          description: Close-match directory names; non-empty only when `status` is `NEAR`. Never a correction — the checked text is unchanged.
          items: { type: string }
    TextQualityFieldView:
      description: (I4 E35) One text the trainee typed, checked.
      type: object
      additionalProperties: false
      required: [source, text, misspellings, street]
      properties:
        source:
          type: string
          enum: [ADDRESS_STREET, DESCRIPTION_TEXT, RECIPIENTS_COMMENT, DDS_STATUS_COMMENT, DDS_CARD_ISSUE_COMMENT, DDS_CLOSE_COMMENT]
        text: { type: string }
        misspellings:
          type: array
          items: { $ref: '#/components/schemas/MisspelledSpanView' }
        street:
          description: 'Non-null only for `source: ADDRESS_STREET` (§71.12: street lookup runs on the 112 card path only).'
          oneOf:
            - $ref: '#/components/schemas/StreetLookupView'
            - type: 'null'
    TextQualityReportView:
      description: |
        (I4 E35, HLD 71 §71.12) «Грамотность и адреса». Report-time, read-only, no score effect
        (D35; Q-E11-1 open). `available: false` is the whole report when the ru_RU dictionary or
        the street directory is not installed — rendered as «Проверка недоступна», never as an
        empty `fields` array (SPEC §27's honesty rule: never «0 ошибок» for "did not run").
      type: object
      additionalProperties: false
      required: [available, fields, dictionary_sha256, street_list_sha256, unavailable_message_ru]
      properties:
        available: { type: boolean }
        fields:
          type: array
          items: { $ref: '#/components/schemas/TextQualityFieldView' }
        dictionary_sha256:
          type: [string, 'null']
          description: sha256 of the packaged `reference/lexicon/` dictionary (INV 9); `null` when `available` is `false`.
        street_list_sha256:
          type: [string, 'null']
          description: sha256 of the packaged `reference/streets/` directory; `null` when `available` is `false`.
        unavailable_message_ru:
          type: [string, 'null']
          description: '«Проверка недоступна: словарь/справочник не установлен» when `available` is `false`, else `null`.'
    # --- I5 E38 ---------------------------------------- «сдал / не сдал» (Q-E9b-3 variant г) ----
    PassCriteriaRequest:
      description: |
        (I5 E38, Q-E9b-3) The configurable pass criteria. An omitted key takes its default; an
        explicit `null` (or `false`) switches that criterion off. At least one criterion must be on
        (`422 VALIDATION_ERROR` otherwise).
      type: object
      additionalProperties: false
      properties:
        min_score_percent:
          description: The session's score percent (`100 · total_points / total_max_points`, clamped to 0…100) must be at least this; `null` = off.
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          default: 70
        max_failed_rules:
          description: At most this many rules may have failed; `null` = off.
          type: [integer, 'null']
          minimum: 0
          default: null
        fail_on_critical:
          description: Any critical error means «не сдал»; `false` = off.
          type: boolean
          default: true
    PassCriteriaView:
      description: (I5 E38) The criteria a session was created with (`SESSION_CREATED.pass_criteria`; the defaults for a session created before I5 E38).
      type: object
      additionalProperties: false
      required: [min_score_percent, max_failed_rules, fail_on_critical]
      properties:
        min_score_percent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        max_failed_rules: { type: [integer, 'null'], minimum: 0 }
        fail_on_critical: { type: boolean }
    PassCriterion:
      description: (I5 E38) One criterion of `PassCriteriaView`.
      type: string
      enum: [MIN_SCORE_PERCENT, MAX_FAILED_RULES, CRITICAL_ERRORS]
    PassVerdictView:
      description: |
        (I5 E38, Q-E9b-3) «Сдал / не сдал»: `passed` iff every enabled criterion holds over the
        stored totals and counters. Derived at report time — never stored, never part of the
        score checksum, never changes a score or a rescore.
      type: object
      additionalProperties: false
      required: [passed, failed_criteria, criteria, score_percent, failed_rule_count, critical_error_count]
      properties:
        passed: { type: boolean }
        failed_criteria:
          description: The enabled criteria that did not hold, in `PassCriterion` order; `[]` when `passed`.
          type: array
          items: { $ref: '#/components/schemas/PassCriterion' }
        criteria: { $ref: '#/components/schemas/PassCriteriaView' }
        score_percent:
          description: The percent the verdict read; `null` when the maximum is 0 (then `MIN_SCORE_PERCENT`, if on, fails).
          type: [number, 'null']
          minimum: 0
          maximum: 100
        failed_rule_count: { type: integer, minimum: 0 }
        critical_error_count: { type: integer, minimum: 0 }
