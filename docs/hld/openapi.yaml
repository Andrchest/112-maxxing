  # ------------------------------------------------------------ sessions ----
  /api/v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Create a simulation session (INSTRUCTOR / ADMIN).
      description: |
        Creates one `SimulationSession`, one `Incident` and one `RoleStage` per `role_chain`
        entry, instantiates `WorldTruth` and `CallerBelief` from the version, then fires the
        session machine trigger `validate` (`CREATED → READY`). A `role_chain` of `[DDS]` under
        `SINGLE_ROLE` or `ASSESSMENT` without `expected_response.prefab_handoff` is refused with
        `409 PREFAB_HANDOFF_REQUIRED` (D6, §10.10).

        (additive, I3 E1) `variants` (every field optional) is resolved per switch as
        request → scenario default → product default (70 §70.2.2). A value outside
        `IMPLEMENTED_VARIANT_VALUES` is `409 VARIANT_NOT_AVAILABLE` (checked first); a value outside
        the scenario's `supported` set is `409 VARIANT_NOT_SUPPORTED`. The resolved variants are
        recorded in `SESSION_CREATED.variants` and returned in `SessionDetail.variants`. Under
        `card_source: GENERATED_CARD` the effective role chain is the suffix starting at DDS.

        (additive, I4 E31) `timers` (`CardTimersRequest`, every key optional) overrides the
        scenario `timers` per key: scenario ← request. The resolved timers are recorded in
        `SESSION_CREATED.timers`; a `DEADLINE` rule with `max_offset_timer` reads the recorded
        value (71 §71.8, D34). A result that breaks R39 is `422 VALIDATION_ERROR`.
      x-action: '-'
      x-emits: [SESSION_CREATED, ROLE_STAGE_STARTED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreateRequest' }
      responses:
        '201':
          description: The created session in state `READY` (or `CREATED` if validation deferred).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    get:
      tags: [sessions]
      operationId: listSessions
      summary: List sessions — mine, or all for an instructor.
      description: |
        `scope=MINE` returns the sessions the caller participates in or created.
        `scope=ALL` is permitted for `INSTRUCTOR` and `ADMIN` only; a `TRAINEE` asking for
        `ALL` gets `403 FORBIDDEN_FOR_ROLE`.
      x-action: '-'
      x-emits: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [MINE, ALL]
            default: MINE
        - name: state
          in: query
          required: false
          description: Filter by session state.
          schema: { $ref: '#/components/schemas/SessionState' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Sessions, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SessionListItem' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/sessions/{session_id}:
    get:
      tags: [sessions]
      operationId: getSession
      summary: One session's materialized header.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/start:
    post:
      tags: [sessions]
      operationId: startSession
      summary: Start the session (INSTRUCTOR).
      description: |
        Fires the session trigger `start` (`READY → ACTIVE`, guard `guard_inference_ready`).
        Refused with `503 INFERENCE_NOT_READY` while a required inference service is not
        `READY` and `REQUIRE_INFERENCE_READY=true` (D8, SPEC §37). On success the
        `SimulationRunner` adopts the session and the first `RoleStage` begins; for an
        `OPERATOR_112` first stage the runner fires `ring` shortly afterwards, which is what
        publishes `voice:join` on Redis (D9).
      x-action: start
      x-emits: [SESSION_STARTED, ROLE_STAGE_STARTED, STAGE_STATE_CHANGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The session in state `ACTIVE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/sessions/{session_id}/abort:
    post:
      tags: [sessions]
      operationId: abortSession
      summary: Abort the session (INSTRUCTOR / ADMIN).
      description: |
        Fires `abort` on the session machine and `abort_stage` on the active `RoleStage`.
        Simulation data is preserved: the event log is closed, never deleted (SPEC §39,
        §42 test 14).
      x-action: abort
      x-emits: [SESSION_ABORTED, STAGE_STATE_CHANGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AbortSessionRequest' }
      responses:
        '200':
          description: The session in state `ABORTED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/snapshot:
    get:
      tags: [sessions]
      operationId: getSessionSnapshot
      summary: Role-filtered restore snapshot (browser refresh).
      description: |
        The single REST call the frontend makes after a refresh (SPEC §39, §42 test 13). It
        returns the active stage, its stage state, `available_actions` from the stage's
        `RoleModule`, the role's card or work item, the call state and `last_seq_no`; the
        client then opens the WebSocket and sends `{"type":"resume","after_seq_no":last_seq_no}`
        (D8, `docs/hld/40-realtime-protocol.md` §3).

        Every field is produced through the acting role's `DataVisibilityPolicy`: a `DDS`
        caller never receives `card`, `transcript` or anything sourced from `WorldTruth`.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The snapshot for the caller's role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/events:
    get:
      tags: [sessions]
      operationId: listSessionEvents
      summary: A page of role-filtered session events.
      description: |
        The REST twin of the WebSocket replay: the same envelopes, the same per-role filtering
        by `DataVisibilityPolicy.may_receive` and the same payload redaction table
        (`docs/hld/40-realtime-protocol.md` §4). Events are ordered by ascending `seq_no`;
        `after_seq_no` is exclusive. `has_more` is true when more events exist beyond the page.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - name: after_seq_no
          in: query
          required: false
          description: Exclusive lower bound. Omit or pass 0 to start from the beginning.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: event_type
          in: query
          required: false
          description: Optional filter; still intersected with the role's visible set.
          schema:
            type: array
            items: { $ref: '#/components/schemas/EventType' }
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionEventPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/voice-token:
    post:
      tags: [sessions]
      operationId: createVoiceToken
      summary: Mint a LiveKit access token for the calling participant.
      description: |
        The backend is the only minter of LiveKit tokens (D9): the frontend never holds the
        LiveKit API secret. The token grants join on exactly the room of this session's active
        call and nothing else. Issued only while the session is `ACTIVE` and the caller is the
        participant assigned to an `OPERATOR_112` stage.
        (additive, I3 E6b) With `call_id` of a non-`ENDED` `DdsCall` whose `actor_user_id` is the
        caller: that call's room (re-join after a refresh, INV 13). `ENDED` ⇒ `409`. Absent body
        ⇒ the behaviour above, unchanged.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoiceTokenRequest' }
      responses:
        '200':
          description: A room-scoped LiveKit token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoiceTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/audio/{audio_segment_id}:
    get:
      tags: [reports]
      operationId: getAudioSegment
      summary: Download one audio segment, with HTTP Range.
      description: |
        Serves the WAV bytes of one `audio_segments` row using its `byte_offset` / `byte_length`
        so a Range request needs no scan (`docs/hld/50-voice-pipeline.md` §9.1). Supports
        `Range: bytes=…`, answering `206 Partial Content` with `Content-Range`, and advertises
        `Accept-Ranges: bytes`. A purged segment (`file_path IS NULL`, `purged_at` set) answers
        `410 AUDIO_PURGED` and the report UI renders the transcript without playback (D9).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - name: audio_segment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          description: Standard byte range, e.g. `bytes=0-65535`.
          schema: { type: string }
      responses:
        '200':
          description: The complete segment.
          headers:
            Accept-Ranges:
              schema: { type: string }
            Content-Length:
              schema: { type: integer }
          content:
            audio/wav:
              schema: { type: string, format: binary }
        '206':
          description: The requested byte range.
          headers:
            Accept-Ranges:
              schema: { type: string }
            Content-Range:
              schema: { type: string }
          content:
            audio/wav:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: '`AUDIO_PURGED` — the recording was deleted by the retention policy.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '416':
          description: '`RANGE_NOT_SATISFIABLE`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------- I5 E40: MP3 download (Q-E16-3 variant b) ----
  /api/v1/sessions/{session_id}/audio/{audio_segment_id}/mp3:
    get:
      tags: [reports]
      operationId: getAudioSegmentMp3
      summary: Download one audio segment as MP3 (ТЗ ¶383).
      description: |
        (additive, I5 E40) ТЗ ¶369 allows «MP3 or WAV» for a call recording download and the WAV
        one already exists (`getAudioSegment` above); ¶383 requires MP3 specifically. Owner answer
        2026-09-26, Q-E16-3 variant (б): add the MP3 download, keep the WAV one. Mono, the
        recording's own sample rate (16 kHz today), 64 kbit/s CBR, LAME-encoded, cached under
        `DATA_DIR/recordings` by sha256 of the WAV representation `getAudioSegment` would answer
        with — a repeat request for the same segment is a cache hit, never a re-encode. No `Range`
        support (this is a download, not a seekable stream); the access rule and every error are
        `getAudioSegment`'s (E16 R3/R7) — a caller refused the WAV gets the same refusal here.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - name: audio_segment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The complete segment, as MP3.
          headers:
            Content-Length:
              schema: { type: integer }
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: '`AUDIO_PURGED` — the recording was deleted by the retention policy.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # --------------------------------------------- operator stage commands ----
  /api/v1/sessions/{session_id}/operator/call/answer:
    post:
      tags: [operator]
      operationId: answerCall
      summary: Answer the ringing call.
      description: |
        Fires `answer` (`RINGING → CONNECTED`, guard `guard_participant_assigned_to_stage`).
        Permission `ANSWER_CALL`. The frontend then joins the LiveKit room with the token from
        `createVoiceToken`; the voice-agent is already in the room, having joined on the
        `voice:join` message published at `CALL_RINGING` (D9).
      x-action: answer
      x-emits: [CALL_ANSWERED, STAGE_STATE_CHANGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The new operator stage view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorStageView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/operator/call/end:
    post:
      tags: [operator]
      operationId: endCall
      summary: Hang up the call.
      description: |
        Permission `END_CALL`. Not a stage transition of its own: it ends the call and is the
        precondition of `complete_stage` (guard `guard_call_ended`). The backend publishes
        `voice:cancel:{session_id}` so an in-flight caller response is cancelled across
        processes (D9).
      x-action: end_call
      x-emits: [CALL_ENDED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndCallRequest' }
      responses:
        '200':
          description: The new operator stage view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorStageView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/sessions/{session_id}/operator/card:
    get:
      tags: [operator]
      operationId: getOperatorCard
      summary: The current incident card.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorCardView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/operator/card/field:
    put:
      tags: [operator]
      operationId: setCardField
      summary: Set exactly one card field.
      description: |
        Permission `EDIT_CARD`. Exactly one `field_path` per command — the API has no bulk card
        write, because SPEC §9 requires every mutation to be stored with its previous value and
        actor, and a bulk write would blur which change happened when. The trainee is the only
        writer: ASR never calls this (SPEC §9, §42 test 4), which is structural — the voice-agent
        has no credential for it.

        `field_path` must be a field of the session's card schema — `CARD_FIELDS`
        (`10-domain-model.md` §10.6) for a `v1` card, the pack's schema otherwise (I3 E3a, 70
        §70.5.4) — and the value must match that field's `value_type`; otherwise
        `422 CARD_FIELD_UNKNOWN` or `422 CARD_VALUE_TYPE_MISMATCH`. (Additive, I3 E3a) a value
        that is not one of the field's `options` codes (a v2 select or toggle set) is
        `422 CARD_OPTION_UNKNOWN`. (Additive, I7 E55) a string longer than the field's
        `max_length` (`description.text`: 1999) is `422 CARD_VALUE_TYPE_MISMATCH`. A field hidden
        by `visible_when` is accepted — visibility is advisory. Setting a field to its current
        value is a no-op: it returns `revision: null`,
        appends no revision and emits no event.

        `recipients.services` is **not** settable here; use the service commands.

        (Additive, I3 E2b′, 70 §70.6.4) When the field is `routing_relevant` and the session's
        reference pack has a classifier, the routing resolver runs over the updated card and a
        SIMULATION `RECIPIENTS_RESOLVED` follows `CARD_FIELD_CHANGED` in the same transaction —
        a recorded answer, not a second card revision (INV 4). Like the conditional comment
        write of `createHandoff`, it is not in `x-emits`, which lists what every call emits.
      x-action: edit_card
      x-emits: [CARD_FIELD_CHANGED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCardFieldRequest' }
      responses:
        '200':
          description: The new card plus the `CardRevision` this command created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetCardFieldResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/sessions/{session_id}/operator/card/revisions:
    get:
      tags: [operator]
      operationId: listCardRevisions
      summary: The card's revision history.
      description: |
        Source `CARD_REVISIONS` of the operator's `DataVisibilityPolicy`. This is what makes
        "the final card is NOT enough" (SPEC §9) visible in the UI and the report.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
        - name: field_path
          in: query
          required: false
          description: Optional filter to one card field path.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Revisions ordered by ascending `revision_no`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardRevisionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/operator/services/select:
    post:
      tags: [operator]
      operationId: selectRecipientService
      summary: Add one recipient service to the card.
      description: |
        Permission `SELECT_SERVICES`. Writes `recipients.services`, so it emits
        `CARD_FIELD_CHANGED` **in addition to** `SERVICE_SELECTED`: both the service evaluators
        and the card evaluators must be self-sufficient from the log alone (D5,
        `10-domain-model.md` §10.6). Selecting an already selected service is a no-op.
      x-action: select_services
      x-emits: [CARD_FIELD_CHANGED, SERVICE_SELECTED]
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceSelectionRequest' }
      responses:
        '200':
