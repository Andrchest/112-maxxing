# HLD — Backend REST contract (D8, SPEC §34)
#
# Elaborates docs/hld/00-decisions.md D8 against docs/SPEC.md. Every schema name, field name,
# enum member and field path is copied literally from docs/hld/10-domain-model.md; nothing here
# renames or redefines a domain identifier. Frontend TypeScript types are generated from this
# file by `openapi-typescript` (D12) and the gate fails when they are stale.
#
# Conventions:
#   - every command returns the new materialized view for the acting role (D8);
#   - every operation carries `x-action` (the RoleModule ActionDescriptor.action_id it maps to,
#     or `-` when it is not a RoleModule action) and `x-emits` (the SessionEvent types it
#     appends, in append order);
#   - schemas that may contain WorldTruth or FactAccessGate internals carry
#     `x-visibility: INSTRUCTOR` and are returned only by /api/v1/instructor/** and the report;
#   - errors are RFC 7807 `application/problem+json` with a machine-readable `code`.
openapi: 3.1.0
info:
  title: System-112 / DDS training simulator — backend API
  version: 1.0.0
  summary: Commands and resources for the local emergency-response training simulator.
  description: |
    REST command/resource API under `/api/v1` (D8). Realtime session updates travel over the
    WebSocket channel specified in `docs/hld/40-realtime-protocol.md`; raw microphone audio
    travels over LiveKit and never over this API (SPEC §34).

    Authorisation of every command is two-gated (D8): the caller's participant record must be
    assigned to the session's active `RoleStage`, **and** the stage's `RoleModule` must permit
    the action in the current stage state. A failure of the first gate is `403 FORBIDDEN_FOR_ROLE`;
    of the second, `409 ACTION_NOT_AVAILABLE`. An illegal state-machine trigger is
    `409 INVALID_TRANSITION`.
  license:
    name: Proprietary
servers:
  - url: http://localhost:8000
    description: Local docker-compose backend (SPEC §36).
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Local username/password authentication, HS256 JWT (D8).
  - name: scenarios
    description: Scenario and ScenarioVersion reference data, import and validation (SPEC §4, D4).
  - name: sessions
    description: Session lifecycle, role-filtered snapshot, event page and LiveKit token.
  - name: operator
    description: Operator 112 stage commands (`Operator112Module`, SPEC §7, §9, §10).
  - name: dds
    description: DDS stage commands (`DDSModule`, SPEC §7, §11).
  - name: instructor
    description: Instructor console. The only place WorldTruth and gate internals are exposed.
  - name: reports
    description: Deterministic post-session report, re-scoring, audio and telemetry (SPEC §28, §29).
  - name: health
    description: Liveness and per-service readiness (SPEC §37, D8).
  - name: admin
    description: Retention purge and inference health administration (SPEC §41, D9).
  - name: reference
    description: (additive, I3 E2a) The reference pack — manifest, service catalog, classifier (70 §70.6, D18).
  - name: lessons
    description: (additive, I3 E4a) Lessons (занятия) — a stream of cards as N ordinary sessions (70 §70.3, D15).
  - name: incidents
    description: (additive, I3 E4a) The caller's cross-session incident list (70 §70.3.6).
  - name: telephony
    description: (additive, I3 E6e) The SIP gateway's endpoints — softphone dial, leg reports, call read, per-user HA1 (80 §80.2.3). Service credential only.
  - name: materials
    description: (additive, I4 E34) Methodical materials — the reference base (71 §71.11).
  - name: statistics
    description: (additive, I4 E33) Per-trainee statistics and own history (71 §71.10).

paths:

  # ---------------------------------------------------------------- auth ----
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: loginUser
      summary: Exchange username and password for a JWT.
      description: Local accounts only; no external identity provider (SPEC §41).
      security: []
      x-action: '-'
      x-emits: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' } # additive, I7 E51 (G5)

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The authenticated user account.
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/users:
    get:
      tags: [auth]
      operationId: listUsers
      summary: List user accounts (additive, E7; CHANGED I4 E28) — INSTRUCTOR / ADMIN only.
      description: |
        (I4 E28) Plus `include_inactive` (ADMIN only; an INSTRUCTOR passing it — any value — is
        `403`). Without it only active accounts are listed, as before. Items are `UserAccountI4`
        (adds `is_active`).
      x-action: '-'
      x-emits: []
      parameters:
        - name: role
          in: query
          required: false
          schema: { $ref: '#/components/schemas/UserRole' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: include_inactive
          in: query
          required: false
          description: (additive, I4 E28) ADMIN only.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: User accounts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UserAccountI4' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------- I5 E37: profile JSON export (Q-E16-4) ----
  /api/v1/users/{user_id}/profile-export:
    get:
      tags: [auth]
      operationId: exportUserProfile
      summary: Download one account's profile as JSON (self or ADMIN) — Q-E16-4, ТЗ ¶363.
      description: |
        Account fields (id, username, display_name_ru, user_role, is_active, created_at — never
        the password hash or the SIP HA1, SPEC §41) plus the E33 history summary
        (`TraineeStatisticsRow`) for a TRAINEE account, `null` for INSTRUCTOR/ADMIN. Allowed for
        the account itself or ADMIN only — an INSTRUCTOR reading another account's profile is
        `403`. Downloads as `profile-<username>.json`. Audited like every operation (E25).
      x-action: '-'
      x-emits: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The profile, as a JSON file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfileExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------- accounts (I4 E28) ----
  /api/v1/admin/users:
    post:
      tags: [admin]
      operationId: createUser
      summary: Create an account of any role (ADMIN) — ТЗ ¶195.
      description: |
        (I4 E28) Password hashed with argon2 as today; shorter than the configured minimum is
        `422 VALIDATION_ERROR`; an existing username is `409 USERNAME_TAKEN`. Audited by E25's
        middleware (no session event).
      x-action: '-'
      x-emits: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: The created account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccountI4' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/admin/users/{user_id}:
    patch:
      tags: [admin]
      operationId: updateUser
      summary: Change role, display name or block/unblock (ADMIN) — ТЗ ¶196, ¶197.
      description: |
        (I4 E28) Every field optional. Guards: an ADMIN cannot block or demote itself
        (`409 SELF_MODIFICATION_FORBIDDEN`); the last active ADMIN cannot be blocked or demoted
        (`409 LAST_ADMIN_REQUIRED`). A blocked user's existing token is refused on the next
        request (`get_current_user` already checks `is_active`).
      x-action: '-'
      x-emits: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: The account after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccountI4' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/admin/users/{user_id}/password:
    post:
      tags: [admin]
      operationId: resetUserPassword
      summary: Set a new password for an account (ADMIN).
      description: |
        (I4 E28) The password is never echoed, logged or audited in clear (E25 records the
        operation, not the body).
      x-action: '-'
      x-emits: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204':
          description: The password was replaced.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ------------------------------------------------- admin monitoring (I4 E29) ----
  /api/v1/admin/audit-log:
    get:
      tags: [admin]
      operationId: listAuditLog
      summary: Page the audit log written by E25 (ADMIN) — ТЗ ¶205, ¶296.
      description: (I4 E29) Filters by user, action and period; paged, newest first.
      x-action: '-'
      x-emits: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: action
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AuditAction' }
        - name: from
          in: query
          required: false
          description: Inclusive lower bound (UTC).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Exclusive upper bound (UTC).
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: with_changes
          in: query
          required: false
          description: (additive, I7 E43) «Только с изменениями» — only entries whose `changes` is non-empty.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Audit entries, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntryView' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/usage-stats:
    get:
      tags: [admin]
      operationId: getUsageStats
      summary: Per-day usage counts (ADMIN) — ТЗ ¶206; metric set to be confirmed (Q-E14-3).
      description: |
        (I4 E29) Per-day counts of logins, sessions, lessons and active users, from `audit_log`,
        `simulation_sessions` and `lessons`. An absent `from`/`to` defaults to a 30-day window
        ending now (a technical choice; Q-E14-3 confirms only the metric set).
      x-action: '-'
      x-emits: []
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive lower bound (UTC).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Exclusive upper bound (UTC).
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: One row per calendar day in the period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/server-load:
    get:
      tags: [admin]
      operationId: getServerLoad
      summary: CPU / memory / disk (+ GPU when visible) of the server (ADMIN) — ТЗ ¶208, ¶289.
      description: |
        (I4 E29) Read from `/proc/stat`, `/proc/meminfo`, `shutil.disk_usage`; GPU from the
        voice-agent heartbeat if it carries it, else `null`. An absent metric is `null`, never
        `0` (SPEC §27 rule).
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: A point-in-time load sample.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerLoad' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/errors:
    get:
      tags: [admin]
      operationId: getErrorReport
      summary: Errors and failures over a period (ADMIN) — ТЗ ¶207.
      description: |
        (I4 E29) Merges backend JSON-log records with level >= ERROR (`SIM_LOG_DIR`, E25),
        `MODEL_ERROR` session events and `INFERENCE_HEALTH_CHANGED` transitions to FATAL, newest
        first.
      x-action: '-'
      x-emits: []
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive lower bound (UTC).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Exclusive upper bound (UTC).
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Error records.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ErrorRecordView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/alerts:
    get:
      tags: [admin]
      operationId: listAdminAlerts
      summary: Current administrator alerts, derived not stored (ADMIN) — ТЗ ¶308.
      description: (I4 E29) Covers FATAL latches, a stale or failed backup, and repeated login failures.
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: Active alerts (empty list = nothing to report).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminAlertView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/backup-status:
    get:
      tags: [admin]
      operationId: getBackupStatus
      summary: The last backup as recorded by E26's `backups/last.json` (ADMIN) — ТЗ ¶143, ¶216.
      description: '(I4 E29) `available: false` when no `last.json` is readable.'
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: The backup status, or `available = false` when no `last.json` is readable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------- I5 E37: settings XML export (Q-E16-1) ----
  /api/v1/admin/settings/export:
    get:
      tags: [admin]
      operationId: exportSettingsXml
      summary: The effective, non-secret settings as XML (ADMIN) — Q-E16-1.
      description: |
        `<settings version="1"><setting name="SIM_…">value</setting>…</settings>` — every secret
        (passwords, keys, tokens, the JWT secret, DB URLs with credentials) is omitted entirely,
        never masked-in-place (SPEC §41). Import is CLI only (`make settings-import FILE=<xml>`,
        `docs/RUNBOOK.md`) — never an HTTP write, so no authenticated ADMIN session can apply a
        settings change to the running process by accident.
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: The settings, as an XML file.
          content:
            application/xml:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------- scenarios ----
  /api/v1/scenarios:
    get:
      tags: [scenarios]
      operationId: listScenarios
      summary: List scenarios (identity only — slug and title).
      description: |
        (additive, I4 E32) `include_archived` (default `false`) — every picker hides archived
        scenarios unless it asks for them; `ScenarioSummary` gains `archived_at`.
      x-action: '-'
      x-emits: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: include_archived
          in: query
          required: false
          description: (additive, I4 E32)
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Scenarios.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScenarioSummary' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/scenarios/{scenario_id}/versions:
    get:
      tags: [scenarios]
      operationId: listScenarioVersions
      summary: List the versions of one scenario.
      description: |
        `locked_at` is non-null once the first session used the version; a locked version's
        `content` can never change (D4, SPEC §42 test 6).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/ScenarioIdParam'
      responses:
        '200':
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScenarioVersionListItem' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/scenarios/versions/{scenario_version_id}/summary:
    get:
      tags: [scenarios]
      operationId: getScenarioVersionSummary
      summary: Trainee-safe summary of a scenario version.
      description: |
        Deliberately free of `world_truth`, `caller_knowledge`, `disclosure_rules`,
        `expected_response`, `world_events` and `scoring_rules`: a trainee who can read this
        endpoint must learn nothing a briefing would not tell them (SPEC §2, D3).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/ScenarioVersionIdParam'
      responses:
        '200':
          description: Trainee-safe summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioVersionTraineeSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/scenarios/import:
    post:
      tags: [scenarios]
      operationId: importScenarioVersion
      summary: Import a scenario version file (INSTRUCTOR / ADMIN).
      description: |
        The body is the complete YAML or JSON document of one `ScenarioVersion`
        (`docs/hld/30-scenario-format.md`). The server runs `validate_scenario_version`
        (the complete §30.8 list) before writing. Re-importing changed content under an
        existing version number is rejected: `409 SCENARIO_VERSION_LOCKED` when the version
        is locked, `409 SCENARIO_VERSION_EXISTS` otherwise — bump the version (D4).
      x-action: '-'
      x-emits: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioImportRequest' }
      responses:
        '201':
          description: The version was validated and stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioVersionListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: |
            `SCENARIO_INVALID` — the document failed load-time validation. The problem carries
            the complete `validation_report`; nothing was written.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ScenarioProblem' }

  /api/v1/scenarios/validate:
    post:
      tags: [scenarios]
      operationId: validateScenarioFile
      summary: Validate a scenario file without importing it (INSTRUCTOR / ADMIN).
      description: |
        Dry run of `validate_scenario_version`. Always `200`: an invalid document is reported
        in the body as `valid: false` plus issues, because this endpoint's purpose is authoring
        feedback, not command execution.
      x-action: '-'
      x-emits: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScenarioImportRequest' }
      responses:
        '200':
          description: The validation report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioValidationReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/scenarios/versions/{scenario_version_id}/validation-report:
    get:
      tags: [scenarios]
      operationId: getScenarioValidationReport
      summary: The stored validation report of an imported version.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/ScenarioVersionIdParam'
      responses:
        '200':
          description: The report recorded at import time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioValidationReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- I7 E53: download a scenario version (G14a; ТЗ ¶222, ¶229) ---
  /api/v1/scenarios/versions/{scenario_version_id}/document:
    get:
      tags: [scenarios]
      operationId: getScenarioVersionDocument
      summary: (additive, I7 E53) Download a stored scenario version as YAML or JSON (INSTRUCTOR / ADMIN).
      description: |
        The version's complete stored document (the one `importScenarioVersion` stored), as a file
        named `<slug>-v<version>.<format>`. Instructor-only: it carries `world_truth`, the caller
        layers and `scoring_rules`, which no trainee may read (D3). Versions are immutable (D4), so
        «редактировать» is: download → change (at least `version`) → upload as the next version;
        uploading the file unchanged is the idempotent re-import. Audited like every request (E25).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/ScenarioVersionIdParam'
        - name: format
          in: query
          required: false
          description: (I7 E53) `yaml` (default) or `json`.
          schema: { type: string, enum: [yaml, json], default: yaml }
      responses:
        '200':
          description: The scenario document (`format`).
          content:
            application/yaml:
              schema: { type: string }
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # --- end I7 E53 ---

  # ------------------------------------------ I4 E32: scenario archive ----
  /api/v1/scenarios/{scenario_id}/archive:
    post:
      tags: [scenarios]
      operationId: archiveScenario
      summary: Archive (= «удалить неактуальный») a scenario (INSTRUCTOR / ADMIN) — ТЗ ¶229.
      description: Sets `scenarios.archived_at` (idempotent). Existing sessions and versions are untouched (FK RESTRICT stays).
      x-action: '-'
      x-emits: []
