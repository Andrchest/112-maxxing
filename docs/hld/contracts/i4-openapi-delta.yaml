# HLD — I4 contract delta (docs/hld/71-i4-wave4.md, D29–D35)
#
# A standalone OpenAPI 3.1 FRAGMENT. It is not served and not used for type generation: each
# implementing epic (E28, E29, E31, E32, E33, E34 — see docs/hld/90-tbd-epics.md "I4 TBD epics")
# merges its part into docs/hld/openapi.yaml in the same commit as the code, copying names literally.
# E25 (audit) exposes no operation of its own (its read side is E29's listAuditLog); E35's report
# section is not here (71 §71.16).
#
# Conventions (as in openapi.yaml and i3-openapi-delta.yaml):
#   - `x-epic` names the epic that merges the item;
#   - `x-change: NEW | CHANGED | ADDITIVE` — CHANGED replaces a definition, ADDITIVE only adds
#     optional or new required-in-response properties to an existing schema;
#   - `x-optional: true` — the epic merges the item only if it takes the technical option named
#     in 71 (E32 `getLessonBoard`);
#   - `x-action` / `x-emits` as in openapi.yaml;
#   - references to unchanged definitions point into openapi.yaml.
openapi: 3.1.0
info:
  title: System-112 / DDS training simulator — I4 contract delta
  version: 1.2.0-i4-delta
  summary: New and changed operations and schemas of initiative I4 wave 4 (accounts, admin monitoring, timers, comments, scenario archive, statistics, CSV, materials).

security:
  - bearerAuth: []

tags:
  - name: admin
  - name: auth
  - name: sessions
  - name: lessons
  - name: reports
  - name: scenarios
  - name: statistics
    description: (additive, I4 E33) Per-trainee statistics and own history (71 §71.10).
  - name: materials
    description: (additive, I4 E34) Methodical materials — the reference base (71 §71.11).

paths:

  # ------------------------------------------------------------ E28 accounts ----
  /api/v1/users:
    get:
      tags: [auth]
      operationId: listUsers
      x-epic: E28
      x-change: CHANGED
      summary: List user accounts — now optionally including blocked ones (ADMIN).
      description: |
        As before (openapi.yaml), plus `include_inactive` (ADMIN only; an INSTRUCTOR passing it
        gets `403`). Without it only active accounts are listed, as today. `UserAccount` gains
        `is_active` (UserAccountI4).
      x-action: '-'
      x-emits: []
      parameters:
        - name: role
          in: query
          required: false
          schema: { $ref: '../openapi.yaml#/components/schemas/UserRole' }
        - name: include_inactive
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: User accounts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UserAccountI4' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

  /api/v1/admin/users:
    post:
      tags: [admin]
      operationId: createUser
      x-epic: E28
      x-change: NEW
      summary: Create an account of any role (ADMIN) — ТЗ ¶195.
      description: |
        Password hashed with argon2 as today; shorter than the configured minimum is
        `422 VALIDATION_ERROR`; an existing username is `409 USERNAME_TAKEN`. Audited by E25's
        middleware (no session event).
      x-action: '-'
      x-emits: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: The created account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccountI4' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ConflictI4' }
        '422': { $ref: '../openapi.yaml#/components/responses/UnprocessableEntity' }

  /api/v1/admin/users/{user_id}:
    patch:
      tags: [admin]
      operationId: updateUser
      x-epic: E28
      x-change: NEW
      summary: Change role, display name or block/unblock (ADMIN) — ТЗ ¶196, ¶197.
      description: |
        Every field optional. Guards: an ADMIN cannot block or demote themself
        (`409 SELF_MODIFICATION_FORBIDDEN`); the last active ADMIN cannot be blocked or demoted
        (`409 LAST_ADMIN_REQUIRED`). A blocked user's existing token is refused on the next request
        (`get_current_user` already checks `is_active`).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: The account after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccountI4' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictI4' }
        '422': { $ref: '../openapi.yaml#/components/responses/UnprocessableEntity' }

  /api/v1/admin/users/{user_id}/password:
    post:
      tags: [admin]
      operationId: resetUserPassword
      x-epic: E28
      x-change: NEW
      summary: Set a new password for an account (ADMIN).
      description: The password is never echoed, logged or audited in clear (E25 records the operation, not the body).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204':
          description: The password was replaced.
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '422': { $ref: '../openapi.yaml#/components/responses/UnprocessableEntity' }

  # ------------------------------------------------- E29 admin monitoring ----
  /api/v1/admin/audit-log:
    get:
      tags: [admin]
      operationId: listAuditLog
      x-epic: E29
      x-change: NEW
      summary: Page the audit log written by E25 (ADMIN) — ТЗ ¶205, ¶296.
      x-action: '-'
      x-emits: []
      parameters:
        - name: user_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: action
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AuditAction' }
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Audit entries, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntryView' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

  /api/v1/admin/usage-stats:
    get:
      tags: [admin]
      operationId: getUsageStats
      x-epic: E29
      x-change: NEW
      summary: Per-day usage counts (ADMIN) — ТЗ ¶206; metric set to be confirmed (Q-E14-3).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
      responses:
        '200':
          description: One row per calendar day in the period.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageStats' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

  /api/v1/admin/server-load:
    get:
      tags: [admin]
      operationId: getServerLoad
      x-epic: E29
      x-change: NEW
      summary: CPU / memory / disk (+ GPU when visible) of the server (ADMIN) — ТЗ ¶208, ¶289.
      description: |
        Read from `/proc/stat`, `/proc/meminfo`, `shutil.disk_usage`; GPU from the voice-agent
        heartbeat if it carries it. An absent metric is `null`, never 0 (SPEC §27 rule).
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: A point-in-time load sample.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerLoad' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

  /api/v1/admin/errors:
    get:
      tags: [admin]
      operationId: getErrorReport
      x-epic: E29
      x-change: NEW
      summary: Errors and failures over a period (ADMIN) — ТЗ ¶207.
      description: |
        Merges backend JSON-log records with level ≥ ERROR (`SIM_LOG_DIR`, E25), `MODEL_ERROR`
        session events and `INFERENCE_HEALTH_CHANGED` transitions to FATAL, newest first.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Error records.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ErrorRecordView' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

  /api/v1/admin/alerts:
    get:
      tags: [admin]
      operationId: listAdminAlerts
      x-epic: E29
      x-change: NEW
      summary: Current administrator alerts, derived not stored (ADMIN) — ТЗ ¶308.
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: Active alerts (empty list = nothing to report).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AdminAlertView' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

  /api/v1/admin/backup-status:
    get:
      tags: [admin]
      operationId: getBackupStatus
      x-epic: E29
      x-change: NEW
      summary: The last backup as recorded by E26's `backups/last.json` (ADMIN) — ТЗ ¶143, ¶216.
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: The backup status, or `available = false` when no `last.json` is readable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupStatus' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

  /api/v1/admin/recordings/purge:
    post:
      tags: [admin]
      operationId: purgeRecordings
      x-epic: E29
      x-change: CHANGED
      summary: Purge recordings past the retention window (ADMIN) — now refused without a fresh backup.
      description: |
        As before (openapi.yaml), plus ТЗ ¶216: a non-dry-run purge is `409 BACKUP_REQUIRED` unless
        `backups/last.json` reports a successful backup newer than every row being purged.
        `dry_run: true` is never refused.
      x-action: '-'
      x-emits: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/PurgeRecordingsRequest' }
      responses:
        '200':
          description: What was purged, or would be purged under `dry_run`.
          content:
            application/json:
              schema: { $ref: '../openapi.yaml#/components/schemas/PurgeRecordingsResult' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ConflictI4' }

  # ------------------------------------------------------ E31 instructor core ----
  /api/v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      x-epic: E31
      x-change: ADDITIVE
      summary: Create a simulation session — now with an optional per-card timer override.
      description: |
        As before (openapi.yaml), plus `timers` (SessionCreateRequestI4): resolved as scenario
        `timers` ← request override per key, recorded in `SESSION_CREATED.timers`. A DEADLINE rule
        with `max_offset_timer` reads the recorded value (71 §71.8, D34).
      x-action: '-'
      x-emits: [SESSION_CREATED, ROLE_STAGE_STARTED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreateRequestI4' }
      responses:
        '201':
          description: The created session.
          content:
            application/json:
              schema: { $ref: '../openapi.yaml#/components/schemas/SessionDetail' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }
        '422': { $ref: '../openapi.yaml#/components/responses/UnprocessableEntity' }

  /api/v1/lessons/{lesson_id}/report:
    get:
      tags: [lessons]
      operationId: getLessonReport
      x-epic: [E31, E33]
      x-change: CHANGED
      summary: The lesson report — now listing ABORTED cards unscored (E31) and per-card norms (E33).
      description: |
        E31: a card whose session was aborted (early lesson end, ТЗ ¶342–343) is listed with
        `score: null` and `unscored` (state, timeline, times); the weighted sum ignores it.
        E33: every scored card carries `norms` (measured vs the system's norm), `failed_rule_count`
        and `critical_error_count`. Nothing is re-scored (D11).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '200':
          description: The lesson report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonReportI4' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }

  # ------------------------------------------------------ E32 instructor misc ----
  /api/v1/reports/{session_id}/comments:
    get:
      tags: [reports]
      operationId: listSessionComments
      x-epic: E32
      x-change: NEW
      summary: Instructor comments on a session result — ТЗ ¶236, ¶237, ¶267.
      description: |
        INSTRUCTOR / ADMIN always; the session's TRAINEE exactly when the report is visible to them
        (the same `report_visibility` gate, else `403 REPORT_NOT_RELEASED`). Superseded rows are
        returned with `superseded: true`.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: Comments, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultCommentList' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [reports]
      operationId: createSessionComment
      x-epic: E32
      x-change: NEW
      summary: Add a comment (or an edit, as a new row) to a session result (INSTRUCTOR / ADMIN).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResultCommentRequest' }
      responses:
        '201':
          description: The stored comment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultCommentView' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '422': { $ref: '../openapi.yaml#/components/responses/UnprocessableEntity' }

  /api/v1/lessons/{lesson_id}/comments:
    get:
      tags: [lessons]
      operationId: listLessonComments
      x-epic: E32
      x-change: NEW
      summary: Instructor comments on a lesson result — the lesson equivalent of listSessionComments.
      description: Trainee access follows the lesson report's release (every card released).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '200':
          description: Comments, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultCommentList' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
    post:
      tags: [lessons]
      operationId: createLessonComment
      x-epic: E32
      x-change: NEW
      summary: Add a comment (or an edit, as a new row) to a lesson result (INSTRUCTOR / ADMIN).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResultCommentRequest' }
      responses:
        '201':
          description: The stored comment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultCommentView' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '422': { $ref: '../openapi.yaml#/components/responses/UnprocessableEntity' }

  /api/v1/scenarios:
    get:
      tags: [scenarios]
      operationId: listScenarios
      x-epic: E32
      x-change: ADDITIVE
      summary: List scenarios — archived ones hidden unless asked for.
      description: |
        As before (openapi.yaml), plus `include_archived` (default `false`, so every picker hides
        archived scenarios); `ScenarioSummary` gains `archived_at` (ScenarioSummaryI4).
      x-action: '-'
      x-emits: []
      parameters:
        - name: include_archived
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Scenarios.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ScenarioSummaryI4' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }

  /api/v1/scenarios/{scenario_id}/archive:
    post:
      tags: [scenarios]
      operationId: archiveScenario
      x-epic: E32
      x-change: NEW
      summary: Archive (= «удалить неактуальный») a scenario (INSTRUCTOR / ADMIN) — ТЗ ¶229.
      description: Sets `scenarios.archived_at` (idempotent). Existing sessions and versions are untouched (FK RESTRICT stays).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/ScenarioIdParam'
      responses:
        '200':
          description: The scenario after archiving.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioSummaryI4' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

  /api/v1/scenarios/{scenario_id}/unarchive:
    post:
      tags: [scenarios]
      operationId: unarchiveScenario
      x-epic: E32
      x-change: NEW
      summary: Return an archived scenario to the pickers (INSTRUCTOR / ADMIN).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/ScenarioIdParam'
      responses:
        '200':
          description: The scenario after unarchiving.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScenarioSummaryI4' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

  /api/v1/lessons/{lesson_id}/board:
    get:
      tags: [lessons]
      operationId: getLessonBoard
      x-epic: E32
      x-change: NEW
      x-optional: true
      summary: All-trainees board of one lesson (INSTRUCTOR / ADMIN) — Q&A L786–789, ТЗ ¶224, ¶235.
      description: |
        Merged only if E32 takes the read-model option instead of `getLesson` + one WS per active
        card (71 §71.9; a technical choice). One row per card of the lesson.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '200':
          description: The board rows.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [lesson_id, rows]
                properties:
                  lesson_id: { type: string, format: uuid }
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/LessonBoardRow' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

  # ------------------------------------------- E33 reports, statistics, CSV ----
  /api/v1/lessons/{lesson_id}/report.csv:
    get:
      tags: [lessons]
      operationId: getLessonReportCsv
      x-epic: E33
      x-change: NEW
      summary: The lesson report as CSV — ТЗ ¶360, ¶379.
      description: |
        Same access and numbers as `getLessonReport`. UTF-8 with BOM, `;` separator, Russian
        column headers; one row per card (and per leg for the norms).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '200':
          description: The CSV file.
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
