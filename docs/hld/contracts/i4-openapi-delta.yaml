components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserIdParam:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionIdParam:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    LessonIdParam:
      name: lesson_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MaterialIdParam:
      name: material_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    FromParam:
      name: from
      in: query
      required: false
      description: Inclusive lower bound (UTC).
      schema: { type: string, format: date-time }
    ToParam:
      name: to
      in: query
      required: false
      description: Exclusive upper bound (UTC).
      schema: { type: string, format: date-time }
    TraineeIdQueryParam:
      name: trainee_id
      in: query
      required: false
      schema: { type: string, format: uuid }
    GroupIdQueryParam:
      name: group_id
      in: query
      required: false
      schema: { type: string, format: uuid }

  responses:
    ConflictI4:
      description: |
        Everything of openapi.yaml's `Conflict`, plus `USERNAME_TAKEN`,
        `SELF_MODIFICATION_FORBIDDEN`, `LAST_ADMIN_REQUIRED` (E28) and `BACKUP_REQUIRED` (E29).
      content:
        application/problem+json:
          schema: { $ref: '../openapi.yaml#/components/schemas/Problem' }
    UnprocessableEntityI4:
      description: openapi.yaml's `UnprocessableEntity`, plus `MATERIAL_TYPE_NOT_ALLOWED`, `MATERIAL_TOO_LARGE` (E34).
      content:
        application/problem+json:
          schema: { $ref: '../openapi.yaml#/components/schemas/Problem' }

  schemas:

    # ------------------------------------------------------------ errors ----
    ProblemCodeI4Additions:
      x-epic: [E28, E29, E34]
      x-change: ADDITIVE
      x-additive-to: '../openapi.yaml#/components/schemas/ProblemCode'
      type: string
      enum:
        - USERNAME_TAKEN               # E28
        - SELF_MODIFICATION_FORBIDDEN  # E28
        - LAST_ADMIN_REQUIRED          # E28
        - BACKUP_REQUIRED              # E29
        - MATERIAL_TYPE_NOT_ALLOWED    # E34
        - MATERIAL_TOO_LARGE           # E34

    # ---------------------------------------------------------- accounts ----
    UserAccountI4:
      x-epic: E28
      x-change: ADDITIVE
      x-additive-to: '../openapi.yaml#/components/schemas/UserAccount'
      type: object
      additionalProperties: false
      required: [id, username, display_name_ru, user_role, created_at, is_active]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name_ru: { type: string }
        user_role: { $ref: '../openapi.yaml#/components/schemas/UserRole' }
        created_at: { type: string, format: date-time }
        is_active:
          type: boolean
          description: (additive, I4 E28) `false` = blocked (ТЗ ¶197); refused at login and per request.
    UserCreateRequest:
      x-epic: E28
      x-change: NEW
      type: object
      additionalProperties: false
      required: [username, display_name_ru, user_role, password]
      properties:
        username: { type: string, minLength: 1 }
        display_name_ru: { type: string, minLength: 1 }
        user_role: { $ref: '../openapi.yaml#/components/schemas/UserRole' }
        password:
          type: string
          writeOnly: true
          description: Minimum length from config; never logged or audited.
    UserUpdateRequest:
      x-epic: E28
      x-change: NEW
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name_ru: { type: string, minLength: 1 }
        user_role: { $ref: '../openapi.yaml#/components/schemas/UserRole' }
        is_active: { type: boolean }
    PasswordResetRequest:
      x-epic: E28
      x-change: NEW
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, writeOnly: true }

    # ----------------------------------------------------- admin monitoring ----
    AuditAction:
      x-epic: [E25, E29]
      x-change: NEW
      description: The `audit_log.action` CHECK list (HLD 20 §20.11.1), written by E25, read by E29.
      type: string
      enum: [HTTP_REQUEST, LOGIN_SUCCEEDED, LOGIN_FAILED, ACCESS_DENIED, WS_CONNECTED]
    AuditOutcome:
      x-epic: [E25, E29]
      x-change: NEW
      type: string
      enum: [OK, DENIED, ERROR]
    AuditEntryView:
      x-epic: E29
      x-change: NEW
      description: One `audit_log` row. Never carries request or response bodies.
      type: object
      additionalProperties: false
      required: [id, ts, user_id, role, action, operation_id, method, path_template, target_ids, status, client_ip, outcome]
