# HLD — I3 contract delta (docs/hld/70-i3-alignment.md, D14–D18)
#
# A standalone OpenAPI 3.1 FRAGMENT. It is not served and not used for type generation: each
# implementing epic (E1, E2, E4, E3, E5 — see docs/hld/90-tbd-epics.md "I3 TBD epics") merges its
# part into docs/hld/openapi.yaml in the same commit as the code, copying names literally.
#
# Conventions (as in openapi.yaml):
#   - `x-epic` names the epic that merges the item;
#   - `x-change: NEW | CHANGED | ADDITIVE` — CHANGED replaces a definition, ADDITIVE only adds
#     optional or new required-in-response properties to an existing schema;
#   - `x-action` / `x-emits` as in openapi.yaml;
#   - references to unchanged definitions point into openapi.yaml.
openapi: 3.1.0
info:
  title: System-112 / DDS training simulator — I3 contract delta
  version: 1.1.0-i3-delta
  summary: New and changed operations and schemas of initiative I3 (variants, lessons, reference data, ДДС leg statuses).

security:
  - bearerAuth: []

tags:
  - name: sessions
  - name: lessons
  - name: incidents
  - name: reference
  - name: operator
  - name: dds

paths:

  /api/v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      x-epic: E1
      x-change: CHANGED
      summary: Create a simulation session (INSTRUCTOR / ADMIN) — now with variants.
      description: |
        As before (openapi.yaml), plus: `variants` (every field optional) is resolved per switch as
        request → scenario default → product default (70 §70.2.2). A value outside
        `IMPLEMENTED_VARIANT_VALUES` is `409 VARIANT_NOT_AVAILABLE` (checked first); a value outside
        the scenario's `supported` set is `409 VARIANT_NOT_SUPPORTED`. The resolved variants are
        recorded in `SESSION_CREATED.variants` and returned in `SessionDetail.variants`. Under
        `card_source: GENERATED_CARD` the effective role chain is the suffix starting at DDS.
      x-action: '-'
      x-emits: [SESSION_CREATED, ROLE_STAGE_STARTED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreateRequest' }
      responses:
        '201':
          description: The created session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetailI3' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictI3' }
        '422': { $ref: '../openapi.yaml#/components/responses/UnprocessableEntity' }

  /api/v1/lessons:
    post:
      tags: [lessons]
      operationId: createLesson
      x-epic: E4
      x-change: NEW
      summary: Create a lesson (занятие) of N cards (INSTRUCTOR / ADMIN).
      description: |
        Validates the whole plan and creates **every** plan session at once through the existing
        `createSession` path (each `READY`, with `lesson_id` / `lesson_position`), in one Unit of
        Work. Nothing ticks until `startLesson`. Refusals are those of `createSession` for the
        offending entry, with `detail` naming its `position`.
      x-action: '-'
      x-emits: [SESSION_CREATED, ROLE_STAGE_STARTED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LessonCreateRequest' }
      responses:
        '201':
          description: The created lesson in state `CREATED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonDetail' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictI3' }
        '422': { $ref: '../openapi.yaml#/components/responses/UnprocessableEntity' }
    get:
      tags: [lessons]
      operationId: listLessons
      x-epic: E4
      x-change: NEW
      summary: List lessons — mine, or all for an instructor.
      x-action: '-'
      x-emits: []
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [MINE, ALL], default: MINE }
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/LessonState' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Lessons, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LessonListItem' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }

  /api/v1/lessons/{lesson_id}:
    get:
      tags: [lessons]
      operationId: getLesson
      x-epic: E4
      x-change: NEW
      summary: A lesson with its plan and the per-card status of every session.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '200':
          description: The lesson.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonDetail' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

  /api/v1/lessons/{lesson_id}/start:
    post:
      tags: [lessons]
      operationId: startLesson
      x-epic: E4
      x-change: NEW
      summary: Start the lesson (`CREATED → ACTIVE`); the LessonRunner then starts cards by arrival.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '200':
          description: The lesson in state `ACTIVE`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonDetail' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictI3' }

  /api/v1/lessons/{lesson_id}/abort:
    post:
      tags: [lessons]
      operationId: abortLesson
      x-epic: E4
      x-change: NEW
      summary: Abort the lesson and every non-terminal card session.
      x-action: '-'
      x-emits: [SESSION_ABORTED]
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/AbortSessionRequest' }
      responses:
        '200':
          description: The lesson in state `ABORTED`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonDetail' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictI3' }

  /api/v1/lessons/{lesson_id}/report:
    get:
      tags: [lessons]
      operationId: getLessonReport
      x-epic: E4
      x-change: NEW
      summary: The N card reports of a completed lesson plus the weighted sum.
      description: |
        Composes the existing per-session `ScoreReportView`s; no new evaluator. Trainee access
        follows the per-session release rule (a lesson release releases every card, `x-emits: []`).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '200':
          description: The lesson report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonReport' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictI3' }

  /api/v1/instructor/lessons/{lesson_id}/report/release:
    post:
      tags: [lessons]
      operationId: releaseLessonReport
      x-epic: E4
      x-change: NEW
      summary: Release every card report of the lesson to its trainees (idempotent, no event).
      description: |
        Calls the existing per-session release for every card; sets `incidents.card_status` to
        `CHECKED` where the projection allows it (70 §70.4.6). Emits no event (HLD 20 §20.3).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/LessonIdParam'
      responses:
        '200':
          description: The lesson after release.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonDetail' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictI3' }

  /api/v1/incidents:
    get:
      tags: [incidents]
      operationId: listMyIncidents
      x-epic: E4
      x-change: NEW
      summary: The caller's cross-session incident list (ДДС «Список происшествий», 112 «реестр»).
      description: |
        One row per session the caller participates in (optionally one lesson), with the materialised
        `card_status` and the deadline offsets; the client renders countdowns from
        `session_offset_ms` and never decides a status. A ДДС trainee sees rows only once the card
        has arrived (its session is `ACTIVE` or terminal).
      x-action: '-'
      x-emits: []
      parameters:
        - name: lesson_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: role_type
          in: query
          required: false
          schema: { $ref: '../openapi.yaml#/components/schemas/RoleType' }
        - name: card_status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/CardStatus' }
        - name: q
          in: query
          required: false
          description: Search over display number, address and classifier code («Поиск»).
          schema: { type: string }
      responses:
        '200':
          description: Incidents, newest arrival first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/IncidentListItem' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }

  /api/v1/reference/manifest:
    get:
      tags: [reference]
      operationId: getReferenceManifest
      x-epic: E2
      x-change: NEW
      summary: The reference packs and the sha256 of every reference file.
      x-action: '-'
      x-emits: []
      responses:
        '200':
          description: '`reference/manifest.json`, verbatim.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceManifest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }

  /api/v1/reference/services:
    get:
      tags: [reference]
      operationId: listReferenceServices
      x-epic: E2
      x-change: NEW
      summary: The service catalog («СЛУЖБЫ 112») of a pack.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/PackQueryParam'
        - name: include_hidden
          in: query
          required: false
          description: 'Include `display: false` and `deprecated` entries (labels for old logs).'
          schema: { type: boolean, default: false }
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Catalog entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceCatalogEntry' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

  /api/v1/reference/classifier:
    get:
      tags: [reference]
      operationId: searchClassifier
      x-epic: E2
      x-change: NEW
      summary: Search the incident classifier (v_046_24) of a pack — the «Класс.:» picker.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/PackQueryParam'
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Matching rows (routing omitted; fetch one row for it).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ClassifierRowSummary' }
                  total: { type: integer, minimum: 0 }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

  /api/v1/reference/classifier/{code}:
    get:
      tags: [reference]
      operationId: getClassifierRow
      x-epic: E2
      x-change: NEW
      summary: One classifier row with its routing cells (instructor tooling, resolver fixtures).
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '#/components/parameters/PackQueryParam'
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassifierRow' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

  /api/v1/reference/card-schema/{schema_id}:
    get:
      tags: [reference]
      operationId: getCardSchema
      x-epic: E3
      x-change: NEW
      summary: A card schema (`v1` / `v2`) as field specs — the same `CardFieldSpec` the card views carry.
      x-action: '-'
      x-emits: []
      parameters:
        - name: schema_id
          in: path
          required: true
          schema: { type: string, examples: [v1, v2] }
      responses:
        '200':
          description: The schema.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardSchemaView' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/operator/services/deselect:
    post:
      tags: [operator]
      operationId: deselectRecipientService
      x-epic: E2
      x-change: CHANGED
      summary: Remove a manually added service — refused for every service under a schema-v2 card.
      description: |
        Unchanged for a `v1` card. Under `card_schema: v2` any removal is
        `409 SERVICE_REMOVAL_FORBIDDEN` (memo p.14, REQ-5275, 70 C10); an automatically resolved
        service can never be removed on either schema, because it is not in `recipients.services`.
      x-action: select_services
      x-emits: [SERVICE_DESELECTED]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceSelectionRequest' }
      responses:
        '200':
          description: The new selection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceSelectionView' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictI3' }

  /api/v1/sessions/{session_id}/dds/legs:
    get:
      tags: [dds]
      operationId: listDdsLegs
      x-epic: E5
      x-change: NEW
      summary: Every leg of the card with its status history — each notified service sees all of them.
      x-action: '-'
      x-emits: []
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/SessionIdParam'
      responses:
        '200':
          description: The legs, in notification-list order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DdsLegView' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

  /api/v1/sessions/{session_id}/dds/legs/{assignment_id}/open:
    post:
      tags: [dds]
      operationId: openDdsCard
      x-epic: E5
      x-change: NEW
      summary: The ДДС opens the card on its leg (technical status «Получена службой»).
      description: |
        Idempotent: a second call on a leg past `ADDED` appends nothing and returns the leg.
      x-action: open_card
      x-emits: [DDS_CARD_OPENED, DDS_SERVICE_STATUS_SET]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/SessionIdParam'
        - $ref: '#/components/parameters/AssignmentIdParam'
      responses:
        '200':
          description: The leg.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdsLegView' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenI3' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictI3' }

  /api/v1/sessions/{session_id}/dds/legs/{assignment_id}/status:
    post:
      tags: [dds]
      operationId: setDdsServiceStatus
      x-epic: E5
      x-change: NEW
      summary: Set the next response status of one service's leg (the memo's pencil form).
      description: |
        Fires one `SERVICE_RESPONSE_TRANSITIONS` trigger (70 §70.4.2). An `ADDED` leg is first moved to
        `RECEIVED`. Out-of-sequence status ⇒ `409 INVALID_TRANSITION`; missing comment on
        `NOT_ACCEPTED` / `REFUSED` ⇒ `422 COMMENT_REQUIRED`; a leg bound to another participant ⇒
        `403 FORBIDDEN_FOR_SERVICE`; `dds_mode: RESOURCE_PICKER` ⇒ `409 ACTION_NOT_AVAILABLE`. The
        trainee's first primary decision also fires the stage's `acknowledge`; no other stage trigger
        is fired (memo mode never enters `RESOURCE_SELECTION` … `WORKING`, 70 §70.4.4). Due deadline
        events are appended first (flush-before-append).
      x-action: set_service_status
      x-emits: [DDS_CARD_STATUS_CHANGED, DDS_SERVICE_STATUS_SET, DDS_ACKNOWLEDGED, STAGE_STATE_CHANGED]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/SessionIdParam'
        - $ref: '#/components/parameters/AssignmentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetServiceStatusRequest' }
      responses:
        '200':
          description: The leg after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DdsLegView' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenI3' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictI3' }
        '422': { $ref: '#/components/responses/UnprocessableEntityI3' }

  /api/v1/sessions/{session_id}/dds/close:
    post:
      tags: [dds]
      operationId: closeDdsIncident
      x-epic: E5a
      x-change: CHANGED
      summary: Close the DDS stage — memo mode closes from ACKNOWLEDGED through the one additive row.
      description: |
        Picker mode unchanged (`RESOLVED --close--> CLOSED`). Memo mode: fires `close` from
        `ACKNOWLEDGED` (additive `DDS_TRANSITIONS` row, guard `memo_all_legs_terminal` — every leg
        `COMPLETED`, `NOT_ACCEPTED` or `REFUSED`) and then from `RESOLVED`, in one Unit of Work; a leg
        still open ⇒ `409 INVALID_TRANSITION`. In picker mode the new guard always denies (70 §70.4.4).
      x-action: close
      x-emits: [STAGE_STATE_CHANGED, DDS_INCIDENT_CLOSED, ROLE_STAGE_COMPLETED, STAGE_STATE_CHANGED, SCORING_RULE_EVALUATED, SESSION_COMPLETED]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/CloseIncidentRequest' }
      responses:
        '200':
          description: The session after closure (response unchanged).
          content:
            application/json:
              schema: { $ref: '../openapi.yaml#/components/schemas/SessionDetail' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictI3' }

  /api/v1/sessions/{session_id}/dds/card-issues:
    post:
      tags: [dds]
      operationId: flagDdsCardIssue
      x-epic: E5
      x-change: NEW
      summary: 'The ДДС flags an error in the received card (only `dds_card_check: ON`).'
      description: |
        Records the flag against the frozen snapshot only; the DDS never sees the truth (INV 3).
        `dds_card_check: OFF` ⇒ `409 ACTION_NOT_AVAILABLE`.
      x-action: flag_card_issue
      x-emits: [DDS_CARD_ISSUE_FLAGGED]
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/SessionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlagCardIssueRequest' }
      responses:
        '201':
          description: The recorded flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardIssueView' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ForbiddenI3' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictI3' }
        '422': { $ref: '#/components/responses/UnprocessableEntityI3' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    LessonIdParam:
      name: lesson_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssignmentIdParam:
      name: assignment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PackQueryParam:
      name: pack
      in: query
      required: false
      description: Reference pack id; default = the newest pack in the manifest.
      schema: { type: string, examples: [v046_24-r1, legacy-r1] }

  responses:
    ConflictI3:
      description: |
        Everything of openapi.yaml's `Conflict`, plus `VARIANT_NOT_SUPPORTED`,
